window.G2DAY08 = {"intro":{"title":"Приём дня: смотри на разности","body":"<p>Первое, что делают с незнакомым рядом, — выписывают, <b>на сколько<\/b> каждое следующее число отличается от предыдущего:<\/p><div class=\"mono\">3   7   11   15   ?\n  +4  +4   +4   +4  → 19<\/div><p>Если разности одинаковые — прибавляй ту же величину.<\/p><p><b>Если разности растут<\/b>, посмотри на них ещё раз: 1, 2, 4, 7, 11 — разности 1, 2, 3, 4, значит дальше +5.<\/p><p><b>Если число растёт слишком быстро<\/b>, проверь умножение: 2, 6, 18 — каждое втрое больше предыдущего.<\/p><p><b>Хитрый случай.<\/b> В ряду 1, 1, 2, 3, 5, 8 каждое число — сумма двух предыдущих.<\/p>"},"questions":[{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 5, 10, 15, 20, ?","opts":["21","24","25","30"],"ans":2,"hint":"На сколько растёт ряд каждый раз?","ex":"Каждый раз прибавляем 5: 20 + 5 = <b>25<\/b>."},{"type":"mcq","topic":"Растущие разности","q":"Продолжи ряд: 1, 2, 4, 7, 11, ?","opts":["14","15","16","18"],"ans":2,"hint":"Выпиши разности: 1, 2, 3, 4… Какая следующая?","ex":"Разности растут на единицу: 1, 2, 3, 4, значит дальше +5. 11 + 5 = <b>16<\/b>."},{"type":"mcq","topic":"Убывающие ряды","q":"Продолжи ряд: 100, 90, 80, ?","opts":["60","70","75","85"],"ans":1,"hint":"Ряд убывает — значит вычитаем одно и то же.","ex":"Каждый раз вычитаем 10: 80 &minus; 10 = <b>70<\/b>."},{"type":"mcq","topic":"Пропущенное число","q":"Какое число пропущено: 7, 14, ?, 28","opts":["15","20","21","24"],"ans":2,"hint":"Между 7 и 14 шаг 7. Значит и дальше шаг тот же.","ex":"14 + 7 = <b>21<\/b>, и 21 + 7 = 28. ✓"},{"type":"mcq","topic":"Умножение в ряду","q":"Продолжи ряд: 2, 6, 18, ?","opts":["24","36","54","72"],"ans":2,"hint":"Разности тут не помогают — посмотри, во сколько раз растут числа.","ex":"Каждое число втрое больше предыдущего: 18 × 3 = <b>54<\/b>."},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 3, 7, 11, 15, ?","ans":19,"hint":"Разности одинаковые.","ex":"Каждый раз прибавляем 4: 15 + 4 = <b>19<\/b>."},{"type":"open","topic":"Убывающие ряды","q":"Продолжи ряд: 64, 32, 16, ?","ans":8,"hint":"Числа не уменьшаются на одно и то же — а во сколько раз они меняются?","ex":"Каждое число вдвое меньше предыдущего: 16 ÷ 2 = <b>8<\/b>."},{"type":"open","topic":"Далёкий член ряда","q":"Какое число будет десятым в ряду 2, 4, 6, 8, …?","ans":20,"hint":"Это чётные числа по порядку: первое 2, второе 4…","ex":"Десятое число — это 2 × 10 = <b>20<\/b>."},{"type":"open","topic":"Далёкий член ряда","q":"В ряду 1, 4, 7, 10, … какое число стоит на шестом месте?","ans":16,"hint":"От первого числа до шестого прибавление произошло 5 раз, а не 6.","ex":"Шаг 3, прибавляем его 5 раз: 1 + 3 × 5 = 1 + 15 = <b>16<\/b>. Проверка по ряду: 1, 4, 7, 10, 13, 16. ✓"},{"type":"open","topic":"Хитрые ряды","q":"Продолжи ряд: 1, 1, 2, 3, 5, 8, ?","ans":13,"hint":"Сложи два последних числа.","ex":"Каждое число — сумма двух предыдущих: 5 + 8 = <b>13<\/b>."}]};
window.G2DAY09 = {"intro":{"title":"Приём дня: превращаем рисунок в числа","body":"<p>Задача показывает три-четыре первые фигуры и спрашивает про дальнюю. Рисовать её целиком не нужно — нужно найти правило.<\/p><p><b>Что делать по шагам:<\/b><\/p><ul><li>Посчитай, из скольких палочек (точек, кубиков) состоит каждая фигура.<\/li><li>Выпиши эти числа в ряд.<\/li><li>Найди, на сколько растёт ряд, — дальше это обычная числовая закономерность.<\/li><\/ul><p><b>Главная ловушка.<\/b> Первая фигура — особенная: у неё нет соседа слева. Поэтому в ряду квадратов из спичек первый стоит 4 спички, а каждый следующий добавляет только 3 — общая сторона уже есть.<\/p>"},"questions":[{"type":"mcq","topic":"Фигурные ряды","fig":"grid:3,1","q":"Из спичек выкладывают в ряд квадраты с общими сторонами: на 1 квадрат уходит 4 спички, на 2 — уже 7, на 3 — 10. Сколько спичек уйдёт на 5 квадратов?","opts":["15","16","19","20"],"ans":1,"hint":"Первый квадрат — 4 спички, каждый следующий добавляет по 3. Сколько «следующих»?","ex":"После первого добавляется ещё 4 квадрата по 3 спички: 4 + 3 × 4 = <b>16<\/b>."},{"type":"mcq","topic":"Точечные фигуры","fig":"dots:1,4,9,?","q":"Фигуры складывают из точек: в первой 1 точка, во второй 4, в третьей 9. Сколько точек будет в четвёртой фигуре?","opts":["12","14","16","20"],"ans":2,"hint":"Квадрат из точек — это одинаковое число рядов и столбцов.","ex":"4-я фигура — квадрат 4 на 4: 4 × 4 = <b>16<\/b> точек."},{"type":"mcq","topic":"Треугольные числа","q":"Продолжи ряд: 1, 3, 6, ?","opts":["8","9","10","12"],"ans":2,"exfig":"triangles:1,3,6,?","hint":"Разности: 2, 3… Какая следующая?","ex":"Разности растут на единицу, значит дальше +4: 6 + 4 = <b>10<\/b>."},{"type":"mcq","topic":"Лесенки","fig":"stairs:1,2,3,4","q":"Лесенку складывают из кубиков: в первом столбике 1 кубик, во втором 2, в третьем 3, в четвёртом 4. Сколько всего кубиков в лесенке?","opts":["8","9","10","12"],"ans":2,"hint":"Сложи 1 + 2 + 3 + 4.","ex":"1 + 2 + 3 + 4 = <b>10<\/b> кубиков."},{"type":"mcq","topic":"Повторяющийся узор","q":"Бусины нанизывают узором: красная, синяя, синяя, красная, синяя, синяя, и так далее. Какого цвета девятая бусина?","opts":["Красная","Синяя","Зелёная","Определить нельзя"],"ans":1,"hint":"Узор повторяется каждые три бусины. На каком месте внутри тройки стоит девятая?","ex":"Девятая бусина замыкает третью тройку, а третья в тройке всегда <b>синяя<\/b>."},{"type":"open","topic":"Фигурные ряды","q":"Сколько спичек нужно, чтобы выложить в ряд 8 квадратов с общими сторонами (на первый квадрат — 4 спички, на каждый следующий — ещё 3)?","ans":25,"hint":"Не умножай 3 на 8 — первый квадрат уже посчитан отдельно.","ex":"4 + 3 × 7 = 4 + 21 = <b>25<\/b> спичек."},{"type":"open","topic":"Точечные фигуры","q":"Сколько точек будет в 6-й фигуре ряда 1, 4, 9, 16, …?","ans":36,"hint":"Это квадраты: 1×1, 2×2, 3×3…","ex":"6-я фигура — квадрат 6 на 6: 6 × 6 = <b>36<\/b> точек."},{"type":"open","topic":"Лесенки","q":"Лесенка сложена из столбиков по 1, 2, 3, 4, 5 и 6 кубиков. Сколько всего кубиков в лесенке?","ans":21,"exfig":"stairs:1,2,3,4,5,6","hint":"Складывай парами с краёв: 1 + 6, 2 + 5, 3 + 4.","ex":"Три пары по 7: 7 × 3 = <b>21<\/b> кубик."},{"type":"open","topic":"Фигурные ряды","fig":"tristrip:3","q":"Из палочек выкладывают треугольники в ряд, соседние имеют общую сторону: на 1 треугольник — 3 палочки, на каждый следующий — ещё 2. Сколько палочек нужно на 7 треугольников?","ans":15,"hint":"Первый треугольник особенный, остальных шесть.","ex":"3 + 2 × 6 = 3 + 12 = <b>15<\/b> палочек."},{"type":"open","topic":"Повторяющийся узор","q":"Бусины нанизывают по кругу узором: красная, синяя, жёлтая, красная, синяя, жёлтая… Какой по счёту будет третья жёлтая бусина?","ans":9,"hint":"Жёлтая — каждая третья: 3-я, 6-я…","ex":"Жёлтые стоят на местах 3, 6, <b>9<\/b>. Третья жёлтая — девятая по счёту."}]};
window.G2DAY10 = {"intro":{"title":"Приём дня: рисуем полоски","body":"<p>В текстовой задаче каждую величину рисуют полоской. Одинаковые доли — одинаковой длины. Тогда ответ становится видно.<\/p><p><b>Модель «в несколько раз больше».<\/b> «У Оли втрое больше, чем у Кати»:<\/p><div class=\"mono\">Катя  [__]                 ← 1 доля\nОля   [__][__][__]         ← 3 доли\nВсего 4 доли<\/div><p>Находим одну долю — делим всё на число долей. Дальше считается сразу.<\/p><p><b>Модель «на столько-то больше».<\/b> Убери разницу — останутся две одинаковые доли: (сумма &minus; разница) ÷ 2 = меньшая величина.<\/p><p>Рисуй полоски даже в лёгкой задаче: привычка рисовать спасает в трудной.<\/p>"},"questions":[{"type":"mcq","topic":"Поровну","q":"У Вани и Пети вместе 20 марок, причём поровну. Сколько марок у Вани?","opts":["5","10","15","20"],"ans":1,"exfig":"parts:20,10,10","hint":"Поровну — значит пополам.","ex":"20 ÷ 2 = <b>10<\/b> марок."},{"type":"mcq","topic":"Во сколько раз больше","q":"У Оли в 3 раза больше наклеек, чем у Кати. Вместе у них 24 наклейки. Сколько наклеек у Кати?","opts":["4","6","8","12"],"ans":1,"exfig":"bars:Катя=1;Оля=3;@total=24","hint":"Катя — 1 доля, Оля — 3 доли. Сколько долей всего?","ex":"Всего 1 + 3 = 4 доли: 24 ÷ 4 = <b>6<\/b> наклеек у Кати. У Оли 18. Проверка: 6 + 18 = 24. ✓"},{"type":"mcq","topic":"Во сколько раз больше","q":"Ленту длиной 15 см разрезали на две части так, что одна вдвое длиннее другой. Какова длина короткой части?","opts":["3 см","5 см","7 см","10 см"],"ans":1,"exfig":"bars:короткая=1;длинная=2;@total=15 см","hint":"Короткая — 1 доля, длинная — 2 доли.","ex":"Всего 3 доли: 15 ÷ 3 = <b>5 см<\/b>. Длинная часть 10 см."},{"type":"mcq","topic":"На сколько больше","q":"У Миши на 6 конфет больше, чем у Даши. Вместе у них 20 конфет. Сколько конфет у Даши?","opts":["6","7","8","13"],"ans":1,"exfig":"bars:Даша=1;Миша=1+6;@total=20","hint":"Убери разницу из суммы — останутся две одинаковые доли.","ex":"(20 &minus; 6) ÷ 2 = <b>7<\/b> конфет у Даши. У Миши 13. Проверка: 7 + 13 = 20. ✓"},{"type":"mcq","topic":"Во сколько раз больше","q":"В двух коробках 25 карандашей, причём во второй в 4 раза больше, чем в первой. Сколько карандашей в первой коробке?","opts":["4","5","6","20"],"ans":1,"exfig":"bars:первая=1;вторая=4;@total=25","hint":"Первая — 1 доля, вторая — 4 доли.","ex":"Всего 5 долей: 25 ÷ 5 = <b>5<\/b> карандашей в первой, 20 во второй."},{"type":"open","topic":"Поровну","q":"Брат и сестра собрали вместе 30 грибов и разделили их поровну. Сколько грибов у брата?","ans":15,"hint":"Поровну на двоих.","ex":"30 ÷ 2 = <b>15<\/b> грибов."},{"type":"open","topic":"Во сколько раз больше","q":"У Ани в 2 раза больше конфет, чем у Веры. Всего у них 18 конфет. Сколько конфет у Ани?","ans":12,"exfig":"bars:Вера=1;Аня=2;@total=18","hint":"Вера — 1 доля, Аня — 2 доли, всего 3 доли.","ex":"18 ÷ 3 = 6 конфет у Веры, у Ани две доли: 6 × 2 = <b>12<\/b>. Проверка: 6 + 12 = 18. ✓"},{"type":"open","topic":"На сколько больше","q":"У Пети на 4 машинки больше, чем у Саши, а вместе у них 16 машинок. Сколько машинок у Пети?","ans":10,"exfig":"bars:Саша=1;Петя=1+4;@total=16","hint":"Сначала найди, сколько у Саши: убери разницу и раздели пополам.","ex":"(16 &minus; 4) ÷ 2 = 6 машинок у Саши. У Пети 6 + 4 = <b>10<\/b>. Проверка: 6 + 10 = 16. ✓"},{"type":"open","topic":"Доли отрезка","fig":"segment:4,2,10 см","q":"Отрезок разделили на 4 равные части. Две такие части вместе составляют 10 см. Чему равна длина всего отрезка в сантиметрах?","ans":20,"hint":"Сначала узнай длину одной части.","ex":"Одна часть: 10 ÷ 2 = 5 см. Весь отрезок: 5 × 4 = <b>20 см<\/b>."},{"type":"open","topic":"Поровну","q":"Три друга разделили 21 наклейку поровну. Сколько наклеек получил каждый?","ans":7,"hint":"Делим на троих.","ex":"21 ÷ 3 = <b>7<\/b> наклеек."}]};
window.G2DAY11 = {"intro":{"title":"Приём дня: два разных «больше»","body":"<p>В задачах встречаются два непохожих вопроса, и путать их нельзя:<\/p><ul><li><b>«На сколько больше»<\/b> — это <b>вычитание<\/b>. 15 больше 9 на 6.<\/li><li><b>«Во сколько раз больше»<\/b> — это <b>деление<\/b>. 20 больше 5 в 4 раза.<\/li><\/ul><p>Обратные действия работают так же:<\/p><ul><li>«на 5 больше» → прибавить 5, «на 5 меньше» → вычесть 5;<\/li><li>«в 5 раз больше» → умножить на 5, «в 5 раз меньше» → разделить на 5.<\/li><\/ul><p><b>Проверяй словами.<\/b> Получил ответ — перескажи задачу с числами и убедись, что всё сходится.<\/p>"},"questions":[{"type":"mcq","topic":"Разностное сравнение","q":"На сколько 15 больше, чем 9?","opts":["4","5","6","24"],"ans":2,"hint":"«На сколько» — вычитание.","ex":"15 &minus; 9 = <b>6<\/b>."},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 20 больше, чем 5?","opts":["В 2 раза","В 3 раза","В 4 раза","В 15 раз"],"ans":2,"hint":"«Во сколько раз» — деление.","ex":"20 ÷ 5 = 4, значит <b>в 4 раза<\/b>."},{"type":"mcq","topic":"Кратное сравнение","q":"У Пети 24 марки, а у Вани 6. Во сколько раз у Пети больше марок, чем у Вани?","opts":["В 3 раза","В 4 раза","В 6 раз","На 18 марок"],"ans":1,"hint":"Раздели большее на меньшее.","ex":"24 ÷ 6 = 4, значит у Пети <b>в 4 раза<\/b> больше."},{"type":"mcq","topic":"Разностное сравнение","q":"У Маши 7 конфет, а у Даши на 5 конфет больше. Сколько конфет у Даши?","opts":["2","10","12","35"],"ans":2,"hint":"«На 5 больше» — прибавляем.","ex":"7 + 5 = <b>12<\/b> конфет."},{"type":"mcq","topic":"Обратная задача","q":"Число 30 в 3 раза больше задуманного числа. Какое число задумали?","opts":["9","10","27","90"],"ans":1,"hint":"Если известное число больше в 3 раза, то задуманное меньше в 3 раза.","ex":"30 ÷ 3 = <b>10<\/b>. Проверка: 10 × 3 = 30. ✓"},{"type":"open","topic":"Разностное сравнение","q":"На сколько 62 больше, чем 48?","ans":14,"hint":"Вычитание.","ex":"62 &minus; 48 = <b>14<\/b>."},{"type":"open" window.G2DAY12 = {"intro":{"title":"Приём дня: иди от ответа назад","body":"<p>Если в задаче известно, <b>что получилось в конце<\/b>, а спрашивают про начало, — иди от конца к началу и меняй каждое действие на обратное:<\/p><div class=\"mono\">прибавили  →  вычитаем\nвычли      →  прибавляем\nумножили   →  делим\nразделили  →  умножаем<\/div><p><b>Порядок важен.<\/b> Раскручивай действия в обратном порядке: последнее, что сделали, отменяй первым.<\/p><div class=\"mono\">задумали → ×2 → +3 → получили 17\n17 − 3 = 14 → 14 ÷ 2 = 7<\/div><p><b>Всегда проверяй вперёд.<\/b> 7 × 2 = 14, 14 + 3 = 17. ✓ Проверка занимает секунды и ловит почти любую ошибку.<\/p>"},"questions":[{"type":"mcq","topic":"Обратный ход","q":"Задумали число, прибавили к нему 8 и получили 20. Какое число задумали?","opts":["10","12","18","28"],"ans":1,"hint":"Прибавляли — значит теперь вычитай.","ex":"20 &minus; 8 = <b>12<\/b>. Проверка: 12 + 8 = 20. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Число умножили на 3 и получили 21. Какое это число?","opts":["6","7","18","63"],"ans":1,"hint":"Умножали — значит теперь дели.","ex":"21 ÷ 3 = <b>7<\/b>. Проверка: 7 × 3 = 21. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Из числа вычли 15 и получили 25. Какое это число?","opts":["10","30","40","45"],"ans":2,"hint":"Вычитали — значит теперь прибавляй.","ex":"25 + 15 = <b>40<\/b>. Проверка: 40 &minus; 15 = 25. ✓"},{"type":"mcq","topic":"Обратный ход","q":"У Кати было несколько конфет. Она съела 4, и у неё осталось 9. Сколько конфет было у Кати?","opts":["5","12","13","14"],"ans":2,"hint":"Верни съеденные конфеты обратно.","ex":"9 + 4 = <b>13<\/b> конфет. Проверка: 13 &minus; 4 = 9. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Число разделили на 5 и получили 6. Какое это число?","opts":["11","20","30","35"],"ans":2,"hint":"Делили — значит теперь умножай.","ex":"6 × 5 = <b>30<\/b>. Проверка: 30 ÷ 5 = 6. ✓"},{"type":"open","topic":"Два действия","q":"К задуманному числу прибавили 9, потом вычли 4 и получили 15. window.G2DAY15 = {"intro":{"title":"Приём дня: деньги — это тот же счёт","body":"<p><b>Сколько всего денег.<\/b> Считай по видам монет и складывай:<\/p><div class=\"mono\">3 монеты по 10 р  →  30 р\n4 монеты по  5 р  →  20 р\nвсего            →  50 р<\/div><p><b>Сдача<\/b> — это то, что осталось: из денег вычитаем цену.<\/p><p><b>Несколько одинаковых покупок<\/b> — умножение: 4 мороженых по 25 рублей стоят 25 × 4 = 100 рублей.<\/p><p><b>Сколько штук можно купить<\/b> — деление: на 45 рублей карандашей по 9 рублей выйдет 45 ÷ 9 = 5 штук.<\/p><p><b>Осторожно с вопросом.<\/b> Иногда спрашивают не цену покупки, а сдачу — подчеркни вопрос карандашом, прежде чем считать.<\/p>"},"questions":[{"type":"mcq","topic":"Сколько денег","q":"У Кати 3 монеты по 10 рублей и 4 монеты по 5 рублей. Сколько у неё денег?","opts":["35 рублей","45 рублей","50 рублей","70 рублей"],"ans":2,"hint":"Посчитай отдельно десятки и пятёрки, потом сложи.","ex":"10 × 3 = 30 р, 5 × 4 = 20 р. Вместе 30 + 20 = <b>50 рублей<\/b>."},{"type":"mcq","topic":"Сдача","q":"Игрушка стоит 78 рублей. Сколько рублей сдачи получит покупатель со 100 рублей?","opts":["12","22","28","32"],"ans":1,"hint":"Сдача — это разность между деньгами и ценой.","ex":"100 &minus; 78 = <b>22<\/b> рубля."},{"type":"mcq","topic":"Сколько денег","q":"Сколько рублей в семи монетах по 5 рублей?","opts":["12","25","35","40"],"ans":2,"hint":"По 5 рублей взяли 7 раз.","ex":"5 × 7 = <b>35<\/b> рублей."},{"type":"mcq","topic":"Сравнение покупок","q":"Что дороже: три ручки по 12 рублей или две тетради по 19 рублей?","opts":["Ручки","Тетради","Одинаково","Сравнить нельзя"],"ans":1,"hint":"Посчитай обе покупки полностью и сравни.","ex":"Ручки: 12 × 3 = 36 р. Тетради: 19 × 2 = 38 р. Дороже <b>тетради<\/b>."},{"type":"mcq","topic":"Покупка нескольких","q":"Сколько рублей стоят четыре мороженых по 25 рублей?","opts":["75","90","100","125"],"ans":2,"hint":"Четыре раза по 25 — это две полусотни.","ex":"25 × 4 = <b>100<\/b> рублей."},{"type":"open","topic":"Покупка","q":"Блокнот стоит 35 рублей, а ручка 18 рублей. Сколько рублей стоят блокнот и ручка вместе?","ans":53,"hint":"Обычное сложение.","ex":"35 + 18 = <b>53<\/b> рубля."},{"type":"open","topic":"Сдача","q":"У Пети было 100 рублей. Он купил два сока по 32 рубля. Сколько рублей у него осталось?","ans":36,"hint":"Сначала посчитай, сколько стоили оба сока.","ex":"Соки: 32 × 2 = 64 р. Осталось 100 &minus; 64 = <b>36<\/b> рублей."},{"type":"open","topic":"Сколько монет","q":"Сколько монет по 2 рубля нужно, чтобы набрать 18 рублей?","ans":9,"hint":"Сколько двоек помещается в 18?","ex":"18 ÷ 2 = <b>9<\/b> монет."},{"type":"open","topic":"Сколько штук","q":"Карандаш стоит 9 рублей. Сколько таких карандашей можно купить на 45 рублей?","ans":5,"hint":"Деление: сколько раз цена помещается в деньгах.","ex":"45 ÷ 9 = <b>5<\/b> карандашей."},{"type":"open","topic":"Сколько денег","q":"У Маши пять монет: три по 10 рублей и две по 2 рубля. Сколько у неё всего денег?","ans":34,"hint":"Считай по видам монет.","ex":"10 × 3 = 30 р, 2 × 2 = 4 р. Вместе 30 + 4 = <b>34<\/b> рубля."}]};
window.G2DAY16 = {"intro":{"title":"Приём дня: время считаем шагами","body":"<div class=\"mono\">1 час  = 60 минут\n1 сутки = 24 часа\n1 неделя = 7 дней<\/div><p><b>Сколько времени прошло.<\/b> Шагай до круглого часа, а потом дальше:<\/p><div class=\"mono\">от 10:45 до 11:30\n10:45 → 11:00 — это 15 мин\n11:00 → 11:30 — это 30 мин\nвсего 45 минут<\/div><p><b>Дни недели.<\/b> Через 7 дней всегда тот же день недели. Поэтому «через 10 дней» — это то же, что «через 3 дня»: семь дней отбрасываем.<\/p><p><b>Уроки и перемены.<\/b> Складывай всё подряд: урок, перемена, урок — ничего не пропуская.<\/p>"},"questions":[{"type":"mcq","topic":"Часы и минуты","q":"Сколько минут в двух часах?","opts":["100","110","120","200"],"ans":2,"hint":"В одном часе 60 минут.","ex":"60 × 2 = <b>120<\/b> минут."},{"type":"mcq","topic":"Сколько времени прошло","q":"Фильм начался в 15:20 и шёл 30 минут. Во сколько он закончился?","opts":["15:40","15:50","16:00","16:20"],"ans":1,"hint":"Прибавь 30 минут к 20 минутам — до нового часа ещё далеко.","ex":"15:20 + 30 мин = <b>15:50<\/b>."},{"type":"mcq","topic":"Дни недели","q":"Сегодня вторник. Какой день недели будет через 3 дня?","opts":["Четверг","Пятница","Суббота","Воскресенье"],"ans":1,"hint":"Считай по дням: среда, четверг…","ex":"Среда, четверг, <b>пятница<\/b>."},{"type":"mcq","topic":"Сколько времени прошло","q":"Сколько часов проходит от 9 часов утра до 3 часов дня?","opts":["4","5","6","7"],"ans":2,"hint":"Три часа дня — это 15 часов.","ex":"15 &minus; 9 = <b>6<\/b> часов."},{"type":"mcq","topic":"Уроки и перемены","q":"Урок длится 40 минут, перемена — 10 минут. Сколько минут пройдёт от начала первого урока до конца второго?","opts":["80","90","100","110"],"ans":1,"hint":"Урок, перемена, урок — сложи всё.","ex":"40 + 10 + 40 = <b>90<\/b> минут."},{"type":"open","topic":"Часы и минуты","q":"Сколько минут в половине часа?","ans":30,"hint":"Половина от 60 минут.","ex":"60 ÷ 2 = <b>30<\/b> минут."},{"type":"open","topic":"Сколько времени прошло","q":"Сколько минут проходит от 10:45 до 11:30?","ans":45,"hint":"Сначала дойди до 11:00, потом считай дальше.","ex":"От 10:45 до 11:00 — 15 минут, от 11:00 до 11:30 — 30 минут. Всего <b>45<\/b> минут."},{"type":"open","topic":"Календарь","q":"Сегодня 12 марта. Какое число будет через 10 дней?","ans":22,"hint":"В марте 31 день, так что месяц не сменится.","ex":"12 + 10 = <b>22<\/b> марта."},{"type":"open","topic":"Календарь","q":"В марте 31 день, и первое марта — понедельник. Сколько понедельников в этом марте?","ans":5,"hint":"Понедельники идут через каждые 7 дней: 1, 8, 15…","ex":"Понедельники — 1, 8, 15, 22 и 29 марта. Всего <b>5<\/b>."},{"type":"open","topic":"Часы и минуты","q":"Мультфильм идёт 15 минут. Сколько таких мультфильмов можно посмотреть за 1 час?","ans":4,"hint":"Сколько раз 15 минут помещается в 60?","ex":"60 ÷ 15 = <b>4<\/b> мультфильма."}]};
window.G2DAY17 = {"intro":{"title":"Приём дня: сначала приведи к одним единицам","body":"<div class=\"mono\">1 м  = 100 см      1 кг = 1000 г\n1 дм =  10 см      1 л  = 1000 мл<\/div><p><b>Сравнивать можно только одинаковое.<\/b> Что тяжелее, 3 кг или 2500 г? Переводим: 3 кг = 3000 г, и теперь видно, что 3000 больше 2500.<\/p><p><b>Из больших единиц в маленькие — умножаем<\/b> (метры в сантиметры ×100), <b>из маленьких в большие — делим<\/b> (граммы в килограммы ÷1000).<\/p><p><b>Весы в равновесии<\/b> означают, что слева и справа одинаковый вес. Если 2 арбуза уравновешивают 8 дынь, то один арбуз — это 4 дыни.<\/p>"},"questions":[{"type":"mcq","topic":"Длина","q":"Сколько сантиметров в 3 метрах?","opts":["30","130","300","3000"],"ans":2,"hint":"В одном метре 100 сантиметров.","ex":"100 × 3 = <b>300 см<\/b>."},{"type":"mcq","topic":"Масса","q":"Что тяжелее: 3 кг или 2500 г?","opts":["3 кг","2500 г","Одинаково","Сравнить нельзя"],"ans":0,"hint":"Переведи килограммы в граммы.","ex":"<b>3 кг<\/b> = 3000 г, а 3000 г больше 2500 г."},{"type":"mcq","topic":"Объём","q":"В банке 2 литра сока. Сколько это миллилитров?","opts":["200","1200","2000","20000"],"ans":2,"hint":"В одном литре 1000 миллилитров.","ex":"1000 × 2 = <b>2000 мл<\/b>."},{"type":"mcq","topic":"Длина","q":"Длина карандаша 12 см, а ручки 15 см. На сколько сантиметров ручка длиннее карандаша?","opts":["2","3","4","27"],"ans":1,"hint":"«На сколько длиннее» — вычитание.","ex":"15 &minus; 12 = <b>3 см<\/b>."},{"type":"mcq","topic":"Масса","q":"Сколько килограммов в 4000 граммах?","opts":["4","40","400","4000"],"ans":0,"hint":"Из граммов в килограммы — делим на 1000.","ex":"4000 ÷ 1000 = <b>4 кг<\/b>."},{"type":"open","topic":"Длина","q":"Сколько сантиметров в 5 метрах?","ans":500,"hint":"По 100 см пять раз.","ex":"100 × 5 = <b>500 см<\/b>."},{"type":"open","topic":"Масса","q":"В одном пакете 2 кг муки. Сколько килограммов муки в шести таких пакетах?","ans":12,"hint":"По 2 кг взяли 6 раз.","ex":"2 × 6 = <b>12 кг<\/b>."},{"type":"open","topic":"Длина","q":"Верёвку длиной 90 см разрезали на 3 равные части. Какой длины каждая часть в сантиметрах?","ans":30,"exfig":"parts:90 см,30,30,30","hint":"Поровну на три части — деление.","ex":"90 ÷ 3 = <b>30 см<\/b>."},{"type":"open","topic":"Весы","fig":"balance:2 арбуза,8 дынь","q":"На одной чаше весов лежат 2 арбуза, на другой — 8 дынь, весы в равновесии. Один арбуз весит 4 кг. Сколько килограммов весит одна дыня?","ans":1,"hint":"Сначала узнай, сколько весят все дыни вместе.","ex":"Два арбуза весят 4 × 2 = 8 кг, столько же весят 8 дынь. Значит одна дыня — 8 ÷ 8 = <b>1 кг<\/b>."},{"type":"open","topic":"Объём","q":"В бутылке 500 мл воды. Сколько таких бутылок нужно, чтобы набрать 3 литра?","ans":6,"hint":"Переведи литры в миллилитры: 3 л = 3000 мл.","ex":"3000 ÷ 500 = <b>6<\/b> бутылок."}]};
window.G2DAY18 = {"intro":{"title":"Приём дня: периметр — это забор вокруг фигуры","body":"<p><b>Периметр<\/b> — сумма длин всех сторон. У квадрата все стороны равны, поэтому периметр = сторона × 4. У прямоугольника периметр = (длина + ширина) × 2.<\/p><div class=\"mono\">квадрат со стороной 5 см\n5 + 5 + 5 + 5 = 20 см\nили 5 × 4 = 20 см<\/div><p><b>Обратный вопрос.<\/b> Периметр квадрата 24 см → сторона 24 ÷ 4 = 6 см.<\/p><p><b>Сколько сторон — столько и углов.<\/b> У треугольника 3 и 3, у четырёхугольника 4 и 4, у шестиугольника 6 и 6.<\/p><p><b>Ось симметрии<\/b> — линия, по которой фигуру можно сложить пополам так, чтобы половинки совпали. У квадрата таких линий 4, у равностороннего треугольника 3, у круга их бесконечно много.<\/p>"},"questions":[{"type":"mcq","topic":"Периметр","fig":"rect:5 см,5 см","q":"Чему равен периметр квадрата со стороной 5 см?","opts":["10 см","15 см","20 см","25 см"],"ans":2,"hint":"У квадрата четыре одинаковые стороны.","ex":"5 × 4 = <b>20 см<\/b>."},{"type":"mcq","topic":"Периметр","fig":"rect:6 см,3 см","q":"Чему равен периметр прямоугольника со сторонами 6 см и 3 см?","opts":["9 см","12 см","18 см","24 см"],"ans":2,"hint":"У прямоугольника противоположные стороны равны — каждая сторона считается дважды.","ex":"(6 + 3) × 2 = 9 × 2 = <b>18 см<\/b>."},{"type":"mcq","topic":"Симметрия","q":"У какой из фигур ровно 4 оси симметрии?","opts":["Прямоугольник","Квадрат","Равносторонний треугольник","Круг"],"ans":1,"exfig":"sym:square","hint":"Складывай фигуру мысленно пополам: сколько линий подойдёт?","ex":"У <b>квадрата<\/b> четыре оси: две через середины сторон и две диагонали. У прямоугольника их только две, у треугольника три, у круга бесконечно много."},{"type":"mcq","topic":"Стороны и углы","q":"Сколько всего сторон у треугольника и четырёхугольника вместе?","opts":["6","7","8","9"],"ans":1,"hint":"Название фигуры подсказывает число сторон.","ex":"3 + 4 = <b>7<\/b> сторон."},{"type":"mcq","topic":"Симметрия","q":"Сколько осей симметрии у круга?","opts":["1","2","4","Бесконечно много"],"ans":3,"exfig":"sym:circle","hint":"Подумай, по скольким линиям можно сложить круг пополам.","ex":"Круг складывается пополам по любой прямой, проходящей через центр, — таких линий <b>бесконечно много<\/b>."},{"type":"open","topic":"Периметр","q":"Периметр квадрата равен 24 см. Чему равна его сторона в сантиметрах?","ans":6,"hint":"Периметр состоит из четырёх одинаковых сторон.","ex":"24 ÷ 4 = <b>6 см<\/b>."},{"type":"open","topic":"Периметр","fig":"rect:7 см,2 см","q":"Стороны прямоугольника равны 7 см и 2 см. Чему равен его периметр в сантиметрах?","ans":18,"hint":"Сложи длину и ширину, а потом удвой.","ex":"(7 + 2) × 2 = <b>18 см<\/b>."},{"type":"open","topic":"Стороны и углы","q":"У фигуры 6 сторон. Сколько у неё углов?","ans":6,"hint":"Сторон и углов у многоугольника поровну.","ex":"Сколько сторон — столько и углов: <b>6<\/b>."},{"type":"open","topic":"Периметр","q":"Чему равен периметр треугольника, у которого все стороны по 8 см?","ans":24,"hint":"Три одинаковые стороны.","ex":"8 × 3 = <b>24 см<\/b>."},{"type":"open","topic":"Обратная задача","q":"Из проволоки длиной 20 см согнули квадрат. Чему равна сторона квадрата в сантиметрах?","ans":5,"hint":"Длина проволоки — это и есть периметр.","ex":"20 ÷ 4 = <b>5 см<\/b>."}]};
window.G2DAY19 = {"intro":{"title":"Приём дня: считаем по размерам, а не подряд","body":"<p>Вопрос «сколько квадратов на рисунке» почти всегда значит: считай квадраты <b>всех размеров<\/b>, а не только маленькие клетки.<\/p><div class=\"mono\">сетка 2 × 2:\n  квадратов 1×1:  4\n  квадратов 2×2:  1\n  всего:          5<\/div><p>Считай строго по размерам сверху вниз — так ничего не потеряешь и ничего не посчитаешь дважды.<\/p><p><b>Прямоугольники в полоске.<\/b> В полоске из 3 клеток: из одной клетки — 3, из двух соседних — 2, из всех трёх — 1. Всего 3 + 2 + 1 = 6.<\/p><p><b>Отрезки на прямой.<\/b> Если на прямой отмечены точки, считай отрезки парами точек: сначала все отрезки от первой точки, потом от второй, и так далее.<\/p>"},"questions":[{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"На рисунке квадрат, разделённый на четыре одинаковые клетки. Сколько всего квадратов на нём видно?","opts":["4","5","6","8"],"ans":1,"hint":"Не забудь самый большой квадрат.","ex":"Четыре клетки 1×1 и один квадрат 2×2: 4 + 1 = <b>5<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,1","q":"Полоску разделили на две одинаковые клетки. Сколько прямоугольников можно найти на этом рисунке?","opts":["2","3","4","6"],"ans":1,"hint":"Кроме двух клеток есть ещё вся полоска целиком.","ex":"Две клетки по отдельности и вся полоска: 2 + 1 = <b>3<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"tri:2","q":"Из вершины треугольника провели один отрезок к противоположной стороне. Сколько всего треугольников стало на рисунке?","opts":["1","2","3","4"],"ans":2,"hint":"Два маленьких — и не забудь про большой треугольник целиком.","ex":"Два маленьких и один большой: 2 + 1 = <b>3<\/b> треугольника."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:3,3","q":"Большой квадрат разделили на девять одинаковых клеток. Сколько всего квадратов — и маленьких, и составленных из нескольких клеток — на этом рисунке?","opts":["9","13","14","15"],"ans":2,"hint":"Считай по размерам: сначала все 1×1, потом window.G2DAY22 = {"intro":{"title":"Приём дня: считай промежутки, а не предметы","body":"<p>Это самая коварная тема олимпиад для второго класса. Правило короткое:<\/p><ul><li><b>Столбы вдоль дороги<\/b> (от начала до конца): столбов на <b>один больше<\/b>, чем промежутков.<\/li><li><b>Распилы бревна<\/b>: распилов на <b>один меньше<\/b>, чем частей.<\/li><li><b>Этажи<\/b>: пролётов лестницы на <b>один меньше<\/b>, чем этажей. От 1-го до 3-го этажа — два пролёта, а не три.<\/li><li><b>Удары часов<\/b>: промежутков между ударами на один меньше, чем ударов.<\/li><li><b>По кругу<\/b> — исключение: сколько предметов, столько и промежутков.<\/li><\/ul><p>Если запутались — нарисуйте пять точек на линии и посчитайте промежутки. Рисунок всегда честнее памяти.<\/p>"},"questions":[{"type":"mcq","topic":"Столбы","fig":"posts:40,10","q":"Вдоль дороги длиной 40 м поставили столбы через каждые 10 м, от самого начала до самого конца. Сколько поставили столбов?","opts":["3","4","5","6"],"ans":2,"hint":"Сначала посчитай промежутки, потом добавь один столб.","ex":"Промежутков: 40 ÷ 10 = 4. Столбов на один больше: 4 + 1 = <b>5<\/b>."},{"type":"mcq","topic":"Распилы","q":"Бревно распилили на 4 части. Сколько сделали распилов?","opts":["2","3","4","5"],"ans":1,"exfig":"log:4","hint":"Здесь правило обратное: распилов меньше, чем частей.","ex":"Каждый распил добавляет одну часть, а начинали с целого бревна: 4 &minus; 1 = <b>3<\/b>."},{"type":"mcq","topic":"Этажи","q":"Между первым и вторым этажом 12 ступенек. Сколько ступенек надо пройти от первого этажа до третьего?","opts":["12","24","36","48"],"ans":1,"exfig":"floors:3","hint":"От первого до третьего — два пролёта, а не три.","ex":"Пролётов два: 12 × 2 = <b>24<\/b> ступеньки."},{"type":"mcq","topic":"По кругу","q":"Вокруг круглого стола на равном расстоянии расставили 6 стульев. Сколько промежутков между соседними стульями?","opts":["5","6","7","12"],"ans":1,"hint":"По кругу нет ни начала, ни конца — правило «на один меньше» здесь не ра window.G2DAY23 = {"intro":{"title":"Приём дня: выписывай то, что известно","body":"<p><b>Кто выше, кто младше.<\/b> Рисуй цепочку: «Аня выше Бори, Боря выше Вани» — значит Аня → Боря → Ваня, и самая высокая Аня.<\/p><p><b>Правда и ложь.<\/b> Если сказано «правду сказал ровно один», проверяй по очереди каждое предположение и считай, сколько получилось правдивых фраз. Подходит только то предположение, где счёт совпал с условием.<\/p><p><b>Слово «наверняка»<\/b> значит: считаем самый неудачный случай. Если в ящике шары двух цветов, то два вынутых шара могут оказаться разными — а вот третий обязательно совпадёт с одним из них.<\/p><p><b>Перебор — это не стыдно.<\/b> Во втором классе почти любую логическую задачу можно решить, аккуратно проверив все случаи.<\/p>"},"questions":[{"type":"mcq","topic":"Упорядочивание","q":"Аня выше Бори, а Боря выше Вани. Кто из них самый высокий?","opts":["Аня","Боря","Ваня","Определить нельзя"],"ans":0,"hint":"Выстрой всех в цепочку по росту.","ex":"Цепочка: <b>Аня<\/b> выше Бори, Боря выше Вани. Значит Аня выше всех."},{"type":"mcq","topic":"Соответствия","q":"У Ани, Оли и Веры платья трёх цветов: красное, синее и зелёное. Оля в синем, Аня не в красном. Какого цвета платье у Ани?","opts":["Красное","Синее","Зелёное","Определить нельзя"],"ans":2,"hint":"Синее уже занято Олей, красное Ане не подходит — что остаётся?","ex":"Синее у Оли, красное Ане не подходит, значит у Ани <b>зелёное<\/b>, а красное у Веры."},{"type":"mcq","topic":"Правда и ложь","q":"Кто-то один съел конфету. Аня говорит: «Я не ела», Боря: «Конфету съела Аня», Вера: «Я не ела». Правду сказал ровно один человек. Кто съел конфету?","opts":["Аня","Боря","Вера","Определить нельзя"],"ans":2,"hint":"Проверь три предположения по очереди и посчитай правдивые фразы.","ex":"Если ела Аня — правдивы Боря и Вера, это двое. Если Боря — правдивы Аня и Вера, снова двое. Если <b>Вера<\/b> — правдива только Аня. Подходит третий случай."},{"type":"mcq","topic":"Упорядочивание","q":"Маша старше Даши, но младше Лены. Кто из девочек самая младшая?","opts":["Маша","Даша","Лена","Определить нельзя"],"ans":1,"hint":"Выстрой цепочку от самой старшей к самой младшей.","ex":"Лена старше Маши, Маша старше Даши. Значит самая младшая — <b>Даша<\/b>."},{"type":"mcq","topic":"Наверняка","q":"В коробке лежат 5 красных и 5 синих шаров. Сколько шаров надо вынуть не глядя, чтобы наверняка среди них оказались два шара одного цвета?","opts":["2","3","4","6"],"ans":1,"hint":"Представь самый неудачный случай: первые два шара разного цвета.","ex":"Два шара могут оказаться разными, но третий обязательно совпадёт с одним из них: <b>3<\/b> шара."},{"type":"open","topic":"Соответствия","q":"Аня, Боря и Вера заняли первые три места. Аня не первая и не третья. Какое место заняла Аня?","ans":2,"hint":"Осталось единственное место.","ex":"Не первое и не третье — остаётся <b>2<\/b>-е место."},{"type":"open","topic":"Наверняка","q":"В ящике лежат 4 чёрных и 6 белых носков. Сколько носков надо вынуть не глядя, чтобы наверняка оказалась пара носков одного цвета?","ans":3,"hint":"Цветов всего два — значит неудачно может пойти только первый шаг.","ex":"Первые два носка могут быть разного цвета, третий обязательно даст пару: <b>3<\/b> носка."},{"type":"open","topic":"Наверняка","q":"В мешке лежат шары трёх цветов. Сколько шаров надо вынуть не глядя, чтобы наверняка оказалось два шара одного цвета?","ans":4,"hint":"Самый неудачный случай — каждый новый шар нового цвета.","ex":"Три шара могут оказаться трёх разных цветов, а четвёртый обязательно повторит один из них: <b>4<\/b> шара."},{"type":"open","topic":"Логика с числами","q":"Задумали число: оно больше 10, меньше 15 и делится на 4. Какое это число?","ans":12,"hint":"Выпиши числа от 11 до 14 и проверь каждое.","ex":"Из чисел 11, 12, 13, 14 на 4 делится только <b>12<\/b>."},{"type":"open","topic":"Логика с числами","q":"На полке стоят 10 книг подряд. Сколько книг стоит между первой и последней?","ans":8,"hint":"Уберите из десяти книг перв window.G2DAY24 = {"intro":{"title":"Приём дня: считай по порядку, ничего не теряя","body":"<p><b>Перебор по порядку.<\/b> Сколько двузначных чисел выйдет из цифр 1, 2 и 3, если не повторять цифры? Выписывай по первой цифре:<\/p><div class=\"mono\">на 1: 12, 13\nна 2: 21, 23\nна 3: 31, 32\nвсего 6<\/div><p><b>Правило умножения.<\/b> Если выбор делается дважды и варианты не мешают друг другу — числа перемножают: 3 юбки и 2 блузки дают 3 × 2 = 6 нарядов.<\/p><p><b>Рукопожатия.<\/b> Каждое рукопожатие считают дважды — по одному разу за каждого участника, — поэтому в конце делят на 2. Для трёх человек: 3 × 2 ÷ 2 = 3.<\/p><p><b>Проверяй себя списком.<\/b> Если вариантов немного, выпиши их полностью: это дольше, зато наверняка.<\/p>"},"questions":[{"type":"mcq","topic":"Перебор","q":"Из цифр 1, 2 и 3 составляют двузначные числа так, чтобы обе цифры в числе были разными. Сколько чисел получится?","opts":["3","6","9","12"],"ans":1,"hint":"Первую цифру выбираем из трёх, вторую — из двух оставшихся.","ex":"12, 13, 21, 23, 31, 32 — всего <b>6<\/b> чисел. Или сразу: 3 × 2 = 6."},{"type":"mcq","topic":"Правило умножения","q":"У Кати 3 юбки и 2 блузки. Сколько разных нарядов «юбка + блузка» она может составить?","opts":["5","6","8","9"],"ans":1,"hint":"К каждой юбке подходит любая из блузок.","ex":"3 × 2 = <b>6<\/b> нарядов."},{"type":"mcq","topic":"Перебор","q":"Сколько различных двузначных чисел можно составить из цифр 4 и 8, если цифры разрешено повторять?","opts":["2","3","4","6"],"ans":2,"hint":"На каждом из двух мест может стоять любая из двух цифр — выпиши все.","ex":"44, 48, 84, 88 — всего <b>4<\/b> числа. Или сразу: 2 × 2 = 4."},{"type":"mcq","topic":"Рукопожатия","q":"Три друга пожали друг другу руки, каждый с каждым по одному разу. Сколько было рукопожатий?","opts":["2","3","6","9"],"ans":1,"hint":"Выпиши пары: первый со вторым, первый с третьим, второй с третьим.","ex":"Пар всего три, значит <b>3<\/b> рукопожатия."},{"type":"mcq","topic":"Правило умножения","q":"В кафе ые шорты.","ex":"4 × 3 = <b>12<\/b> нарядов."},{"type":"open","topic":"Лесенки","q":"Лесенка сложена из столбиков по 1, 2, 3, 4, 5, 6 и 7 кубиков. Сколько всего кубиков в лесенке?","ans":28,"exfig":"stairs:1,2,3,4,5,6,7","hint":"Складывай парами с краёв: 1 + 7, 2 + 6, 3 + 5, а четвёрка останется одна.","ex":"(1+7) + (2+6) + (3+5) + 4 = 8 + 8 + 8 + 4 = <b>28<\/b> кубиков."}]};
window.G2EXAM3 = {"questions":[{"type":"mcq","topic":"Сравнение чисел","q":"Какое из чисел 519, 591, 195 и 915 самое большое?","opts":["519","591","195","915"],"ans":3,"hint":"Сравнивай сначала сотни.","ex":"Сотен больше всего у <b>915<\/b> — девять."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 67 + 25?","opts":["82","88","92","93"],"ans":2,"hint":"Десятки и единицы отдельно.","ex":"60 + 20 = 80, 7 + 5 = 12. Вместе 80 + 12 = <b>92<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 91 − 38?","opts":["47","53","57","63"],"ans":1,"hint":"Убери сначала 30, потом 8.","ex":"91 &minus; 30 = 61, 61 &minus; 8 = <b>53<\/b>. Проверка: 53 + 38 = 91. ✓"},{"type":"mcq","topic":"Умножение","q":"Сколько будет 9 × 3?","opts":["18","24","27","30"],"ans":2,"hint":"Три раза по девять.","ex":"9 × 3 = <b>27<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 48 ÷ 4?","opts":["8","10","12","14"],"ans":2,"hint":"Раздели отдельно 40 и 8.","ex":"40 ÷ 4 = 10, 8 ÷ 4 = 2. Вместе <b>12<\/b>. Проверка: 12 × 4 = 48. ✓"},{"type":"mcq","topic":"Доли","q":"У Пети было 28 марок, и он отдал другу четверть из них. Сколько марок он отдал?","opts":["4","7","14","21"],"ans":1,"hint":"Четверть — деление на 4.","ex":"28 ÷ 4 = <b>7<\/b> марок."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 1, 2, 4, 7, ?","opts":["9","10","11","12"],"ans":2,"hint":"Выпиши разности: 1, 2, 3…","ex":"Разности растут на единицу, дальше +4: 7 + 4 = <b>11<\/b>."},{"type":"mcq","topic":"Деньги","q":"У Кати было 100 рублей, и она купила три ручки по 18 рублей. Сколько рублей у неё осталось?","opts":["36","44","46","54"],"ans":2,"hint":"Сначала посчитай стоимость всех ручек.","ex":"Ручки: 18 × 3 = 54 р. Осталось 100 &minus; 54 = <b>46<\/b> рублей."},{"type":"mcq","topic":"Время","q":"Сколько часов проходит от 7 часов утра до 8 часов вечера?","opts":["11","12","13","15"],"ans":2,"hint":"Восемь вечера — это 20 часов.","ex":"20 &minus; 7 = <b>13<\/b> часов."},{"type":"mcq","topic":"Объём","q":"Сколько миллилитров в 3 литрах?","opts":["300","3000","30000","30"],"ans":1,"hint":"В одном литре 1000 мл.","ex":"1000 × 3 = <b>3000 мл<\/b>."},{"type":"mcq","topic":"Периметр","q":"Периметр квадрата равен 28 см. Чему равна его сторона?","opts":["4 см","7 см","9 см","14 см"],"ans":1,"hint":"Периметр состоит из четырёх одинаковых сторон.","ex":"28 ÷ 4 = <b>7 см<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:3,3","q":"На рисунке квадрат, разбитый на девять одинаковых клеток. Сколько всего квадратов можно на нём найти?","opts":["9","13","14","18"],"ans":2,"hint":"Считай по размерам: 1×1, 2×2 и 3×3.","ex":"9 + 4 + 1 = <b>14<\/b> квадратов."},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 40 больше, чем 10?","opts":["В 2 раза","В 3 раза","В 4 раза","На 30"],"ans":2,"hint":"Деление.","ex":"40 ÷ 10 = 4, значит <b>в 4 раза<\/b>."},{"type":"mcq","topic":"Интервалы","q":"Вокруг клумбы на равном расстоянии поставили 7 фонарей. Сколько промежутков между соседними фонарями?","opts":["6","7","8","14"],"ans":1,"hint":"По кругу нет ни первого, ни последнего.","ex":"По кругу промежутков столько же, сколько фонарей: <b>7<\/b>."},{"type":"mcq","topic":"Логика","q":"Есть три коробки, конфеты лежат ровно в одной. На первой написано «Конфеты здесь», на второй — «Конфет здесь нет». Верна ровно одна надпись. В какой коробке конфеты?","opts":["В первой","Во второй","В третьей","Определить нельзя"],"ans":2,"hint":"Проверь все три случая и посчитай, сколько надписей оказалось верными.","ex":"Если в первой — верны обе надписи. Если во второй — обе неверны. Если в <b>третьей<\/b> — верна только вторая надпись. Подходит третий случай."},{"type":"open","topic":"Сложение","q":"Сколько будет 420 + 385?","ans":805,"hint":"Складывай по разрядам.","ex":"400 + 300 = 700, 20 + 80 = 100, 0 + 5 = 5. Вместе 700 + 100 + 5 = <b>805<\/b>."},{"type":"open","topic":"Вычитание","q":"На сколько 100 больше, чем 43?","ans":57,"hint":"Вычитание.","ex":"100 &minus; 43 = <b>57<\/b>."},{"type":"open","topic":"Два действия","q":"В четырёх коробках лежит по 6 яиц. Два яйца разбили. Сколько яиц осталось?","ans":22,"hint":"Сначала посчитай все яйца, потом убери разбитые.","ex":"6 × 4 = 24 яйца, осталось 24 &minus; 2 = <b>22<\/b>."},{"type":"open","topic":"Доли","q":"Половина числа равна 25. Чему равно само число?","ans":50,"hint":"Число вдвое больше половины.","ex":"25 × 2 = <b>50<\/b>."},{"type":"open","topic":"Модельный метод","q":"В двух вазах вместе 36 цветов, причём в первой вазе в 2 раза больше, чем во второй. Сколько цветов во второй вазе?","ans":12,"exfig":"bars:вторая=1;первая=2;@total=36","hint":"Вторая — 1 доля, первая — 2 доли.","ex":"Всего 3 доли: 36 ÷ 3 = <b>12<\/b> цветов во второй, 24 в первой. Проверка: 12 + 24 = 36. ✓"},{"type":"open","topic":"Закономерности","q":"Продолжи ряд треугольных чисел: 1, 3, 6, 10, 15, ?","ans":21,"exfig":"triangles:1,3,6,10,?","hint":"Разности: 2, 3, 4, 5… Какая следующая?","ex":"Дальше прибавляем 6: 15 + 6 = <b>21<\/b>."},{"type":"open","topic":"Обратный ход","q":"Задуманное число удвоили и вычли 7 — получилось 15. Какое число задумали?","ans":11,"hint":"Отменяй с конца: сначала верни 7, потом раздели пополам.","ex":"15 + 7 = 22, затем 22 ÷ 2 = <b>11<\/b>. Проверка: 11 × 2 = 22, 22 &minus; 7 = 15. ✓"},{"type":"open","topic":"Интервалы","q":"Ленту длиной 60 см разрезали на куски по 10 см. Сколько сделали разрезов?","ans":5,"hint":"Сначала посчитай, сколько получилось кусков.","ex":"Кусков: 60 ÷ 10 = 6. Разрезов на один меньше: 6 &minus; 1 = <b>5<\/b>."},{"type":"open","topic":"Перебор","q":"Сколько различных трёхзначных чисел можно составить из цифр 4, 5 и 6, если каждая цифра используется ровно один раз?","ans":6,"hint":"Первую цифру выбираем из трёх, вторую из двух, третья остаётся.","ex":"3 × 2 × 1 = <b>6<\/b>: 456, 465, 546, 564, 645, 654."},{"type":"open","topic":"Отрезки","fig":"grid:4,1","q":"В полоске из четырёх одинаковых клеток — сколько всего прямоугольников можно найти?","ans":10,"hint":"Считай по длине: из одной клетки, из двух, из трёх, из всех четырёх.","ex":"4 + 3 + 2 + 1 = <b>10<\/b> прямоугольников."}]};
window.G2DAY28 = {"intro":{"title":"Сегодня закрепляем уверенность","body":"<p>Никаких новых тем. Десять знакомых задач — просто чтобы рука была тёплой.<\/p><p><b>Что повторить вслух перед сном:<\/b><\/p><ul><li>В секции A за неверный ответ снимают балл: не смогла вычеркнуть хотя бы два варианта — пропускай.<\/li><li>В секции B за ошибку не снимают ничего: пустых ответов быть не должно.<\/li><li>Идём в два прохода: сначала всё лёгкое, потом трудное.<\/li><li>Подчёркивай вопрос в условии карандашом — половина ошибок из-за спешки.<\/li><\/ul><p>И самое главное: лечь спать вовремя. Выспавшийся человек считает быстрее любого повторения.<\/p>"},"questions":[{"type":"mcq","topic":"Сложение","q":"Сколько будет 45 + 26?","opts":["61","69","71","81"],"ans":2,"hint":"Десятки к десяткам, единицы к единицам.","ex":"40 + 20 = 60, 5 + 6 = 11. Вместе 60 + 11 = <b>71<\/b>."},{"type":"mcq","topic":"Умножение","q":"Сколько будет 6 × 4?","opts":["10","18","24","28"],"ans":2,"hint":"Четыре раза по шесть.","ex":"6 × 4 = <b>24<\/b>."},{"type":"mcq","topic":"Доли","q":"Чему равна половина числа 18?","opts":["6","8","9","12"],"ans":2,"hint":"Деление на 2.","ex":"18 ÷ 2 = <b>9<\/b>."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 6, 12, 18, 24, ?","opts":["28","30","32","36"],"ans":1,"hint":"Шаг одинаковый.","ex":"Каждый раз прибавляем 6: 24 + 6 = <b>30<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"Посчитай на рисунке все квадраты — и маленькие, и большой. Сколько их всего?","opts":["4","5","6","8"],"ans":1,"hint":"Большой квадрат тоже считается.","ex":"4 клетки и 1 большой квадрат: 4 + 1 = <b>5<\/b>."},{"type":"open","topic":"Вычитание","q":"Сколько будет 80 − 37?","ans":43,"hint":"Убери сначала 30, потом 7.","ex":"80 &minus; 30 = 50, 50 &minus; 7 = <b>43<\/b>."},{"type":"open","topic":"Деление","q":"Сколько будет 40 ÷ 5?","ans":8,"hint":"Какое число, умноженное на 5, даёт 40?","ex":"8 × 5 = 40, значит 40 ÷ 5 = <b>8<\/b>."},{"type":"open","topic":"Часть и целое","q":"У Ани и Бори наклеек поровну, а всего у них 30 наклеек. Сколько наклеек у Ани?","ans":15,"exfig":"parts:30,15,15","hint":"Поровну — значит пополам.","ex":"30 ÷ 2 = <b>15<\/b> наклеек."},{"type":"open","topic":"Интервалы","q":"Ленту разрезали на 6 частей. Сколько сделали разрезов?","ans":5,"hint":"Разрезов на один меньше, чем частей.","ex":"6 &minus; 1 = <b>5<\/b> разрезов."},{"type":"open","topic":"Обратный ход","q":"Задумали число, прибавили 5 и получили 21. Какое число задумали?","ans":16,"hint":"Прибавляли — теперь вычитай.","ex":"21 &minus; 5 = <b>16<\/b>. Проверка: 16 + 5 = 21. ✓"}]};

<script>
window.SASMO_BUNDLE.pages.index = { title: "Grade 3 — подготовка за месяц", body: "<div class=\"header\">\n  <div class=\"logo brand\"><\/div>\n  <div class=\"sub\" id=\"sub\">Grade 3 &bull; подготовка за месяц<\/div>\n  <h2 data-i18n=\"План на 28 дней\">План на 28 дней<\/h2>\n  <div class=\"grades\" id=\"grades\">\n    <a href=\"index.html?g=2\" data-g=\"2\" data-i18n=\"2 класс\">2 класс<\/a>\n    <a href=\"index.html?g=3\" data-g=\"3\" data-i18n=\"3 класс\">3 класс<\/a>\n  <\/div>\n  <div class=\"pbar\"><div class=\"pfill\" id=\"pf\"><\/div><\/div>\n  <div class=\"scores\">\n    <span class=\"s-ok\" id=\"cO\">0 дней пройдено<\/span>\n    <span class=\"s-pt\" id=\"cP\">осталось 28<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n\n  <div class=\"motto\" data-i18n=\"motto\">\n    <em>«Упорный труд побеждает талант, когда талант не трудится усердно»<\/em>\n    <strong>25 задач · 90 минут · без калькулятора<\/strong>\n  <\/div>\n\n  <div class=\"hubstats\" id=\"stats\"><\/div>\n\n  <div class=\"note warm\" data-i18n=\"tactics\">\n    <h3>Две тактики, которые дают больше баллов, чем лишняя выученная тема<\/h3>\n    <ul>\n      <li><b>Секция A (задачи 1–15).<\/b> За неверный ответ снимают 1 балл, за пропуск — ноль.\n          Ткнуть наугад из четырёх вариантов в среднем <b>минус четверть балла<\/b>.\n          Правило: <i>не смог вычеркнуть хотя бы два варианта — пропускай<\/i>.<\/li>\n      <li><b>Секция B (задачи 16–25).<\/b> За неверный ответ не снимают ничего.\n          Правило: <i>пустых ответов быть не должно<\/i> — пиши число всегда,\n          даже если это грубая прикидка.<\/li>\n      <li><b>Время.<\/b> 90 минут на 25 задач ≈ 3,5 минуты на задачу. Идём в два прохода:\n          сначала быстро снимаем все «свои», потом возвращаемся к трудным.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"tools\">\n    <a class=\"btn sec\" id=\"errLink\" href=\"errors.html\" data-i18n=\"📓 Работа над ошибками\">📓 Работа над ошибками<\/a>\n    <a class=\"btn\" id=\"multLink\" href=\"mult.html\" style=\"display:none\" data-i18n=\"⚡ Таблица умножения на скорость\">⚡ Таблица умножения на скорость<\/a>\n    <button class=\"mini ghost\" id=\"resetBtn\" data-i18n=\"Сбросить весь прогресс\"\n            data-armed-text=\"Точно сбросить? Нажми ещё раз\">Сбросить весь прогресс<\/button>\n  <\/div>\n\n  <div id=\"papers\"><\/div>\n\n  <div id=\"cal\"><\/div>\n\n  <p class=\"hint-line\" data-i18n=\"hintline\">Сбросить один день можно прямо на его карточке —\n    кружок со стрелкой в углу. Он стирает и результат дня, и его задачи из журнала ошибок.<\/p>\n\n  <div class=\"note\" data-i18n=\"lesson\">\n    <h3>Как проходит одно занятие (около 50 минут)<\/h3>\n    <ul>\n      <li><b>5 мин — разминка.<\/b> 20 примеров устного счёта на время.<\/li>\n      <li><b>10 мин — приём дня.<\/b> Разбираем две показательные задачи вместе.<\/li>\n      <li><b>25 мин — практика.<\/b> Задачи по нарастающей сложности, подсказку берём\n          только после честной попытки.<\/li>\n      <li><b>10 мин — ошибки.<\/b> Разбираем неверные и записываем в журнал.\n          Через пару дней прорешиваем их заново.<\/li>\n    <\/ul>\n  <\/div>\n\n<\/div>", run: function () {

(function () {
  var t = I18N.t;

  // Класс выбирается ссылкой ?g=2; выбор запоминается, чтобы у каждого
  // ребёнка страница открывалась своей.
  var asked = SASMO.params().get('g');
  var remembered = null;
  try { remembered = localStorage.getItem('sasmo.grade'); } catch (e) {}
  var grade = (asked || remembered) === '2' ? 2 : 3;
  try { localStorage.setItem('sasmo.grade', String(grade)); } catch (e) {}

  var PLAN = window.PLANS[grade];
  SASMO.usePlan(PLAN);

  /* В одностраничной сборке (sasmo-month.html) один класс и нет отдельных
     страниц работ и таблицы умножения — ссылки на них там вели бы в никуда. */
  var BUNDLE = window.SASMO_BUNDLE || null;
  if (BUNDLE) document.getElementById('grades').style.display = 'none';

  // ?demo=1 — засеять образец прогресса под демо-ключами (см. assets/demo.js)
  if (I18N.demoRequested && window.DEMO) DEMO.seed(PLAN);

  document.getElementById('sub').innerHTML = I18N.pick(PLAN, 'sub');
  document.title = t('{brand} {label} — подготовка за месяц', { brand: BRAND.name, label: PLAN.label });
  var tabs = document.getElementById('grades').children;
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('on', tabs[i].getAttribute('data-g') === String(grade));
  }

  var progress = SASMO.getProgress();
  var errors = SASMO.getErrors();

  if (!SASMO.storageWorks()) {
    document.getElementById('stats').insertAdjacentHTML('beforebegin',
      '<div class="note warm"><h3>' + t('Прогресс не будет сохраняться') + '</h3>' +
      '<p>' + t('Браузер не разрешает этой странице хранить данные — так бывает в режиме инкогнито или при запрете данных сайтов. Задачи решать можно, но галочки и журнал ошибок пропадут после закрытия вкладки.') + '</p></div>');
  }

  var doneCount = 0;
  var examScores = [];

  PLAN.days.forEach(function (day) {
    var rec = progress[day.id];
    if (rec && rec.done) {
      doneCount++;
      if (day.kind === 'exam' && typeof rec.score === 'number') examScores.push(rec.score);
    }
  });

  /* ---- шапка ---- */
  var total = PLAN.days.length;
  document.getElementById('pf').style.width = (doneCount / total * 100) + '%';
  document.getElementById('cO').textContent = t('{n} дней пройдено', { n: doneCount });
  document.getElementById('cP').textContent = t('осталось {n}', { n: total - doneCount });

  /* ---- плитки статистики ---- */
  var best = examScores.length ? Math.max.apply(null, examScores) : null;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="v">' + doneCount + '/' + total + '</div>' +
      '<div class="k">' + t('дней пройдено') + '</div></div>' +
    '<div class="stat"><div class="v">' + (best === null ? '—' : best + '/85') + '</div>' +
      '<div class="k">' + t('лучший экзамен') + '</div></div>' +
    '<div class="stat"><div class="v">' + errors.length + '</div>' +
      '<div class="k">' + t('задач в журнале ошибок') + '</div></div>';

  if (grade !== 3) {
    document.getElementById('errLink').href = 'errors.html?g=' + grade;
  }
  // Тренажёр таблицы умножения сделан для второго класса
  if (grade === 2 && !BUNDLE) {
    document.getElementById('multLink').style.display = '';
  }

  /* ---- олимпиады прошлых лет ----

     Это не дни программы: целая прошлая работа, которую решают за один раз.
     Раздел зовётся по названию олимпиады, карточки берутся из каталога
     window.PAPERS (assets/paper.js) — добавить работу можно, не трогая хаб.
     Прогресс у отдельных работ свой у каждого решающего, поэтому читаем его
     прямо из хранилища, а не через SASMO.getProgress(): активный план тут
     другой — программы класса.                                              */
  function paperResult(paper) {
    var out = [];
    Object.keys(window.SOLVERS).forEach(function (k) {
      var rec = null;
      try {
        var raw = localStorage.getItem(SASMO_PAPER.keys(k).progress);
        rec = raw ? (JSON.parse(raw) || {})[paper.set] : null;
      } catch (e) { /* инкогнито — просто не покажем результат */ }
      if (rec && rec.done && typeof rec.score === 'number') {
        out.push(window.SOLVERS[k].name + ' — ' + rec.score + '/' + paper.max);
      } else if (rec && SASMO.startedCount(rec) > 0) {
        out.push(window.SOLVERS[k].name + ' — ' + t('начато'));
      }
    });
    return out.length ? '<div class="dres">' + out.join(' · ') + '</div>' : '';
  }

  var papers = BUNDLE ? [] : (window.PAPERS || []).filter(function (p) { return p.grade === grade; });
  if (papers.length) {
    document.getElementById('papers').innerHTML =
      '<div class="week"><h3>' + t('Олимпиады прошлых лет') +
      '<small>' + t('целая работа за один раз, а не день программы') + '</small></h3>' +
      '<div class="grid">' +
      papers.map(function (p) {
        return '<a class="dcard exam" href="paper.html?p=' + p.id + '">' +
                 '<div class="dnum">' + p.olympiad + '</div>' +
                 '<div class="dttl">' + p.olympiad + ' ' + p.year + '</div>' +
                 '<div class="dsk">' + I18N.pick(p, 'note') + '</div>' +
                 paperResult(p) +
               '</a>';
      }).join('') +
      '<a class="dcard" href="copernicus.html">' +
        '<div class="dnum">' + t('Тест Коперника') + '</div>' +
        '<div class="dttl">' + t('Коперник (архив)') + '</div>' +
        '<div class="dsk">' + t('старая отдельная страница, счёт не ведётся') + '</div>' +
      '</a>' +
      '</div></div>';
  }

  /* ---- календарь ---- */
  var html = '';
  PLAN.weeks.forEach(function (w) {
    html += '<div class="week"><h3>' + I18N.pick(w, 'title') +
            '<small>' + I18N.pick(w, 'sub') + '</small></h3><div class="grid">';

    for (var d = w.from; d <= w.to; d++) {
      var day = PLAN.day(d);
      var rec = progress[day.id];
      var isDone = !!(rec && rec.done);
      var part = isDone ? 0 : SASMO.startedCount(rec);
      var ready = PLAN.isReady(day);

      var cls = 'dcard' + (day.kind === 'exam' ? ' exam' : '') +
                (isDone ? ' done' : '') + (part > 0 ? ' part' : '');
      var label = day.kind === 'exam' ? t('Экзамен · день {d}', { d: d })
                : day.kind === 'review' ? t('Разбор · день {d}', { d: d })
                : t('День {d}', { d: d });

      var result = '';
      if (isDone) {
        result = day.kind === 'exam'
          ? '<div class="dres">✓ ' + rec.score + ' / 85 · ' + rec.date + '</div>'
          : '<div class="dres">✓ ' + rec.ok + ' / ' + rec.total + ' · ' + rec.date + '</div>';
      } else if (part > 0) {
        // день начат, но не закончен — решённые задачи уже сохранены
        result = '<div class="dres part">' +
                 t('начато: {a} из {n}', { a: part, n: day.n || rec.total || '?' }) +
                 (rec.date ? ' · ' + rec.date : '') + '</div>';
      }

      var wipe = (isDone || part > 0)
        ? '<button class="dreset" data-reset="' + day.id + '" data-armed-text="стереть?" ' +
            'title="' + t('Сбросить этот день') + '" aria-label="' +
            t('Сбросить прогресс дня {d}', { d: d }) + '">↺</button>'
        : '';

      var inner =
        wipe +
        '<div class="dnum">' + label + '</div>' +
        '<div class="dttl">' + I18N.pick(day, 'title') + '</div>' +
        '<div class="dsk">' + I18N.pick(day, 'skill') + '</div>' +
        result +
        (isDone ? '<span class="tick">✅</span>' : '');

      html += ready
        ? '<a class="' + cls + '" href="' + PLAN.href(day) + '">' + inner + '</a>'
        : '<div class="' + cls + '" style="opacity:.45;cursor:default">' + inner +
          '<div class="dsk" style="margin-top:.3rem;font-style:italic">' + t('задачи готовятся') + '</div></div>';
    }

    html += '</div></div>';
  });
  document.getElementById('cal').innerHTML = html;

  /* ---- сброс одного дня: кнопка живёт внутри карточки-ссылки ---- */
  document.getElementById('cal').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-reset]');
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    SASMO.armReset(btn, function () {
      SASMO.resetDay(btn.getAttribute('data-reset'));
      SASMO.reload();
    });
  });

  /* ---- сброс всего ---- */
  document.getElementById('resetBtn').addEventListener('click', function () {
    var btn = this;
    SASMO.armReset(btn, function () {
      SASMO.saveProgress({});
      SASMO.saveErrors([]);
      SASMO.reload();
    });
  });
})();

} };
</script>
<script>
window.SASMO_BUNDLE.pages.day = { title: "Занятие дня", body: "<div class=\"header\">\n  <div class=\"logo brand\"><\/div>\n  <div class=\"sub\" id=\"sub\" data-i18n=\"занятие\">занятие<\/div>\n  <h2 id=\"ttl\" data-i18n=\"Загружаем задачи…\">Загружаем задачи…<\/h2>\n  <div class=\"crumb\"><a href=\"index.html\">← весь план<\/a><\/div>\n  <div class=\"pbar\"><div class=\"pfill\" id=\"pf\"><\/div><\/div>\n  <div class=\"scores\">\n    <span class=\"s-ok\" id=\"cO\">0 верно<\/span>\n    <span class=\"s-no\" id=\"cN\">0 неверно<\/span>\n    <span class=\"s-pt\" id=\"cP\"><\/span>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n  <div id=\"resume\"><\/div>\n  <div id=\"intro\"><\/div>\n  <div id=\"box\"><div class=\"empty\">Загружаем задачи…<\/div><\/div>\n<\/div>", run: function () {

(function () {
  var t = I18N.t;
  var params = SASMO.params();
  var PLAN = window.PLANS[params.get('g') === '2' ? 2 : 3];
  SASMO.usePlan(PLAN);

  var d = parseInt(params.get('d'), 10);
  var box = document.getElementById('box');

  var day = isNaN(d) ? null : PLAN.day(d);
  var hub = 'index.html' + (PLAN.grade === 3 ? '' : '?g=' + PLAN.grade);

  if (!day || day.kind === 'exam' || day.kind === 'review') {
    box.innerHTML = '<div class="empty">' + t('Такого занятия нет.') + ' ' +
                    '<a href="' + hub + '">' + t('Вернуться к плану') + '</a>.</div>';
    return;
  }

  var title = I18N.pick(day, 'title');
  document.querySelector('.crumb').innerHTML = '<a href="' + hub + '">' + t('← весь план') + '</a>';
  document.getElementById('sub').textContent = t('{label} · день {d} из 28', { label: PLAN.label, d: day.d });
  document.getElementById('ttl').textContent = title;
  document.title = t('День {d} — {title}', { d: day.d, title: title });

  // Данные лежат в .js, а не .json: на file:// fetch заблокирован,
  // а подключение <script> работает и без локального сервера.
  SASMO.loadSet(PLAN.dir + day.id + '.js', day.v, onload, fail);

  function fail() {
    box.innerHTML = '<div class="empty">' +
                    t('Не удалось загрузить <code>{file}</code>.<br>Похоже, задачи для этого дня ещё не готовы.',
                      { file: PLAN.dir + day.id + '.js' }) +
                    ' <a href="' + hub + '">' + t('К плану') + '</a>.</div>';
  }

  function onload(data) {
    if (!data.questions || !data.questions.length) {
      fail();
      return;
    }

    if (data.intro) {
      document.getElementById('intro').innerHTML =
        '<div class="note"><h3>' + I18N.pick(data.intro, 'title') + '</h3>' +
        I18N.pick(data.intro, 'body') + '</div>';
    }

    // Прогресс сохраняется по каждой задаче, поэтому день можно бросить на
    // середине и вернуться к нему вечером — говорим об этом прямо на странице.
    var rec = SASMO.getRecord(day.id);
    var started = SASMO.answeredCount(rec);
    var total = data.questions.length;

    if (rec && rec.done) {
      showResume(t('День уже пройден: <b>{ok} из {n}</b>{date}. Ответы ниже — те же, что и в тот раз.',
                   { ok: rec.ok, n: rec.total, date: rec.date ? ' · ' + rec.date : '' }),
                 t('Пройти день заново'));
    } else if (started > 0) {
      showResume(t('Продолжаем с того места: решено <b>{a} из {n}</b>. Решай оставшиеся — всё, что уже сделано, сохранено.',
                   { a: started, n: total }),
                 t('Начать день заново'));
    }

    box.innerHTML = '';
    SASMO.run({
      mount: box,
      questions: data.questions,
      mode: 'practice',
      setId: day.id
    });
  }

  function showResume(text, btnLabel) {
    var box = document.getElementById('resume');
    box.innerHTML =
      '<div class="resume"><div>' + text + '</div>' +
        '<button class="mini" id="resetDay" ' +
          'data-armed-text="Нажми ещё раз — прогресс дня сотрётся">' + btnLabel + '</button>' +
      '</div>';

    document.getElementById('resetDay').addEventListener('click', function () {
      var btn = this;
      SASMO.armReset(btn, function () {
        SASMO.resetDay(day.id);     // заодно уходят и задачи этого дня из журнала ошибок
        SASMO.reload();
      });
    });
  }

})();

} };
</script>
<script>
window.SASMO_BUNDLE.pages.exam = { title: "Пробный экзамен", body: "<div class=\"header\">\n  <div class=\"logo brand\"><\/div>\n  <div class=\"sub\" data-i18n=\"пробный экзамен\">пробный экзамен<\/div>\n  <h2 id=\"ttl\" data-i18n=\"Пробный экзамен\">Пробный экзамен<\/h2>\n  <div class=\"crumb\"><a href=\"index.html\">← весь план<\/a><\/div>\n  <div id=\"timer\" class=\"timer\" style=\"display:none\">⏱ 90:00<\/div>\n  <div class=\"pbar\"><div class=\"pfill\" id=\"pf\"><\/div><\/div>\n  <div class=\"scores\">\n    <span class=\"s-ok\" id=\"cO\"><\/span>\n    <span class=\"s-no\" id=\"cN\"><\/span>\n    <span class=\"s-pt\" id=\"cP\"><\/span>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n  <div id=\"gate\">\n    <div class=\"note warm\" data-i18n=\"examgate\">\n      <h3>Читаем правила вместе — и только потом нажимаем «Начать»<\/h3>\n      <ul>\n        <li><b>25 задач, 90 минут, без калькулятора.<\/b> Черновик — обычный лист бумаги.<\/li>\n        <li><b>Секция A, задачи 1–15.<\/b> Выбор из четырёх. За верный +2, за неверный <b>−1<\/b>,\n            за пропуск 0. Наугад тыкать невыгодно: пропускай, если не смог вычеркнуть\n            хотя бы два варианта.<\/li>\n        <li><b>Секция B, задачи 16–25.<\/b> Ответ — число. За верный +4, за неверный 0.\n            <b>Пустых быть не должно<\/b> — пиши хоть прикидку.<\/li>\n        <li><b>Старт: 15 баллов.<\/b> Максимум — 85.<\/li>\n        <li><b>Два прохода.<\/b> Первые 45 минут — снимаем все задачи, которые решаются\n            сразу. Оставшееся время — возвращаемся к трудным.<\/li>\n        <li>Ответы не показываются до конца — как на настоящем экзамене.<\/li>\n      <\/ul>\n    <\/div>\n    <div id=\"attempt\"><\/div>\n    <div style=\"text-align:center\">\n      <button class=\"btn\" id=\"startBtn\" data-i18n=\"▶ Начать экзамен (90 минут)\">▶ Начать экзамен (90 минут)<\/button>\n    <\/div>\n  <\/div>\n\n  <div id=\"box\"><\/div>\n<\/div>", run: function () {

<script>
window.SASMO_BUNDLE.pages.errors = { title: "Работа над ошибками", body: "<div class=\"header\">\n  <div class=\"logo brand\"><\/div>\n  <div class=\"sub\" data-i18n=\"журнал ошибок\">журнал ошибок<\/div>\n  <h2 data-i18n=\"Работа над ошибками\">Работа над ошибками<\/h2>\n  <div class=\"crumb\"><a href=\"index.html\">← весь план<\/a><\/div>\n  <div class=\"pbar\"><div class=\"pfill\" id=\"pf\"><\/div><\/div>\n  <div class=\"scores\">\n    <span class=\"s-ok\" id=\"cO\">0 верно<\/span>\n    <span class=\"s-no\" id=\"cN\">0 неверно<\/span>\n    <span class=\"s-pt\" id=\"cP\"><\/span>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n  <div id=\"intro\"><\/div>\n  <div id=\"box\"><\/div>\n<\/div>", run: function () {

(function () {
  var t = I18N.t;
  var params = SASMO.params();

  /* У отдельных работ журнал свой у каждого решающего: за ними сидят разные
     дети, и ошибки одного не должны попадаться другому. ?who=… и выбирает,
     чей журнал открыть; без него — общий журнал класса. */
  var who = params.get('who');
  var solver = who ? window.SOLVERS[who] : null;
  var hub, back, hubLabel;

  if (solver) {
    SASMO.usePlan({
      keys: SASMO_PAPER.keys(who),
      hubHref: solver.paper,
      errorsHref: 'errors.html?who=' + who
    });
    hub = solver.paper;
    back = t('← к работе');
    hubLabel = t('К работе');
    document.querySelector('.sub').textContent = t('журнал ошибок · {name}', { name: solver.name });
    document.querySelector('h2').textContent = t('Работа над ошибками — {name}', { name: solver.name });
    document.title = t('Работа над ошибками — {name}', { name: solver.name });
  } else {
    var PLAN = window.PLANS[params.get('g') === '2' ? 2 : 3];
    SASMO.usePlan(PLAN);
    hub = 'index.html' + (PLAN.grade === 3 ? '' : '?g=' + PLAN.grade);
    back = t('← весь план');
    hubLabel = t('К плану');
    document.title = t('Работа над ошибками');
  }

  var crumb = document.querySelector('.crumb');
  if (crumb) crumb.innerHTML = '<a href="' + hub + '">' + back + '</a>';

  var errors = SASMO.getErrors();
  document.getElementById('cO').textContent = t('{n} верно', { n: 0 });
  document.getElementById('cN').textContent = t('{n} неверно', { n: 0 });
  var box = document.getElementById('box');
  var intro = document.getElementById('intro');

  if (!errors.length) {
    intro.innerHTML =
      '<div class="empty">' +
      t('Журнал пуст — ошибок пока нет.<br>Он заполнится сам, когда ребёнок ошибётся в задаче.') +
      '<br><br><a class="btn" href="' + hub + '">' + hubLabel + '</a></div>';
    return;
  }

  // Разбитые по темам — видно, какая тема проседает
  var byTopic = {};
  errors.forEach(function (e) {
    var q = I18N.localize(e);
    var tp = q.topic || t('Прочее');
    byTopic[tp] = (byTopic[tp] || 0) + 1;
  });
  var rows = Object.keys(byTopic).sort(function (a, b) {
    return byTopic[b] - byTopic[a];
  }).map(function (tp) {
    return '<li><b>' + byTopic[tp] + '</b> — ' + tp + '</li>';
  }).join('');

  intro.innerHTML =
    '<div class="note warm">' +
      '<h3>' + t('В журнале {n} задач(и)', { n: errors.length }) + '</h3>' +
      '<p style="margin-bottom:.3rem">' +
      t('Решённая заново задача уходит из журнала. Ошибка остаётся — значит, тему надо разобрать ещё раз.') +
      '</p>' +
      '<ul>' + rows + '</ul>' +
      '<p style="margin-top:.4rem">' +
      t('<b>Самая слабая тема сверху.</b> Именно ей стоит отдать ближайшие 10 минут занятия.') +
      '</p>' +
    '</div>';

  // Старые ошибки — вперёд: они успели забыться сильнее.
  var questions = errors.slice().sort(function (a, b) { return a.ts - b.ts; });

  SASMO.run({
    mount: box,
    questions: questions,
    mode: 'practice',
    setId: 'errors'
  });
})();

} };
</script>
<script>
/* ==========================================================================
   Маршрутизатор одностраничной сборки (sasmo-month.html)

   Сборка не несёт своей копии страниц и движка: build/build.js кладёт в неё
   разметку и скрипты настоящих index.html, day.html, exam.html и errors.html,
   а этот файл показывает их по очереди, без перезагрузки:

     #/index.html            хаб
     #/day.html?d=04         занятие
     #/exam.html?e=1         пробный экзамен
     #/errors.html           журнал ошибок

   Старые адреса сборки (#/, #/day/4, #/exam/1, #/errors) понимаются тоже.

   Страница читает адрес через SASMO.params() и перезагружается через
   SASMO.reload() — оба смотрят в window.SASMO_ROUTE, который кладётся здесь.
   Ссылки вида day.html?d=04 внутри страниц перехватываются и становятся
   переходом по хешу.
   ========================================================================== */

(function () {
  'use strict';

  var B = window.SASMO_BUNDLE;
  var mount = document.getElementById('page');
  var current = { name: 'index', search: '' };

  var PAGE_LINK = /^(index|day|exam|errors)\.html(\?[^#]*)?(#.*)?$/;

  /* Класс сборки зашит: второй класс получает ?g=2 в каждый адрес, чтобы
     страницы брали свою программу и свои ключи хранения. */
  function withGrade(search) {
    var p = new URLSearchParams(search);
    if (B.grade !== 3) p.set('g', String(B.grade));
    else p.delete('g');
    var s = p.toString();
    return s ? '?' + s : '';
  }

  function parse(hash) {
    var h = String(hash || '').replace(/^#\/?/, '');
    var m;
    if (!h) return { name: 'index', search: '' };
    if ((m = /^day\/(\d+)$/.exec(h))) return { name: 'day', search: '?d=' + m[1] };
    if ((m = /^exam\/(\d+)$/.exec(h))) return { name: 'exam', search: '?e=' + m[1] };
    if (h === 'errors') return { name: 'errors', search: '' };
    if ((m = PAGE_LINK.exec(h))) return { name: m[1], search: m[2] || '' };
    return { name: 'index', search: '' };
  }

  window.SASMO_ROUTE = {
    search: function () { return withGrade(current.search); },
    reload: function () { show(); }
  };

  /* Прогресс прежней сборки лежал одним объектом под своим ключом
     (keys.single). Теперь сборка пишет туда же, куда и отдельные страницы, —
     переносим старое один раз, если на новом месте пусто. */
  function migrate() {
    var plan = window.PLANS[B.grade];
    if (!plan || !plan.keys || !plan.keys.single) return;
    try {
      var old = JSON.parse(localStorage.getItem(plan.keys.single) || 'null');
      if (!old || typeof old !== 'object') return;
      if (localStorage.getItem(plan.keys.progress) || localStorage.getItem(plan.keys.errors)) return;
      if (old.days && typeof old.days === 'object') {
        localStorage.setItem(plan.keys.progress, JSON.stringify(old.days));
      }
      if (Array.isArray(old.errors)) {
        localStorage.setItem(plan.keys.errors, JSON.stringify(old.errors));
      }
    } catch (e) { /* хранилище недоступно — переносить некуда */ }
  }

  function show() {
    current = parse(location.hash);
    var page = B.pages[current.name] || B.pages.index;

    window.SASMO.stop();                 // гасим прежний набор: таймер, панель, слушатели
    document.body.className = '';
    document.title = page.title;
    mount.innerHTML = page.body;
    window.I18N.decorate(mount);         // шапка и переводы — до скрипта страницы, как на сайте
    page.run();
    if (typeof window.scrollTo === 'function') {
      try { window.scrollTo(0, 0); } catch (e) { /* jsdom */ }
    }
  }

  document.addEventListener('click', function (ev) {
    if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey) return;
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (!a) return;
    var m = PAGE_LINK.exec(a.getAttribute('href'));
    if (!m) return;
    ev.preventDefault();
    var next = '#/' + m[1] + '.html' + (m[2] || '');
    if (location.hash === next) show();
    else location.hash = next;
  });

  window.addEventListener('hashchange', show);

  migrate();
  show();
})();

</script>
</body>
</html>
