му равен периметр треугольника, у которого все стороны по 8 см?","ans":24,"hint":"Три одинаковые стороны.","ex":"8 × 3 = <b>24 см<\/b>."},{"type":"open","topic":"Обратная задача","q":"Из проволоки длиной 20 см согнули квадрат. Чему равна сторона квадрата в сантиметрах?","ans":5,"hint":"Длина проволоки — это и есть периметр.","ex":"20 ÷ 4 = <b>5 см<\/b>."}]},"day19":{"intro":{"title":"Приём дня: считаем по размерам, а не подряд","body":"<p>Вопрос «сколько квадратов на рисунке» почти всегда значит: считай квадраты <b>всех размеров<\/b>, а не только маленькие клетки.<\/p><div class=\"mono\">сетка 2 × 2:\n  квадратов 1×1:  4\n  квадратов 2×2:  1\n  всего:          5<\/div><p>Считай строго по размерам сверху вниз — так ничего не потеряешь и ничего не посчитаешь дважды.<\/p><p><b>Прямоугольники в полоске.<\/b> В полоске из 3 клеток: из одной клетки — 3, из двух соседних — 2, из всех трёх — 1. Всего 3 + 2 + 1 = 6.<\/p><p><b>Отрезки на прямой.<\/b> Если на прямой отмечены точки, считай отрезки парами точек: сначала все отрезки от первой точки, потом от второй, и так далее.<\/p>"},"questions":[{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"На рисунке квадрат, разделённый на четыре одинаковые клетки. Сколько всего квадратов на нём видно?","opts":["4","5","6","8"],"ans":1,"hint":"Не забудь самый большой квадрат.","ex":"Четыре клетки 1×1 и один квадрат 2×2: 4 + 1 = <b>5<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,1","q":"Полоску разделили на две одинаковые клетки. Сколько прямоугольников можно найти на этом рисунке?","opts":["2","3","4","6"],"ans":1,"hint":"Кроме двух клеток есть ещё вся полоска целиком.","ex":"Две клетки по отдельности и вся полоска: 2 + 1 = <b>3<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"tri:2","q":"Из вершины треугольника провели один отрезок к противоположной стороне. Сколько всего треугольников стало на рисунке?","opts":["1","2","3","4"],"ans":2,"hint":"Два маленьких — и не забудь про большой треугольник целиком.","ex":"Два маленьких и один большой: 2 + 1 = <b>3<\/b> треугольника."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:3,3","q":"Большой квадрат разделили на девять одинаковых клеток. Сколько всего квадратов — и маленьких, и составленных из нескольких клеток — на этом рисунке?","opts":["9","13","14","15"],"ans":2,"hint":"Считай по размерам: сначала все 1×1, потом все 2×2, потом самый большой.","ex":"1×1 — девять, 2×2 — четыре, 3×3 — один. Всего 9 + 4 + 1 = <b>14<\/b>."},{"type":"mcq","topic":"Отрезки","fig":"points:3","q":"На прямой отметили 3 точки. Сколько разных отрезков с концами в этих точках получилось?","opts":["2","3","4","6"],"ans":1,"hint":"От первой точки идут 2 отрезка, от второй — ещё один новый.","ex":"2 + 1 = <b>3<\/b> отрезка."},{"type":"open","topic":"Счёт фигур","fig":"grid:3,1","q":"Полоску разрезали на три одинаковые клетки. Сколько разных прямоугольников можно увидеть на этом рисунке?","ans":6,"hint":"Считай по длине: из одной клетки, из двух соседних, из всех трёх.","ex":"3 + 2 + 1 = <b>6<\/b> прямоугольников."},{"type":"open","topic":"Счёт фигур","fig":"grid:2,2","q":"Сколько всего прямоугольников спрятано в квадрате, разделённом на четыре клетки? Квадраты тоже считаются прямоугольниками.","ans":9,"hint":"Кроме пяти квадратов есть ещё вытянутые прямоугольники из двух клеток.","ex":"Квадратов 5, прямоугольников из двух клеток — 4 (два стоячих и два лежачих). Всего 5 + 4 = <b>9<\/b>."},{"type":"open","topic":"Счёт фигур","fig":"grid:3,2","q":"Прямоугольник разделён на 2 ряда и 3 столбца клеток. Сколько в нём клеток?","ans":6,"hint":"В каждом ряду по 3 клетки, рядов два.","ex":"3 × 2 = <b>6<\/b> клеток."},{"type":"open","topic":"Отрезки","fig":"points:4","q":"На прямой отметили 4 точки. Сколько разных отрезков с концами в этих точках получилось?","ans":6,"hint":"От первой точки 3 отрезка, от второй 2 новых, от третьей ещё один.","ex":"3 + 2 + 1 = <b>6<\/b> отрезков."},{"type":"open","topic":"Счёт фигур","fig":"stairs:3,2,1","q":"Лесенка сложена из одинаковых клеток: в первом столбике 3 клетки, во втором 2, в третьем 1. Сколько всего клеток в фигуре?","ans":6,"hint":"Просто сложи клетки по столбикам.","ex":"3 + 2 + 1 = <b>6<\/b> клеток."}]},"exam1":{"questions":[{"type":"mcq","topic":"Разряды","q":"Какая цифра стоит в разряде десятков числа 845?","opts":["8","4","5","45"],"ans":1,"hint":"Разряды считают справа налево.","ex":"8<b>4<\/b>5: 5 — единицы, <b>4 — десятки<\/b>, 8 — сотни."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 36 + 29?","opts":["55","65","66","75"],"ans":1,"hint":"Десятки отдельно, единицы отдельно.","ex":"30 + 20 = 50, 6 + 9 = 15. Вместе 50 + 15 = <b>65<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 84 − 37?","opts":["43","47","53","57"],"ans":1,"hint":"Убери сначала 30, потом 7.","ex":"84 &minus; 30 = 54, 54 &minus; 7 = <b>47<\/b>. Проверка: 47 + 37 = 84. ✓"},{"type":"mcq","topic":"Умножение","q":"Сколько будет 5 × 6?","opts":["11","25","30","35"],"ans":2,"hint":"Считай пятёрками шесть шагов.","ex":"5 × 6 = <b>30<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 32 ÷ 4?","opts":["6","7","8","9"],"ans":2,"hint":"Какое число, умноженное на 4, даёт 32?","ex":"8 × 4 = 32, значит 32 ÷ 4 = <b>8<\/b>."},{"type":"mcq","topic":"Доли","q":"Чему равна четверть числа 24?","opts":["4","6","8","12"],"ans":1,"hint":"Дели на 4 или дважды пополам.","ex":"24 ÷ 4 = <b>6<\/b>."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 2, 5, 8, 11, ?","opts":["12","13","14","15"],"ans":2,"hint":"Найди шаг ряда.","ex":"Каждый раз прибавляем 3: 11 + 3 = <b>14<\/b>."},{"type":"mcq","topic":"Деньги","q":"Книга стоит 64 рубля. Сколько рублей сдачи получит покупатель с 70 рублей?","opts":["4","6","14","16"],"ans":1,"hint":"Сдача — это разность.","ex":"70 &minus; 64 = <b>6<\/b> рублей."},{"type":"mcq","topic":"Время","q":"Сколько минут проходит от 8:50 до 9:20?","opts":["20","30","40","70"],"ans":1,"hint":"Сначала дойди до 9:00.","ex":"От 8:50 до 9:00 — 10 минут, от 9:00 до 9:20 — 20 минут. Всего <b>30<\/b> минут."},{"type":"mcq","topic":"Длина","q":"Сколько сантиметров в 4 метрах?","opts":["40","140","400","4000"],"ans":2,"hint":"В одном метре 100 см.","ex":"100 × 4 = <b>400 см<\/b>."},{"type":"mcq","topic":"Периметр","fig":"rect:6 см,6 см","q":"Чему равен периметр квадрата со стороной 6 см?","opts":["12 см","18 см","24 см","36 см"],"ans":2,"hint":"Четыре одинаковые стороны.","ex":"6 × 4 = <b>24 см<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:3,1","q":"В полоске из трёх одинаковых клеток — сколько всего прямоугольников можно найти?","opts":["3","4","6","9"],"ans":2,"hint":"Считай по длине: из одной клетки, из двух, из трёх.","ex":"3 + 2 + 1 = <b>6<\/b> прямоугольников."},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 24 больше, чем 8?","opts":["В 2 раза","В 3 раза","В 4 раза","На 16"],"ans":1,"hint":"«Во сколько раз» — деление.","ex":"24 ÷ 8 = 3, значит <b>в 3 раза<\/b>."},{"type":"mcq","topic":"Интервалы","q":"Верёвку разрезали на 5 частей. Сколько сделали разрезов?","opts":["3","4","5","6"],"ans":1,"exfig":"log:5","hint":"Разрезов на один меньше, чем частей.","ex":"5 &minus; 1 = <b>4<\/b> разреза."},{"type":"mcq","topic":"Логика","q":"Петя выше Коли, а Коля выше Саши. Кто из мальчиков самый низкий?","opts":["Петя","Коля","Саша","Определить нельзя"],"ans":2,"hint":"Выстрой цепочку по росту.","ex":"Петя выше Коли, Коля выше Саши — значит самый низкий <b>Саша<\/b>."},{"type":"open","topic":"Сложение","q":"Сколько будет 128 + 245?","ans":373,"hint":"Складывай по разрядам.","ex":"100 + 200 = 300, 20 + 40 = 60, 8 + 5 = 13. Вместе 300 + 60 + 13 = <b>373<\/b>."},{"type":"open","topic":"Вычитание","q":"На сколько 91 больше, чем 56?","ans":35,"hint":"Вычитание.","ex":"91 &minus; 56 = <b>35<\/b>."},{"type":"open","topic":"Умножение","q":"В трёх коробках лежит по 8 карандашей. Сколько всего карандашей в коробках?","ans":24,"hint":"По 8 взяли три раза.","ex":"8 × 3 = <b>24<\/b> карандаша."},{"type":"open","topic":"Доли","q":"Половина числа равна 14. Чему равно само число?","ans":28,"hint":"Число вдвое больше половины.","ex":"14 × 2 = <b>28<\/b>."},{"type":"open","topic":"Модельный метод","q":"У Даши в 3 раза больше марок, чем у Ромы. Вместе у них 32 марки. Сколько марок у Ромы?","ans":8,"exfig":"bars:Рома=1;Даша=3;@total=32","hint":"Рома — 1 доля, Даша — 3 доли.","ex":"Всего 4 доли: 32 ÷ 4 = <b>8<\/b> марок у Ромы, у Даши 24. Проверка: 8 + 24 = 32. ✓"},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 1, 2, 4, 8, ?","ans":16,"hint":"Во сколько раз растут числа?","ex":"Каждое число вдвое больше предыдущего: 8 × 2 = <b>16<\/b>."},{"type":"open","topic":"Обратный ход","q":"Задуманное число умножили на 4 и прибавили 5 — получилось 29. Какое число задумали?","ans":6,"hint":"Отменяй с конца: сначала убери 5, потом раздели.","ex":"29 &minus; 5 = 24, затем 24 ÷ 4 = <b>6<\/b>. Проверка: 6 × 4 = 24, 24 + 5 = 29. ✓"},{"type":"open","topic":"Интервалы","q":"Вдоль дорожки длиной 24 м посадили кусты через каждые 4 м, от начала до конца. Сколько посадили кустов?","ans":7,"exfig":"posts:24,4","hint":"Сначала промежутки, потом плюс один куст.","ex":"Промежутков: 24 ÷ 4 = 6. Кустов: 6 + 1 = <b>7<\/b>."},{"type":"open","topic":"Перебор","q":"Сколько различных двузначных чисел можно составить из цифр 2, 4 и 6, если цифры в числе не повторяются?","ans":6,"hint":"Выпиши по первой цифре: на 2, на 4, на 6.","ex":"24, 26, 42, 46, 62, 64 — всего <b>6<\/b> чисел."},{"type":"open","topic":"Отрезки","fig":"tristrip:4","q":"Из палочек выложили в ряд 4 треугольника с общими сторонами: на первый ушло 3 палочки, на каждый следующий — ещё 2. Сколько палочек ушло всего?","ans":9,"hint":"Первый треугольник особенный, остальных три.","ex":"3 + 2 × 3 = 3 + 6 = <b>9<\/b> палочек."}]},"day22":{"intro":{"title":"Приём дня: считай промежутки, а не предметы","body":"<p>Это самая коварная тема олимпиад для второго класса. Правило короткое:<\/p><ul><li><b>Столбы вдоль дороги<\/b> (от начала до конца): столбов на <b>один больше<\/b>, чем промежутков.<\/li><li><b>Распилы бревна<\/b>: распилов на <b>один меньше<\/b>, чем частей.<\/li><li><b>Этажи<\/b>: пролётов лестницы на <b>один меньше<\/b>, чем этажей. От 1-го до 3-го этажа — два пролёта, а не три.<\/li><li><b>Удары часов<\/b>: промежутков между ударами на один меньше, чем ударов.<\/li><li><b>По кругу<\/b> — исключение: сколько предметов, столько и промежутков.<\/li><\/ul><p>Если запутались — нарисуйте пять точек на линии и посчитайте промежутки. Рисунок всегда честнее памяти.<\/p>"},"questions":[{"type":"mcq","topic":"Столбы","fig":"posts:40,10","q":"Вдоль дороги длиной 40 м поставили столбы через каждые 10 м, от самого начала до самого конца. Сколько поставили столбов?","opts":["3","4","5","6"],"ans":2,"hint":"Сначала посчитай промежутки, потом добавь один столб.","ex":"Промежутков: 40 ÷ 10 = 4. Столбов на один больше: 4 + 1 = <b>5<\/b>."},{"type":"mcq","topic":"Распилы","q":"Бревно распилили на 4 части. Сколько сделали распилов?","opts":["2","3","4","5"],"ans":1,"exfig":"log:4","hint":"Здесь правило обратное: распилов меньше, чем частей.","ex":"Каждый распил добавляет одну часть, а начинали с целого бревна: 4 &minus; 1 = <b>3<\/b>."},{"type":"mcq","topic":"Этажи","q":"Между первым и вторым этажом 12 ступенек. Сколько ступенек надо пройти от первого этажа до третьего?","opts":["12","24","36","48"],"ans":1,"exfig":"floors:3","hint":"От первого до третьего — два пролёта, а не три.","ex":"Пролётов два: 12 × 2 = <b>24<\/b> ступеньки."},{"type":"mcq","topic":"По кругу","q":"Вокруг круглого стола на равном расстоянии расставили 6 стульев. Сколько промежутков между соседними стульями?","opts":["5","6","7","12"],"ans":1,"hint":"По кругу нет ни начала, ни конца — правило «на один меньше» здесь не работает.","ex":"По кругу промежутков столько же, сколько стульев: <b>6<\/b>."},{"type":"mcq","topic":"Столбы","q":"Вдоль дорожки посадили 8 кустов через каждые 2 м, от начала до конца. Какова длина дорожки?","opts":["14 м","16 м","18 м","10 м"],"ans":0,"hint":"Кустов 8, а промежутков между ними на один меньше.","ex":"Промежутков 8 &minus; 1 = 7, каждый по 2 м: 7 × 2 = <b>14 м<\/b>."},{"type":"open","topic":"Распилы","q":"Сколько разрезов нужно сделать, чтобы разрезать ленту на 7 частей?","ans":6,"hint":"Разрезов на один меньше, чем частей.","ex":"7 &minus; 1 = <b>6<\/b> разрезов."},{"type":"open","topic":"Столбы","q":"Вдоль забора длиной 30 м посадили деревья через каждые 5 м, от начала до конца. Сколько посадили деревьев?","ans":7,"exfig":"posts:30,5","hint":"Сначала промежутки, потом плюс одно дерево.","ex":"Промежутков: 30 ÷ 5 = 6. Деревьев: 6 + 1 = <b>7<\/b>."},{"type":"open","topic":"Этажи","q":"От первого этажа до четвёртого Петя прошёл 36 ступенек. Сколько ступенек между соседними этажами?","ans":12,"exfig":"floors:4","hint":"От первого до четвёртого — три пролёта.","ex":"36 ÷ 3 = <b>12<\/b> ступенек в одном пролёте."},{"type":"open","topic":"Распилы","q":"Один распил бревна занимает 3 минуты. За сколько минут бревно распилят на 4 части?","ans":9,"exfig":"log:4","hint":"Сначала посчитай число распилов.","ex":"Распилов 4 &minus; 1 = 3, каждый по 3 минуты: 3 × 3 = <b>9<\/b> минут."},{"type":"open","topic":"Удары часов","q":"Часы бьют 3 раза за 4 секунды. За сколько секунд они пробьют 5 раз? Промежутки между ударами одинаковые.","ans":8,"exfig":"clockstrike:5","hint":"Считай не удары, а промежутки между ними: при трёх ударах их два.","ex":"При 3 ударах 2 промежутка: 4 ÷ 2 = 2 секунды на промежуток. При 5 ударах промежутков 4: 2 × 4 = <b>8<\/b> секунд."}]},"day23":{"intro":{"title":"Приём дня: выписывай то, что известно","body":"<p><b>Кто выше, кто младше.<\/b> Рисуй цепочку: «Аня выше Бори, Боря выше Вани» — значит Аня → Боря → Ваня, и самая высокая Аня.<\/p><p><b>Правда и ложь.<\/b> Если сказано «правду сказал ровно один», проверяй по очереди каждое предположение и считай, сколько получилось правдивых фраз. Подходит только то предположение, где счёт совпал с условием.<\/p><p><b>Слово «наверняка»<\/b> значит: считаем самый неудачный случай. Если в ящике шары двух цветов, то два вынутых шара могут оказаться разными — а вот третий обязательно совпадёт с одним из них.<\/p><p><b>Перебор — это не стыдно.<\/b> Во втором классе почти любую логическую задачу можно решить, аккуратно проверив все случаи.<\/p>"},"questions":[{"type":"mcq","topic":"Упорядочивание","q":"Аня выше Бори, а Боря выше Вани. Кто из них самый высокий?","opts":["Аня","Боря","Ваня","Определить нельзя"],"ans":0,"hint":"Выстрой всех в цепочку по росту.","ex":"Цепочка: <b>Аня<\/b> выше Бори, Боря выше Вани. Значит Аня выше всех."},{"type":"mcq","topic":"Соответствия","q":"У Ани, Оли и Веры платья трёх цветов: красное, синее и зелёное. Оля в синем, Аня не в красном. Какого цвета платье у Ани?","opts":["Красное","Синее","Зелёное","Определить нельзя"],"ans":2,"hint":"Синее уже занято Олей, красное Ане не подходит — что остаётся?","ex":"Синее у Оли, красное Ане не подходит, значит у Ани <b>зелёное<\/b>, а красное у Веры."},{"type":"mcq","topic":"Правда и ложь","q":"Кто-то один съел конфету. Аня говорит: «Я не ела», Боря: «Конфету съела Аня», Вера: «Я не ела». Правду сказал ровно один человек. Кто съел конфету?","opts":["Аня","Боря","Вера","Определить нельзя"],"ans":2,"hint":"Проверь три предположения по очереди и посчитай правдивые фразы.","ex":"Если ела Аня — правдивы Боря и Вера, это двое. Если Боря — правдивы Аня и Вера, снова двое. Если <b>Вера<\/b> — правдива только Аня. Подходит третий случай."},{"type":"mcq","topic":"Упорядочивание","q":"Маша старше Даши, но младше Лены. Кто из девочек самая младшая?","opts":["Маша","Даша","Лена","Определить нельзя"],"ans":1,"hint":"Выстрой цепочку от самой старшей к самой младшей.","ex":"Лена старше Маши, Маша старше Даши. Значит самая младшая — <b>Даша<\/b>."},{"type":"mcq","topic":"Наверняка","q":"В коробке лежат 5 красных и 5 синих шаров. Сколько шаров надо вынуть не глядя, чтобы наверняка среди них оказались два шара одного цвета?","opts":["2","3","4","6"],"ans":1,"hint":"Представь самый неудачный случай: первые два шара разного цвета.","ex":"Два шара могут оказаться разными, но третий обязательно совпадёт с одним из них: <b>3<\/b> шара."},{"type":"open","topic":"Соответствия","q":"Аня, Боря и Вера заняли первые три места. Аня не первая и не третья. Какое место заняла Аня?","ans":2,"hint":"Осталось единственное место.","ex":"Не первое и не третье — остаётся <b>2<\/b>-е место."},{"type":"open","topic":"Наверняка","q":"В ящике лежат 4 чёрных и 6 белых носков. Сколько носков надо вынуть не глядя, чтобы наверняка оказалась пара носков одного цвета?","ans":3,"hint":"Цветов всего два — значит неудачно может пойти только первый шаг.","ex":"Первые два носка могут быть разного цвета, третий обязательно даст пару: <b>3<\/b> носка."},{"type":"open","topic":"Наверняка","q":"В мешке лежат шары трёх цветов. Сколько шаров надо вынуть не глядя, чтобы наверняка оказалось два шара одного цвета?","ans":4,"hint":"Самый неудачный случай — каждый новый шар нового цвета.","ex":"Три шара могут оказаться трёх разных цветов, а четвёртый обязательно повторит один из них: <b>4<\/b> шара."},{"type":"open","topic":"Логика с числами","q":"Задумали число: оно больше 10, меньше 15 и делится на 4. Какое это число?","ans":12,"hint":"Выпиши числа от 11 до 14 и проверь каждое.","ex":"Из чисел 11, 12, 13, 14 на 4 делится только <b>12<\/b>."},{"type":"open","topic":"Логика с числами","q":"На полке стоят 10 книг подряд. Сколько книг стоит между первой и последней?","ans":8,"hint":"Уберите из десяти книг первую и последнюю.","ex":"10 &minus; 2 = <b>8<\/b> книг."}]},"day24":{"intro":{"title":"Приём дня: считай по порядку, ничего не теряя","body":"<p><b>Перебор по порядку.<\/b> Сколько двузначных чисел выйдет из цифр 1, 2 и 3, если не повторять цифры? Выписывай по первой цифре:<\/p><div class=\"mono\">на 1: 12, 13\nна 2: 21, 23\nна 3: 31, 32\nвсего 6<\/div><p><b>Правило умножения.<\/b> Если выбор делается дважды и варианты не мешают друг другу — числа перемножают: 3 юбки и 2 блузки дают 3 × 2 = 6 нарядов.<\/p><p><b>Рукопожатия.<\/b> Каждое рукопожатие считают дважды — по одному разу за каждого участника, — поэтому в конце делят на 2. Для трёх человек: 3 × 2 ÷ 2 = 3.<\/p><p><b>Проверяй себя списком.<\/b> Если вариантов немного, выпиши их полностью: это дольше, зато наверняка.<\/p>"},"questions":[{"type":"mcq","topic":"Перебор","q":"Из цифр 1, 2 и 3 составляют двузначные числа так, чтобы обе цифры в числе были разными. Сколько чисел получится?","opts":["3","6","9","12"],"ans":1,"hint":"Первую цифру выбираем из трёх, вторую — из двух оставшихся.","ex":"12, 13, 21, 23, 31, 32 — всего <b>6<\/b> чисел. Или сразу: 3 × 2 = 6."},{"type":"mcq","topic":"Правило умножения","q":"У Кати 3 юбки и 2 блузки. Сколько разных нарядов «юбка + блузка» она может составить?","opts":["5","6","8","9"],"ans":1,"hint":"К каждой юбке подходит любая из блузок.","ex":"3 × 2 = <b>6<\/b> нарядов."},{"type":"mcq","topic":"Перебор","q":"Сколько различных двузначных чисел можно составить из цифр 4 и 8, если цифры разрешено повторять?","opts":["2","3","4","6"],"ans":2,"hint":"На каждом из двух мест может стоять любая из двух цифр — выпиши все.","ex":"44, 48, 84, 88 — всего <b>4<\/b> числа. Или сразу: 2 × 2 = 4."},{"type":"mcq","topic":"Рукопожатия","q":"Три друга пожали друг другу руки, каждый с каждым по одному разу. Сколько было рукопожатий?","opts":["2","3","6","9"],"ans":1,"hint":"Выпиши пары: первый со вторым, первый с третьим, второй с третьим.","ex":"Пар всего три, значит <b>3<\/b> рукопожатия."},{"type":"mcq","topic":"Правило умножения","q":"В кафе 4 вида мороженого и 2 вида сиропа. Сколько разных десертов «мороженое с сиропом» можно заказать?","opts":["6","8","10","12"],"ans":1,"hint":"К каждому мороженому подходит любой сироп.","ex":"4 × 2 = <b>8<\/b> десертов."},{"type":"open","topic":"Перебор","q":"Сколько различных двузначных чисел можно составить из цифр 1, 2, 3 и 4, если цифры в числе не повторяются?","ans":12,"hint":"Первую цифру выбираем из четырёх, вторую — из трёх оставшихся.","ex":"4 × 3 = <b>12<\/b> чисел."},{"type":"open","topic":"Правило умножения","q":"У Пети 2 рубашки, 3 пары брюк и 2 пары обуви. Сколько разных нарядов «рубашка + брюки + обувь» он может составить?","ans":12,"hint":"Правило умножения работает и для трёх выборов подряд.","ex":"2 × 3 × 2 = <b>12<\/b> нарядов."},{"type":"open","topic":"Рукопожатия","q":"В компании четверо друзей, и каждый пожал руку каждому ровно один раз. Сколько получилось рукопожатий?","ans":6,"hint":"Каждый жмёт руку троим, но каждое рукопожатие посчитано дважды.","ex":"4 × 3 ÷ 2 = 12 ÷ 2 = <b>6<\/b> рукопожатий."},{"type":"open","topic":"Перебор","q":"Из цифр 1, 2 и 3 составляют трёхзначные числа так, чтобы каждая цифра встречалась ровно один раз. Сколько таких чисел?","ans":6,"hint":"Первую цифру выбираем из трёх, вторую из двух, третья остаётся одна.","ex":"3 × 2 × 1 = <b>6<\/b>: 123, 132, 213, 231, 312, 321."},{"type":"open","topic":"Перебор с условием","q":"Сколько нечётных двузначных чисел можно составить из цифр 1, 2 и 3, если цифры в числе не повторяются?","ans":4,"hint":"Нечётность решает последняя цифра — начни перебор именно с неё.","ex":"Последней может быть 1 или 3. Если 1 — числа 21 и 31; если 3 — числа 13 и 23. Всего <b>4<\/b> числа."}]},"exam2":{"questions":[{"type":"mcq","topic":"Разряды","q":"Сколько всего десятков в числе 360?","opts":["3","6","36","360"],"ans":2,"hint":"Вопрос не о цифре десятков, а о том, сколько их во всём числе.","ex":"<b>36<\/b> десятков — это 36 × 10 = 360."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 53 + 48?","opts":["91","101","111","99"],"ans":1,"hint":"Сумма перевалит за сотню — не потеряй её.","ex":"50 + 40 = 90, 3 + 8 = 11. Вместе 90 + 11 = <b>101<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 100 − 68?","opts":["32","38","42","48"],"ans":0,"hint":"От 68 до 70 — два шага, а дальше до сотни тридцать.","ex":"2 + 30 = <b>32<\/b>. Проверка: 68 + 32 = 100. ✓"},{"type":"mcq","topic":"Умножение","q":"Сколько будет 7 × 5?","opts":["12","30","35","40"],"ans":2,"hint":"Пять раз по семь — или семь раз по пять.","ex":"7 × 5 = <b>35<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 45 ÷ 5?","opts":["7","8","9","10"],"ans":2,"hint":"Сколько пятёрок помещается в 45?","ex":"9 × 5 = 45, значит 45 ÷ 5 = <b>9<\/b>."},{"type":"mcq","topic":"Доли","q":"Чему равна половина числа 46?","opts":["21","22","23","24"],"ans":2,"hint":"Раздели отдельно 40 и 6.","ex":"40 ÷ 2 = 20, 6 ÷ 2 = 3. Вместе <b>23<\/b>."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 4, 8, 16, 32, ?","opts":["40","48","64","96"],"ans":2,"hint":"Разности растут слишком быстро — проверь умножение.","ex":"Каждое число вдвое больше предыдущего: 32 × 2 = <b>64<\/b>."},{"type":"mcq","topic":"Деньги","q":"Сколько рублей стоят три тетради по 24 рубля?","opts":["62","72","82","96"],"ans":1,"hint":"По 24 рубля три раза: 20 × 3 и 4 × 3 отдельно.","ex":"24 × 3 = 60 + 12 = <b>72<\/b> рубля."},{"type":"mcq","topic":"Время","q":"Урок начался в 12:35 и длился 45 минут. Во сколько он закончился?","opts":["13:10","13:20","13:30","12:80"],"ans":1,"hint":"Сначала дойди до 13:00, потом добавь остаток.","ex":"От 12:35 до 13:00 — 25 минут. Остаётся 45 &minus; 25 = 20 минут: <b>13:20<\/b>."},{"type":"mcq","topic":"Масса","q":"Сколько граммов в 3 килограммах?","opts":["30","300","3000","30000"],"ans":2,"hint":"В одном килограмме 1000 граммов.","ex":"1000 × 3 = <b>3000 г<\/b>."},{"type":"mcq","topic":"Периметр","fig":"rect:8 см,5 см","q":"Чему равен периметр прямоугольника со сторонами 8 см и 5 см?","opts":["13 см","26 см","40 см","20 см"],"ans":1,"hint":"Сложи длину и ширину, потом удвой.","ex":"(8 + 5) × 2 = 13 × 2 = <b>26 см<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"Квадрат разбит на четыре одинаковые клетки. Сколько всего прямоугольников можно найти на рисунке (квадраты тоже считаются)?","opts":["4","6","8","9"],"ans":3,"hint":"Кроме пяти квадратов есть прямоугольники из двух клеток.","ex":"Квадратов 5, прямоугольников из двух клеток 4. Всего 5 + 4 = <b>9<\/b>."},{"type":"mcq","topic":"Кратное сравнение","q":"У Коли 7 машинок, а у Вити в 3 раза больше. Сколько машинок у Вити?","opts":["10","14","21","24"],"ans":2,"hint":"«В 3 раза больше» — умножаем.","ex":"7 × 3 = <b>21<\/b> машинка."},{"type":"mcq","topic":"Интервалы","q":"Между первым и вторым этажом 14 ступенек. Сколько ступенек надо пройти от первого этажа до четвёртого?","opts":["28","42","56","14"],"ans":1,"exfig":"floors:4","hint":"От первого до четвёртого — три пролёта, а не четыре.","ex":"14 × 3 = <b>42<\/b> ступеньки."},{"type":"mcq","topic":"Наверняка","q":"В ящике лежат 6 красных и 6 жёлтых яблок. Сколько яблок надо взять не глядя, чтобы наверняка оказалось два яблока одного цвета?","opts":["2","3","4","7"],"ans":1,"hint":"Худший случай: первые два яблока разного цвета.","ex":"Третье яблоко обязательно совпадёт по цвету с одним из первых двух: <b>3<\/b>."},{"type":"open","topic":"Сложение","q":"Сколько будет 305 + 176?","ans":481,"hint":"Складывай по разрядам, не забудь переход в десятках.","ex":"300 + 100 = 400, 0 + 70 = 70, 5 + 6 = 11. Вместе 400 + 70 + 11 = <b>481<\/b>."},{"type":"open","topic":"Два действия","q":"У Маши было 52 наклейки. Она отдала 17 наклеек, а потом ей подарили ещё 25. Сколько наклеек у неё стало?","ans":60,"hint":"По порядку: сначала отдала, потом получила.","ex":"52 &minus; 17 = 35, затем 35 + 25 = <b>60<\/b> наклеек."},{"type":"open","topic":"Два действия","q":"В пяти пакетах лежит по 4 яблока и ещё 3 яблока лежат отдельно. Сколько всего яблок?","ans":23,"hint":"Сначала яблоки в пакетах, потом добавь отдельные.","ex":"4 × 5 = 20, затем 20 + 3 = <b>23<\/b> яблока."},{"type":"open","topic":"Доли","q":"Четверть числа равна 7. Чему равно само число?","ans":28,"hint":"Если четверть известна, всё число в 4 раза больше.","ex":"7 × 4 = <b>28<\/b>. Проверка: 28 ÷ 4 = 7. ✓"},{"type":"open","topic":"Модельный метод","q":"У Оли на 8 конфет больше, чем у Веры, а вместе у них 26 конфет. Сколько конфет у Веры?","ans":9,"exfig":"bars:Вера=1;Оля=1+8;@total=26","hint":"Убери разницу из суммы — останутся две одинаковые доли.","ex":"(26 &minus; 8) ÷ 2 = <b>9<\/b> конфет у Веры, у Оли 17. Проверка: 9 + 17 = 26. ✓"},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 1, 4, 9, ?","ans":16,"hint":"Это числа, которые получаются умножением числа на само себя.","ex":"1×1, 2×2, 3×3, значит дальше 4 × 4 = <b>16<\/b>."},{"type":"open","topic":"Обратный ход","q":"Задуманное число разделили на 3, потом вычли 2 — получилось 5. Какое число задумали?","ans":21,"hint":"Отменяй с конца: сначала верни 2, потом умножь.","ex":"5 + 2 = 7, затем 7 × 3 = <b>21<\/b>. Проверка: 21 ÷ 3 = 7, 7 &minus; 2 = 5. ✓"},{"type":"open","topic":"Удары часов","q":"Часы бьют 2 раза за 3 секунды. За сколько секунд они пробьют 5 раз? Промежутки между ударами одинаковые.","ans":12,"exfig":"clockstrike:5","hint":"Считай промежутки: при двух ударах он всего один.","ex":"При 2 ударах 1 промежуток — значит он длится 3 секунды. При 5 ударах промежутков 4: 3 × 4 = <b>12<\/b> секунд."},{"type":"open","topic":"Перебор","q":"У Пети 4 футболки и 3 пары шорт. Сколько разных нарядов «футболка + шорты» он может составить?","ans":12,"hint":"К каждой футболке подходят любые шорты.","ex":"4 × 3 = <b>12<\/b> нарядов."},{"type":"open","topic":"Лесенки","q":"Лесенка сложена из столбиков по 1, 2, 3, 4, 5, 6 и 7 кубиков. Сколько всего кубиков в лесенке?","ans":28,"exfig":"stairs:1,2,3,4,5,6,7","hint":"Складывай парами с краёв: 1 + 7, 2 + 6, 3 + 5, а четвёрка останется одна.","ex":"(1+7) + (2+6) + (3+5) + 4 = 8 + 8 + 8 + 4 = <b>28<\/b> кубиков."}]},"exam3":{"questions":[{"type":"mcq","topic":"Сравнение чисел","q":"Какое из чисел 519, 591, 195 и 915 самое большое?","opts":["519","591","195","915"],"ans":3,"hint":"Сравнивай сначала сотни.","ex":"Сотен больше всего у <b>915<\/b> — девять."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 67 + 25?","opts":["82","88","92","93"],"ans":2,"hint":"Десятки и единицы отдельно.","ex":"60 + 20 = 80, 7 + 5 = 12. Вместе 80 + 12 = <b>92<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 91 − 38?","opts":["47","53","57","63"],"ans":1,"hint":"Убери сначала 30, потом 8.","ex":"91 &minus; 30 = 61, 61 &minus; 8 = <b>53<\/b>. Проверка: 53 + 38 = 91. ✓"},{"type":"mcq","topic":"Умножение","q":"Сколько будет 9 × 3?","opts":["18","24","27","30"],"ans":2,"hint":"Три раза по девять.","ex":"9 × 3 = <b>27<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 48 ÷ 4?","opts":["8","10","12","14"],"ans":2,"hint":"Раздели отдельно 40 и 8.","ex":"40 ÷ 4 = 10, 8 ÷ 4 = 2. Вместе <b>12<\/b>. Проверка: 12 × 4 = 48. ✓"},{"type":"mcq","topic":"Доли","q":"У Пети было 28 марок, и он отдал другу четверть из них. Сколько марок он отдал?","opts":["4","7","14","21"],"ans":1,"hint":"Четверть — деление на 4.","ex":"28 ÷ 4 = <b>7<\/b> марок."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 1, 2, 4, 7, ?","opts":["9","10","11","12"],"ans":2,"hint":"Выпиши разности: 1, 2, 3…","ex":"Разности растут на единицу, дальше +4: 7 + 4 = <b>11<\/b>."},{"type":"mcq","topic":"Деньги","q":"У Кати было 100 рублей, и она купила три ручки по 18 рублей. Сколько рублей у неё осталось?","opts":["36","44","46","54"],"ans":2,"hint":"Сначала посчитай стоимость всех ручек.","ex":"Ручки: 18 × 3 = 54 р. Осталось 100 &minus; 54 = <b>46<\/b> рублей."},{"type":"mcq","topic":"Время","q":"Сколько часов проходит от 7 часов утра до 8 часов вечера?","opts":["11","12","13","15"],"ans":2,"hint":"Восемь вечера — это 20 часов.","ex":"20 &minus; 7 = <b>13<\/b> часов."},{"type":"mcq","topic":"Объём","q":"Сколько миллилитров в 3 литрах?","opts":["300","3000","30000","30"],"ans":1,"hint":"В одном литре 1000 мл.","ex":"1000 × 3 = <b>3000 мл<\/b>."},{"type":"mcq","topic":"Периметр","q":"Периметр квадрата равен 28 см. Чему равна его сторона?","opts":["4 см","7 см","9 см","14 см"],"ans":1,"hint":"Периметр состоит из четырёх одинаковых сторон.","ex":"28 ÷ 4 = <b>7 см<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:3,3","q":"На рисунке квадрат, разбитый на девять одинаковых клеток. Сколько всего квадратов можно на нём найти?","opts":["9","13","14","18"],"ans":2,"hint":"Считай по размерам: 1×1, 2×2 и 3×3.","ex":"9 + 4 + 1 = <b>14<\/b> квадратов."},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 40 больше, чем 10?","opts":["В 2 раза","В 3 раза","В 4 раза","На 30"],"ans":2,"hint":"Деление.","ex":"40 ÷ 10 = 4, значит <b>в 4 раза<\/b>."},{"type":"mcq","topic":"Интервалы","q":"Вокруг клумбы на равном расстоянии поставили 7 фонарей. Сколько промежутков между соседними фонарями?","opts":["6","7","8","14"],"ans":1,"hint":"По кругу нет ни первого, ни последнего.","ex":"По кругу промежутков столько же, сколько фонарей: <b>7<\/b>."},{"type":"mcq","topic":"Логика","q":"Есть три коробки, конфеты лежат ровно в одной. На первой написано «Конфеты здесь», на второй — «Конфет здесь нет». Верна ровно одна надпись. В какой коробке конфеты?","opts":["В первой","Во второй","В третьей","Определить нельзя"],"ans":2,"hint":"Проверь все три случая и посчитай, сколько надписей оказалось верными.","ex":"Если в первой — верны обе надписи. Если во второй — обе неверны. Если в <b>третьей<\/b> — верна только вторая надпись. Подходит третий случай."},{"type":"open","topic":"Сложение","q":"Сколько будет 420 + 385?","ans":805,"hint":"Складывай по разрядам.","ex":"400 + 300 = 700, 20 + 80 = 100, 0 + 5 = 5. Вместе 700 + 100 + 5 = <b>805<\/b>."},{"type":"open","topic":"Вычитание","q":"На сколько 100 больше, чем 43?","ans":57,"hint":"Вычитание.","ex":"100 &minus; 43 = <b>57<\/b>."},{"type":"open","topic":"Два действия","q":"В четырёх коробках лежит по 6 яиц. Два яйца разбили. Сколько яиц осталось?","ans":22,"hint":"Сначала посчитай все яйца, потом убери разбитые.","ex":"6 × 4 = 24 яйца, осталось 24 &minus; 2 = <b>22<\/b>."},{"type":"open","topic":"Доли","q":"Половина числа равна 25. Чему равно само число?","ans":50,"hint":"Число вдвое больше половины.","ex":"25 × 2 = <b>50<\/b>."},{"type":"open","topic":"Модельный метод","q":"В двух вазах вместе 36 цветов, причём в первой вазе в 2 раза больше, чем во второй. Сколько цветов во второй вазе?","ans":12,"exfig":"bars:вторая=1;первая=2;@total=36","hint":"Вторая — 1 доля, первая — 2 доли.","ex":"Всего 3 доли: 36 ÷ 3 = <b>12<\/b> цветов во второй, 24 в первой. Проверка: 12 + 24 = 36. ✓"},{"type":"open","topic":"Закономерности","q":"Продолжи ряд треугольных чисел: 1, 3, 6, 10, 15, ?","ans":21,"exfig":"triangles:1,3,6,10,?","hint":"Разности: 2, 3, 4, 5… Какая следующая?","ex":"Дальше прибавляем 6: 15 + 6 = <b>21<\/b>."},{"type":"open","topic":"Обратный ход","q":"Задуманное число удвоили и вычли 7 — получилось 15. Какое число задумали?","ans":11,"hint":"Отменяй с конца: сначала верни 7, потом раздели пополам.","ex":"15 + 7 = 22, затем 22 ÷ 2 = <b>11<\/b>. Проверка: 11 × 2 = 22, 22 &minus; 7 = 15. ✓"},{"type":"open","topic":"Интервалы","q":"Ленту длиной 60 см разрезали на куски по 10 см. Сколько сделали разрезов?","ans":5,"hint":"Сначала посчитай, сколько получилось кусков.","ex":"Кусков: 60 ÷ 10 = 6. Разрезов на один меньше: 6 &minus; 1 = <b>5<\/b>."},{"type":"open","topic":"Перебор","q":"Сколько различных трёхзначных чисел можно составить из цифр 4, 5 и 6, если каждая цифра используется ровно один раз?","ans":6,"hint":"Первую цифру выбираем из трёх, вторую из двух, третья остаётся.","ex":"3 × 2 × 1 = <b>6<\/b>: 456, 465, 546, 564, 645, 654."},{"type":"open","topic":"Отрезки","fig":"grid:4,1","q":"В полоске из четырёх одинаковых клеток — сколько всего прямоугольников можно найти?","ans":10,"hint":"Считай по длине: из одной клетки, из двух, из трёх, из всех четырёх.","ex":"4 + 3 + 2 + 1 = <b>10<\/b> прямоугольников."}]},"day28":{"intro":{"title":"Сегодня закрепляем уверенность","body":"<p>Никаких новых тем. Десять знакомых задач — просто чтобы рука была тёплой.<\/p><p><b>Что повторить вслух перед сном:<\/b><\/p><ul><li>В секции A за неверный ответ снимают балл: не смогла вычеркнуть хотя бы два варианта — пропускай.<\/li><li>В секции B за ошибку не снимают ничего: пустых ответов быть не должно.<\/li><li>Идём в два прохода: сначала всё лёгкое, потом трудное.<\/li><li>Подчёркивай вопрос в условии карандашом — половина ошибок из-за спешки.<\/li><\/ul><p>И самое главное: лечь спать вовремя. Выспавшийся человек считает быстрее любого повторения.<\/p>"},"questions":[{"type":"mcq","topic":"Сложение","q":"Сколько будет 45 + 26?","opts":["61","69","71","81"],"ans":2,"hint":"Десятки к десяткам, единицы к единицам.","ex":"40 + 20 = 60, 5 + 6 = 11. Вместе 60 + 11 = <b>71<\/b>."},{"type":"mcq","topic":"Умножение","q":"Сколько будет 6 × 4?","opts":["10","18","24","28"],"ans":2,"hint":"Четыре раза по шесть.","ex":"6 × 4 = <b>24<\/b>."},{"type":"mcq","topic":"Доли","q":"Чему равна половина числа 18?","opts":["6","8","9","12"],"ans":2,"hint":"Деление на 2.","ex":"18 ÷ 2 = <b>9<\/b>."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 6, 12, 18, 24, ?","opts":["28","30","32","36"],"ans":1,"hint":"Шаг одинаковый.","ex":"Каждый раз прибавляем 6: 24 + 6 = <b>30<\/b>."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"Посчитай на рисунке все квадраты — и маленькие, и большой. Сколько их всего?","opts":["4","5","6","8"],"ans":1,"hint":"Большой квадрат тоже считается.","ex":"4 клетки и 1 большой квадрат: 4 + 1 = <b>5<\/b>."},{"type":"open","topic":"Вычитание","q":"Сколько будет 80 − 37?","ans":43,"hint":"Убери сначала 30, потом 7.","ex":"80 &minus; 30 = 50, 50 &minus; 7 = <b>43<\/b>."},{"type":"open","topic":"Деление","q":"Сколько будет 40 ÷ 5?","ans":8,"hint":"Какое число, умноженное на 5, даёт 40?","ex":"8 × 5 = 40, значит 40 ÷ 5 = <b>8<\/b>."},{"type":"open","topic":"Часть и целое","q":"У Ани и Бори наклеек поровну, а всего у них 30 наклеек. Сколько наклеек у Ани?","ans":15,"exfig":"parts:30,15,15","hint":"Поровну — значит пополам.","ex":"30 ÷ 2 = <b>15<\/b> наклеек."},{"type":"open","topic":"Интервалы","q":"Ленту разрезали на 6 частей. Сколько сделали разрезов?","ans":5,"hint":"Разрезов на один меньше, чем частей.","ex":"6 &minus; 1 = <b>5<\/b> разрезов."},{"type":"open","topic":"Обратный ход","q":"Задумали число, прибавили 5 и получили 21. Какое число задумали?","ans":16,"hint":"Прибавляли — теперь вычитай.","ex":"21 &minus; 5 = <b>16<\/b>. Проверка: 16 + 5 = 21. ✓"}]}}};</script>

<script>
/* eslint-disable */
/* ==========================================================================
   SASMO — рисунки к задачам

   Картинки не лежат файлами, а рисуются на месте: это векторная графика,
   она не мылится на планшете, переживает тёмную тему и одинаково работает
   и в многостраничной версии, и в одностраничной, и на file://.

   В задаче:  fig: 'grid:3,3'     — рисунок к условию
              exfig: 'bars:...'   — рисунок к разбору (появляется вместе с ответом)
              img: 'img/sasmo/…'  — обычная картинка файлом, если понадобится

   Спецификация — строка «имя:аргументы через запятую».
   Список имён — в объекте SHAPES ниже.
   ========================================================================== */

(function () {
  'use strict';

  var U = 34;          // сторона клетки по умолчанию

  /* -------------------------------------------------------------- служебное */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function num(v, dflt) {
    var n = parseFloat(v);
    return isNaN(n) ? dflt : n;
  }

  function svg(w, h, inner, label) {
    w = Math.round(w); h = Math.round(h);
    return '<figure class="fig"><svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" '
         + 'height="' + h + '" role="img" aria-label="' + esc(label || 'рисунок к задаче') + '">'
         + inner + '</svg></figure>';
  }

  function rect(x, y, w, h, cls) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" class="'
         + (cls || 'st') + '"/>';
  }

  function line(x1, y1, x2, y2, cls) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="'
         + (cls || 'st') + '"/>';
  }

  function txt(x, y, s, cls) {
    return '<text x="' + x + '" y="' + y + '" class="' + (cls || 'lbl') + '">' + esc(s) + '</text>';
  }

  function dot(x, y, r, cls) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + (r || 5) + '" class="' + (cls || 'pt') + '"/>';
  }

  /* Фигурная скобка справа: «всё это вместе — одна величина». */
  function braceRight(x, y1, y2, label) {
    var m = (y1 + y2) / 2, d = 8;
    return '<path d="M' + x + ' ' + y1 + ' q' + d + ' 0 ' + d + ' ' + d
         + ' L' + (x + d) + ' ' + (m - d) + ' q0 ' + d + ' ' + d + ' ' + d
         + ' q' + (-d) + ' 0 ' + (-d) + ' ' + d + ' L' + (x + d) + ' ' + (y2 - d)
         + ' q0 ' + d + ' ' + (-d) + ' ' + d + '" class="st thin"/>'
         + txt(x + 2 * d + 4, m + 5, label);
  }

  /* Фигурная скобка сверху. */
  function braceTop(x1, x2, y, label) {
    var m = (x1 + x2) / 2, d = 7;
    return '<path d="M' + x1 + ' ' + y + ' q0 ' + (-d) + ' ' + d + ' ' + (-d)
         + ' L' + (m - d) + ' ' + (y - d) + ' q' + d + ' 0 ' + d + ' ' + (-d)
         + ' q0 ' + d + ' ' + d + ' ' + d + ' L' + (x2 - d) + ' ' + (y - d)
         + ' q' + d + ' 0 ' + d + ' ' + d + '" class="st thin"/>'
         + '<text x="' + m + '" y="' + (y - 2 * d - 7) + '" class="lbl mid">' + esc(label) + '</text>';
  }

  /* =========================================================== сами фигуры === */

  var SHAPES = {};

  /* grid:C,R — прямоугольник, разбитый на C столбцов и R рядов.
     Рисунок к «сколько квадратов / прямоугольников на рисунке». */
  SHAPES.grid = function (a) {
    var c = num(a[0], 3), r = num(a[1], c);
    var u = Math.min(U, Math.round(300 / Math.max(c, r)));
    var w = c * u, h = r * u, p = 14;
    var s = rect(p, p, w, h, 'st fill');
    for (var i = 1; i < c; i++) s += line(p + i * u, p, p + i * u, p + h, 'st thin');
    for (var j = 1; j < r; j++) s += line(p, p + j * u, p + w, p + j * u, 'st thin');
    return svg(w + 2 * p, h + 2 * p, s, 'сетка ' + c + ' на ' + r);
  };

  /* tri:K — треугольник, разрезанный отрезками из вершины на K маленьких. */
  SHAPES.tri = function (a) {
    var k = num(a[0], 3), w = 240, h = 140, p = 14;
    var ax = p + w / 2, ay = p, by = p + h;
    var s = '<polygon points="' + ax + ',' + ay + ' ' + p + ',' + by + ' ' + (p + w) + ',' + by
          + '" class="st fill"/>';
    for (var i = 1; i < k; i++) s += line(ax, ay, p + w * i / k, by, 'st thin');
    return svg(w + 2 * p, h + 2 * p, s, 'треугольник, разделённый на ' + k + ' части');
  };

  /* dots:1,4,9,? — ряд фигур из точек (квадрат n на n). «?» — искомая фигура. */
  SHAPES.dots = function (a) {
    var step = 15, pad = 16, gap = 32, x = pad, boxes = [];

    a.forEach(function (v) {
      var side = v === '?' ? 3 : Math.round(Math.sqrt(num(v, 1)));
      boxes.push({ v: v, side: side, w: Math.max((side - 1) * step, 16) });
    });

    var maxSide = boxes.reduce(function (m, b) { return Math.max(m, b.side); }, 1);
    var h = (maxSide - 1) * step + pad * 2 + 24;
    var base = h - 32;
    var s = '';

    boxes.forEach(function (b, n) {
      if (b.v === '?') {
        s += '<text x="' + (x + b.w / 2) + '" y="' + (base - b.w / 2 + 8) + '" class="lbl big mid">?</text>';
      } else {
        for (var r = 0; r < b.side; r++) {
          for (var c = 0; c < b.side; c++) s += dot(x + c * step, base - r * step, 4.5);
        }
      }
      s += '<text x="' + (x + b.w / 2) + '" y="' + (h - 6) + '" class="lbl sm mid">' + (n + 1) + '-я</text>';
      x += b.w + gap;
    });

    return svg(x - gap + pad, h, s, 'последовательность фигур из точек');
  };

  /* triangles:1,3,6,? — то же, но треугольные числа: ряды 1, 2, 3 … точек. */
  SHAPES.triangles = function (a) {
    var step = 16, pad = 16, gap = 30, x = pad, boxes = [];

    a.forEach(function (v) {
      var n = num(v, 1), rows = 3;
      if (v !== '?') { rows = Math.round((Math.sqrt(8 * n + 1) - 1) / 2); }
      boxes.push({ v: v, rows: rows, w: Math.max((rows - 1) * step, 16) });
    });

    var maxRows = boxes.reduce(function (m, b) { return Math.max(m, b.rows); }, 1);
    var h = (maxRows - 1) * step + pad * 2 + 24;
    var base = h - 32;
    var s = '';

    boxes.forEach(function (b, n) {
      if (b.v === '?') {
        s += '<text x="' + (x + b.w / 2) + '" y="' + (base - b.w / 2 + 8) + '" class="lbl big mid">?</text>';
      } else {
        for (var r = 0; r < b.rows; r++) {
          var cnt = r + 1, y = base - (b.rows - 1 - r) * step;
          for (var c = 0; c < cnt; c++) {
            s += dot(x + b.w / 2 - (cnt - 1) * step / 2 + c * step, y, 4.5);
          }
        }
      }
      s += '<text x="' + (x + b.w / 2) + '" y="' + (h - 6) + '" class="lbl sm mid">' + (n + 1) + '-я</text>';
      x += b.w + gap;
    });

    return svg(x - gap + pad, h, s, 'последовательность треугольников из точек');
  };

  /* points:4 — точки на прямой: к задачам «сколько отрезков». */
  SHAPES.points = function (a) {
    var n = num(a[0], 4), p = 28;
    var u = Math.min(62, Math.round(300 / Math.max(n - 1, 1)));
    var w = (n - 1) * u, y = 46, names = 'ABCDEFGHKLMN';
    var s = line(p - 16, y, p + w + 16, y, 'st thin');

    for (var i = 0; i < n; i++) {
      s += dot(p + i * u, y, 5.5, 'pt accent')
         + '<text x="' + (p + i * u) + '" y="' + (y - 13) + '" class="lbl sm mid">'
         + (names.charAt(i) || (i + 1)) + '</text>';
    }
    return svg(w + 2 * p, y + 20, s, 'точки на прямой');
  };

  /* tristrip:3 — треугольники в ряд с общими сторонами (из палочек). */
  SHAPES.tristrip = function (a) {
    var n = num(a[0], 3), u = 54, h = Math.round(u * 0.87), p = 14, s = '';

        ? '<polygon points="' + x + ',' + (p + h) + ' ' + (x + u) + ',' + (p + h) + ' '
          + (x + u / 2) + ',' + p + '" class="st fill thin"/>'
        : '<polygon points="' + (x + u / 2) + ',' + p + ' ' + (x + 3 * u / 2) + ',' + p + ' '
          + (x + u) + ',' + (p + h) + '" class="st fill thin"/>';
    }
    return svg((n + 1) * u / 2 + 2 * p, h + 2 * p, s, 'треугольники в ряд из палочек');
  };

  /* stairs:3,2,1 — лесенка из клеток: числа — высоты столбцов слева направо. */
  SHAPES.stairs = function (a) {
    var cols = a.map(function (v) { return num(v, 1); });
    var maxH = Math.max.apply(null, cols);
    var u = Math.min(U, Math.round(260 / Math.max(cols.length, maxH)));
    var p = 14, w = cols.length * u, h = maxH * u, s = '';

    cols.forEach(function (n, i) {
      for (var j = 0; j < n; j++) s += rect(p + i * u, p + h - (j + 1) * u, u, u, 'st fill thin');
    });
    return svg(w + 2 * p, h + 2 * p, s, 'ступенчатая фигура из клеток');
  };

  /* steprect:12,8 — ступенчатая фигура внутри габаритного прямоугольника.

  SHAPES.steprect = function (a) {
    var lw = a[0] || '', lh = a[1] || '';

    var kx = x0 + Math.round(w * 0.45), ky = y0 + Math.round(h * 0.42);

    var s = rect(x0, y0, w, h, 'st dash')
          + '<polygon points="' + [x0 + ',' + y1, x0 + ',' + y0, kx + ',' + y0, kx + ',' + ky,
                                   x1 + ',' + ky, x1 + ',' + y1].join(' ') + '" class="st fill"/>';
    if (lw) s += '<text x="' + (x0 + w / 2) + '" y="' + (y1 + 20) + '" class="lbl mid">' + esc(lw) + '</text>';
    if (lh) s += '<text x="' + (x1 + 10) + '" y="' + (y0 + h / 2) + '" class="lbl">' + esc(lh) + '</text>';

    return svg(w + 2 * p + 30, h + 2 * p + 8, s, 'ступенчатая фигура в описанном прямоугольнике');
  };

  /* rect:длина,ширина — прямоугольник с подписанными сторонами, «?» разрешён. */

    var la = a[0] || '?', lb = a[1] || '?';
    var p = 22, w = 200, h = 120;
    // подпись правой стороны стоит за рамкой — холст должен её вместить,
    // иначе «12 футов» обрезается до «12 фу»
    var right = 12 + lb.length * 9;
    var s = rect(p, p, w, h, 'st fill')
          + '<text x="' + (p + w / 2) + '" y="' + (p + h + 21) + '" class="lbl mid">' + esc(la) + '</text>'
          + '<text x="' + (p + w + 10) + '" y="' + (p + h / 2 + 5) + '" class="lbl">' + esc(lb) + '</text>';
    return svg(w + p + right, h + 2 * p + 10, s, 'прямоугольник со сторонами ' + la + ' и ' + lb);

  /* segment:5,3,27 см — отрезок из N равных долей, K первых охвачены скобкой. */
  SHAPES.segment = function (a) {
    var n = num(a[0], 5), k = num(a[1], 0), label = a[2] || '';
    var u = Math.min(52, Math.round(300 / n)), p = 20, top = 46, w = n * u;
    var s = '';
    for (var i = 0; i < n; i++) s += rect(p + i * u, top, u, 26, 'st fill thin');
    if (k > 0) s += braceTop(p, p + k * u, top - 6, label);
    return svg(w + 2 * p, top + 26 + p, s, 'отрезок из ' + n + ' равных частей');
  };

  /* parts:74,38,? — модель «часть–целое»: целое сверху, части внутри полоски.
     Первое число — целое, остальные — части; «?» рисуется знаком вопроса. */
  SHAPES.parts = function (a) {
    var whole = a[0] || '?', pieces = a.slice(1);
    if (!pieces.length) return '';

    var vals = pieces.map(function (v) { return v === '?' ? null : num(v, null); });
    var known = vals.filter(function (v) { return v !== null; });
    var avg = known.length ? known.reduce(function (m, v) { return m + v; }, 0) / known.length : 1;
    var sum = vals.reduce(function (m, v) { return m + (v === null ? avg : v); }, 0) || 1;

    var p = 16, top = 46, bh = 34, full = 300;
    var x = p, s = '';

    pieces.forEach(function (label, i) {
      var w = Math.max(64, Math.round(full * (vals[i] === null ? avg : vals[i]) / sum));
      s += rect(x, top, w, bh, 'st fill thin')
         + '<text x="' + (x + w / 2) + '" y="' + (top + 23) + '" class="lbl mid">'
         + esc(label) + '</text>';
      x += w;
    });

    s += braceTop(p, x, top - 6, String(whole));
    return svg(x + p, top + bh + p, s, 'часть и целое');
  };

  /* bars:Ваня=1;Петя=3;@total=48 — модельный метод, полоски из долей.
       @total=…  скобка справа на все полоски
       @diff=…   скобка сверху над «лишними» долями самой длинной полоски
       @one=…    подпись к одной доле                                        */
  SHAPES.bars = function (a, raw) {
    var rows = [], total = null, diff = null, one = null;

    raw.split(';').forEach(function (part) {
      var eq = part.indexOf('=');
      if (eq < 0) return;
      var key = part.slice(0, eq).trim(), val = part.slice(eq + 1).trim();
      if (key === '@total') total = val;
      else if (key === '@diff') diff = val;
      else if (key === '@one') one = val;
      else {
        var plus = val.indexOf('+');                 // «1+12» — доля и подписанная разница
        rows.push(plus < 0
          ? { name: key, n: num(val, 1), extra: null }
          : { name: key, n: num(val.slice(0, plus), 1), extra: val.slice(plus + 1).trim() });
      }
    });
    if (!rows.length) return '';

    var maxN = rows.reduce(function (m, r) { return Math.max(m, r.n); }, 1);
    var u = Math.min(46, Math.max(20, Math.round(230 / maxN)));
    var bh = 28, gap = 14, pad = 12;
    var nameW = rows.reduce(function (m, r) { return Math.max(m, r.name.length); }, 0) * 8 + 12;
    var x0 = pad + nameW;

    rows.forEach(function (r) {
      r.ew = r.extra ? Math.max(u, r.extra.length * 9 + 14) : 0;
      r.w = r.n * u + r.ew;
    });
    var maxW = rows.reduce(function (m, r) { return Math.max(m, r.w); }, 0);
    var minW = rows.reduce(function (m, r) { return Math.min(m, r.w); }, maxW);

    var topPad = pad + (diff !== null ? 28 : 0);
    var s = '';

    rows.forEach(function (r, i) {
      r.y = topPad + i * (bh + gap);
      s += '<text x="' + pad + '" y="' + (r.y + 19) + '" class="lbl">' + esc(r.name) + '</text>';
      for (var j = 0; j < r.n; j++) s += rect(x0 + j * u, r.y, u, bh, 'st fill thin');
      if (r.extra) {
        s += rect(x0 + r.n * u, r.y, r.ew, bh, 'st soft thin')
           + '<text x="' + (x0 + r.n * u + r.ew / 2) + '" y="' + (r.y + 19)
           + '" class="lbl sm mid">' + esc(r.extra) + '</text>';
      }
    });

    var lastY = rows[rows.length - 1].y + bh;
    var rightX = x0 + maxW;
    var extra = pad;

    if (total !== null) {
      s += braceRight(rightX + 8, topPad, lastY, total);
      extra = 30 + String(total).length * 9;
    }
    if (diff !== null && maxW > minW) {
      s += braceTop(x0 + minW, x0 + maxW, rows[0].y - 5, diff);
    }
    var h = lastY + pad + (one ? 30 : 0);
    if (one) s += braceTop(x0, x0 + u, h - 6, one);

    return svg(rightX + extra, h, s, 'модель задачи: полоски');
  };

  /* balance:3 кубика и гиря,5 кубиков — чашечные весы в равновесии. */
  SHAPES.balance = function (a) {
    var left = a[0] || '', right = a[1] || '';
    var w = 360, h = 150, cx = w / 2, beam = 46;
    var s = line(cx, beam, cx, h - 24)
          + line(cx - 36, h - 24, cx + 36, h - 24)
          + line(cx - 124, beam, cx + 124, beam);

    [-1, 1].forEach(function (dir) {
      var px = cx + dir * 124;
      s += line(px, beam, px, beam + 18)
         + '<path d="M' + (px - 48) + ' ' + (beam + 18) + ' L' + (px + 48) + ' ' + (beam + 18)
         + ' L' + (px + 32) + ' ' + (beam + 46) + ' L' + (px - 32) + ' ' + (beam + 46)
         + ' Z" class="st fill"/>';
    });

    s += '<text x="' + (cx - 124) + '" y="' + (beam - 14) + '" class="lbl sm mid">' + esc(left) + '</text>'
       + '<text x="' + (cx + 124) + '" y="' + (beam - 14) + '" class="lbl sm mid">' + esc(right) + '</text>'
       + '<text x="' + cx + '" y="' + (h - 4) + '" class="lbl sm mid">равновесие</text>';

    return svg(w, h + 10, s, 'весы в равновесии: ' + left + ' и ' + right);
  };

  /* euler:всего,A,B,оба,имяA,имяB — два круга Эйлера с числами по частям. */
  SHAPES.euler = function (a) {
    var total = num(a[0], 0), A = num(a[1], 0), B = num(a[2], 0), both = num(a[3], 0);
    var nameA = a[4] || '', nameB = a[5] || '';
    var w = 360, h = 228, r = 76, cy = 104, ax = 132, bx = 228;
    var outside = total - (A + B - both);

    var s = rect(10, 26, w - 20, 156, 'st dash')
          + '<circle cx="' + ax + '" cy="' + cy + '" r="' + r + '" class="st fill soft"/>'
          + '<circle cx="' + bx + '" cy="' + cy + '" r="' + r + '" class="st fill soft"/>'
          + '<text x="' + (ax - 36) + '" y="' + (cy + 7) + '" class="lbl big mid">' + (A - both) + '</text>'
          + '<text x="' + ((ax + bx) / 2) + '" y="' + (cy + 7) + '" class="lbl big mid">' + both + '</text>'
          + '<text x="' + (bx + 36) + '" y="' + (cy + 7) + '" class="lbl big mid">' + (B - both) + '</text>'
          + '<text x="' + (ax - r) + '" y="18" class="lbl sm">' + esc(nameA) + '</text>'
          + '<text x="' + (bx + r) + '" y="18" class="lbl sm" text-anchor="end">' + esc(nameB) + '</text>';

    if (total) {
      s += '<text x="' + (w - 32) + '" y="' + 170 + '" class="lbl big mid">'
         + (outside >= 0 ? outside : '?') + '</text>'
         + '<text x="' + (w / 2) + '" y="' + (h - 6) + '" class="lbl sm mid">'
         + 'снаружи кругов — те, кто ни там, ни там</text>';
    }

  };

  /* posts:100,10 — столбы вдоль дороги: видно, что их на один больше интервалов. */

    var len = num(a[0], 100), step = num(a[1], 10);
    var n = Math.max(1, Math.round(len / step));
    var p = 24, w = Math.min(340, n * 34), u = w / n, y = 82;
    var s = line(p, y, p + w, y, 'st thin');

    for (var i = 0; i <= n; i++) {
      var x = p + i * u;
      s += line(x, y, x, y - 22) + dot(x, y - 25, 3.5);
    }
    for (i = 0; i < n; i++) {
      s += '<text x="' + (p + (i + 0.5) * u) + '" y="' + (y + 18) + '" class="lbl sm mid">' + step + '</text>';
    }
    s += braceTop(p, p + w, y - 34, String(len));
    return svg(w + 2 * p, y + 28, s, 'столбы вдоль дороги');
  };

  /* log:5 — бревно, распиленное на N частей: распилов на один меньше. */
  SHAPES.log = function (a) {
    var n = num(a[0], 5), p = 20, u = Math.min(58, Math.round(320 / n));
    var w = n * u, top = 26, bh = 40, s = rect(p, top, w, bh, 'st fill');

    for (var i = 1; i < n; i++) s += line(p + i * u, top - 10, p + i * u, top + bh + 10, 'st cut');
    for (i = 0; i < n; i++) {
      s += '<text x="' + (p + (i + 0.5) * u) + '" y="' + (top + bh / 2 + 5) + '" class="lbl sm mid">'
         + (i + 1) + '</text>';
    }
    s += '<text x="' + (p + w / 2) + '" y="' + (top + bh + 32) + '" class="lbl sm mid">'
       + (n - 1) + ' распил' + (n - 1 === 1 ? '' : (n - 1 < 5 ? 'а' : 'ов')) + '</text>';

    return svg(w + 2 * p, top + bh + 42, s, 'бревно, распиленное на ' + n + ' частей');

  /* floors:4 — этажи и пролёты между ними. */

    var n = num(a[0], 4), p = 18, u = 44, w = 210;
    var h = (n - 1) * u + 2 * p + 12, s = '';

    for (var i = 0; i < n; i++) {
      var y = p + (n - 1 - i) * u;
      s += line(p + 38, y, p + w, y, 'st')
         + '<text x="' + p + '" y="' + (y + 5) + '" class="lbl sm">' + (i + 1) + '-й</text>';
      if (i < n - 1) {
        s += '<text x="' + (p + 120) + '" y="' + (y - u / 2 + 5) + '" class="lbl sm mid">пролёт</text>';

  /* paths:2,2 — сетка для задачи о маршрутах, отмечены старт и финиш. */
  SHAPES.paths = function (a) {
    var c = num(a[0], 2), r = num(a[1], c);
    var u = Math.min(56, Math.round(220 / Math.max(c, r)));
    var p = 30, w = c * u, h = r * u, s = '';

    for (var i = 0; i <= c; i++) s += line(p + i * u, p, p + i * u, p + h, 'st thin');
    for (var j = 0; j <= r; j++) s += line(p, p + j * u, p + w, p + j * u, 'st thin');

    s += dot(p, p, 7, 'pt accent') + dot(p + w, p + h, 7, 'pt accent')
       + '<text x="' + p + '" y="' + (p - 10) + '" class="lbl sm mid">старт</text>'
       + '<text x="' + (p + w) + '" y="' + (p + h + 20) + '" class="lbl sm mid">финиш</text>';

    return svg(w + 2 * p, h + 2 * p + 6, s, 'сетка маршрутов ' + c + ' на ' + r);
  };

  /* один кубик в изометрии: передняя грань, крышка и правый бок */
  function cubeAt(x, y, u, d) {
    return '<polygon points="' + [x + ',' + y, (x + u) + ',' + y, (x + u) + ',' + (y + u),
                                  x + ',' + (y + u)].join(' ') + '" class="st fill thin"/>'
         + '<polygon points="' + [x + ',' + y, (x + d) + ',' + (y - d), (x + u + d) + ',' + (y - d),
                                  (x + u) + ',' + y].join(' ') + '" class="st soft thin"/>'
         + '<polygon points="' + [(x + u) + ',' + y, (x + u + d) + ',' + (y - d),
                                  (x + u + d) + ',' + (y + u - d), (x + u) + ',' + (y + u)].join(' ')
         + '" class="st soft thin"/>';
  }

  /* cube — один куб. */
  SHAPES.cube = function () {
    var u = 96, d = 36, p = 16;
    return svg(u + d + 2 * p, u + d + 2 * p, cubeAt(p, p + d, u, d), 'куб');
  };

  /* cubes:3 — большой куб N на N на N, сложенный из маленьких. */
  SHAPES.cubes = function (a) {
    var n = num(a[0], 3), u = Math.min(34, Math.round(110 / n)), d = Math.round(u * 0.4), p = 16, s = '';

    /* от дальнего слоя к ближнему, иначе кубики перекроют друг друга неверно */
    for (var z = n - 1; z >= 0; z--) {
      for (var y = n - 1; y >= 0; y--) {
        for (var x = 0; x < n; x++) {
          s += cubeAt(p + x * u + z * d, p + y * u + (n - z) * d, u, d);
        }
      }
    }
    return svg(n * u + n * d + 2 * p, n * u + n * d + 2 * p,
               s, 'куб ' + n + ' на ' + n + ' на ' + n + ' из маленьких кубиков');
  };

  /* tower:4,3,2,1 — башня: числа — сторона квадратного слоя снизу вверх. */
  SHAPES.tower = function (a) {
    var layers = a.map(function (v) { return num(v, 1); });
    var base = layers.reduce(function (m, v) { return Math.max(m, v); }, 1);
    var L = layers.length, u = 24, d = 10, p = 16, s = '';

    /* укладываем от дальних кубиков к ближним и снизу вверх,
       иначе верхние слои перекрывают не то, что нужно */
    for (var k = base - 1; k >= 0; k--) {
      for (var li = 0; li < L; li++) {
        var side = layers[li], off = (base - side) / 2;
        if (k < off || k >= off + side) continue;
        for (var c = 0; c < side; c++) {
          s += cubeAt(p + (off + c) * u + k * d,
                      p + (L - 1 - li) * u + (base - k) * d, u, d);
        }
      }
    }
    return svg(base * (u + d) + 2 * p, (L - 1) * u + base * d + u + 2 * p,
               s, 'башня из кубиков слоями');
  };

  /* box:3,2,2 — коробка, плотно уложенная кубиками (длина, ширина, высота). */
  SHAPES.box = function (a) {
    var c = num(a[0], 3), r = num(a[1], 2), lay = num(a[2], 2);
    var u = 32, d = 13, p = 16, s = '';

    for (var z = r - 1; z >= 0; z--) {
      for (var y = lay - 1; y >= 0; y--) {
        for (var x = 0; x < c; x++) {
          s += cubeAt(p + x * u + z * d, p + y * u + (r - z) * d, u, d);
        }
      }
    }
    return svg(c * u + r * d + 2 * p, lay * u + r * d + 2 * p,
               s, 'кубики в коробке ' + c + ' на ' + r + ' на ' + lay);
  };

  /* sym:tri,square,penta,circle — фигуры с показанными осями симметрии. */
  SHAPES.sym = function (a) {
    var cell = 104, p = 8, y = 66, s = '', x = p + cell / 2;
    var sides = { tri: 3, square: 4, penta: 5, hexa: 6 };

    a.forEach(function (name) {
      var R = 38, k = sides[name] || 0, i, an;

      if (k) {
        var pts = [], rot = k === 4 ? -Math.PI / 4 : -Math.PI / 2;
        for (i = 0; i < k; i++) {
          an = rot + i * 2 * Math.PI / k;
          pts.push((x + R * Math.cos(an)).toFixed(1) + ',' + (y + R * Math.sin(an)).toFixed(1));
        }
        s += '<polygon points="' + pts.join(' ') + '" class="st fill"/>';
        for (i = 0; i < k; i++) {
          an = rot + i * Math.PI / k;
          s += line((x - (R + 7) * Math.cos(an)).toFixed(1), (y - (R + 7) * Math.sin(an)).toFixed(1),
                    (x + (R + 7) * Math.cos(an)).toFixed(1), (y + (R + 7) * Math.sin(an)).toFixed(1),
                    'st axis');

        s += '<text x="' + x + '" y="' + (y + R + 34) + '" class="lbl sm mid">'
           + k + ' ' + (k < 5 ? 'оси' : 'осей') + '</text>';
      } else {
        s += '<circle cx="' + x + '" cy="' + y + '" r="' + R + '" class="st fill"/>';
        for (i = 0; i < 6; i++) {
          an = i * Math.PI / 6;
          s += line((x - (R + 7) * Math.cos(an)).toFixed(1), (y - (R + 7) * Math.sin(an)).toFixed(1),
                    (x + (R + 7) * Math.cos(an)).toFixed(1), (y + (R + 7) * Math.sin(an)).toFixed(1),
                    'st axis');

  };

  /* clockstrike:6 — удары часов: промежутков на один меньше, чем ударов. */
  SHAPES.clockstrike = function (a) {
    var n = num(a[0], 6), p = 26, w = Math.min(320, (n - 1) * 52), u = w / (n - 1), y = 66;
    var s = line(p, y, p + w, y, 'st thin');

    for (var i = 0; i < n; i++) {
      var x = p + i * u;
      s += line(x, y - 20, x, y + 10, 'st') + dot(x, y - 24, 4);
    }
    for (i = 0; i < n - 1; i++) {
      s += '<text x="' + (p + (i + 0.5) * u) + '" y="' + (y + 26) + '" class="lbl sm mid">' + (i + 1) + '</text>';
    }
    s += '<text x="' + (p + w / 2) + '" y="' + (y + 46) + '" class="lbl sm mid">'
       + n + ' ударов — ' + (n - 1) + ' промежутк' + (n - 1 === 1 ? '' : (n - 1 < 5 ? 'а' : 'ов')) + '</text>';

    return svg(w + 2 * p, y + 58, s, 'удары часов и промежутки между ними');
  };

  /* clock:9,10 — циферблат со стрелками на указанном времени.
     Ребёнок должен читать часы по картинке, а не по подписи «9:10». */
  SHAPES.clock = function (a) {
    var hh = num(a[0], 12) % 12, mm = num(a[1], 0);
    var R = 92, c = R + 16, s = '';

    s += '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" class="st"/>';

    for (var i = 0; i < 60; i++) {
      var ang = i * 6 * Math.PI / 180;          // 0 — вверх, дальше по часовой
      var big = i % 5 === 0;
      var r1 = R - (big ? 11 : 5);
      s += line(c + r1 * Math.sin(ang), c - r1 * Math.cos(ang),
                c + (R - 2) * Math.sin(ang), c - (R - 2) * Math.cos(ang),
                big ? 'st thin' : 'st thin hair');
    }

    for (i = 1; i <= 12; i++) {
      var na = i * 30 * Math.PI / 180, nr = R - 26;
      s += '<text x="' + (c + nr * Math.sin(na)) + '" y="' + (c - nr * Math.cos(na) + 5) +
           '" class="lbl mid">' + i + '</text>';
    }

    /* Часовая стрелка сдвинута на прошедшие минуты: в 9:10 она уже за девяткой. */
    function hand(deg, len, cls) {
      var r = deg * Math.PI / 180;
      return line(c - 12 * Math.sin(r), c + 12 * Math.cos(r),
                  c + len * Math.sin(r), c - len * Math.cos(r), cls);
    }
    s += hand((hh + mm / 60) * 30, R - 40, 'st hour')
       + hand(mm * 6, R - 18, 'st minute')
       + dot(c, c, 6);

    var hlbl = (hh === 0 ? 12 : hh) + ':' + String(mm).padStart(2, '0');
    return svg(2 * c, 2 * c, s, 'циферблат: ' + hlbl);
  };

  /* gridfill:C,R,X,Y,W,H — сетка C на R с закрашенным прямоугольником
     W на H, левый верхний угол которого стоит в клетке (X, Y), счёт с нуля.
     Задачи «площадь фигуры на клетчатой бумаге». */
  SHAPES.gridfill = function (a) {
    var c = num(a[0], 6), r = num(a[1], 4);
    var x = num(a[2], 1), y = num(a[3], 1), fw = num(a[4], 2), fh = num(a[5], 2);
    var u = Math.min(26, Math.round(320 / Math.max(c, r)));
    var w = c * u, h = r * u, p = 14;

    var s = rect(p + x * u, p + y * u, fw * u, fh * u, 'soft');
    for (var i = 1; i < c; i++) s += line(p + i * u, p, p + i * u, p + h, 'st thin hair');
    for (var j = 1; j < r; j++) s += line(p, p + j * u, p + w, p + j * u, 'st thin hair');
    s += rect(p, p, w, h, 'st') + rect(p + x * u, p + y * u, fw * u, fh * u, 'st');

    return svg(w + 2 * p, h + 2 * p + 20,
               s + '<text x="' + (p + w / 2) + '" y="' + (h + 2 * p + 12) +
                   '" class="lbl sm mid">клетка — 1 см&#178;</text>',
               'фигура на сетке ' + c + ' на ' + r);
  };

  /* regpoly:3,6 см — правильный многоугольник с подписью стороны.
     Для периметра: ребёнок должен увидеть, что все стороны равны. */
  SHAPES.regpoly = function (a) {
    var n = Math.max(3, num(a[0], 3)), label = a[1] || '';
    var R = 74, c = R + 10 + label.length * 5, pts = [];

    for (var i = 0; i < n; i++) {
      var ang = (i * 360 / n - 90) * Math.PI / 180;
      pts.push((c + R * Math.cos(ang)).toFixed(1) + ',' + (c + R * Math.sin(ang)).toFixed(1));
    }
    var s = '<polygon points="' + pts.join(' ') + '" class="st soft"/>';

    /* Подпись у каждой стороны — иначе «все стороны по 6» приходится брать на веру. */
    if (label) {
      for (i = 0; i < n; i++) {
        var p1 = pts[i].split(','), p2 = pts[(i + 1) % n].split(',');
        var mx = (+p1[0] + +p2[0]) / 2, my = (+p1[1] + +p2[1]) / 2;
        /* Отодвигаем подпись от стороны наружу, иначе у треугольника
           боковые подписи ложатся прямо на линию и читаются как внутренние. */
        var k = 1 + 26 / Math.sqrt((mx - c) * (mx - c) + (my - c) * (my - c) || 1);
        s += '<text x="' + (c + (mx - c) * k) + '" y="' + (c + (my - c) * k + 4) +
             '" class="lbl sm mid">' + esc(label) + '</text>';
      }
    }
    return svg(2 * c, 2 * c, s, 'правильный ' + n + '-угольник');
  };

  /* =========================================================== точка входа === */

  function build(spec) {
    if (!spec) return '';
    var i = String(spec).indexOf(':');
    var name = (i < 0 ? String(spec) : spec.slice(0, i)).trim();
    var raw = i < 0 ? '' : String(spec).slice(i + 1);
    var fn = SHAPES[name];
    if (!fn) return '';
    var args = raw === '' ? [] : raw.split(',').map(function (v) { return v.trim(); });
    try { return fn(args, raw); } catch (e) { return ''; }
  }

  /* Картинка файлом — запасной путь, если понадобится растр. */
  function image(src, alt) {
    if (!src) return '';
    return '<figure class="fig"><img src="' + esc(src) + '" alt="'
         + esc(alt || 'рисунок к задаче') + '" loading="lazy"></figure>';
  }

  function forQuestion(q) { return build(q.fig) + image(q.img, q.imgAlt); }
  function forExplain(q) { return build(q.exfig); }

  var CSS =
    '.fig{margin:.8rem 0;text-align:center;color:var(--ink-soft,#4d5d78)}' +
    '.fig svg,.fig img{max-width:100%;height:auto;display:inline-block}' +
    '.fig img{border-radius:10px}' +
    '.fig .st{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}' +
    '.fig .thin{stroke-width:1.4}' +
    '.fig .hair{stroke-width:.9;opacity:.45}' +
    '.fig .hour{stroke-width:5;stroke-linecap:round}' +
    '.fig .minute{stroke-width:3.4;stroke-linecap:round}' +
    '.fig .fill{fill:var(--card-sunk,rgba(127,127,127,.10))}' +
    '.fig .soft{fill:var(--accent-bg,rgba(127,127,127,.20))}' +
    '.fig .dash{stroke-dasharray:6 5;opacity:.5;fill:none}' +
    '.fig .cut{stroke-dasharray:5 4;stroke:var(--no,#c33f2d);stroke-width:2}' +
    '.fig .axis{stroke-dasharray:5 4;stroke:var(--accent,#2f5fa8);stroke-width:1.4}' +
    '.fig .pt{fill:currentColor;stroke:none}' +
    '.fig .pt.accent{fill:var(--accent,#2f5fa8)}' +
    '.fig text{fill:currentColor;stroke:none;font:600 14px var(--ui,inherit)}' +
    '.fig .sm{font-size:12px;opacity:.85}' +
    '.fig .big{font-size:19px}' +
    '.fig .mid{text-anchor:middle}';

  if (typeof document !== 'undefined' && !document.getElementById('fig-css')) {
    var st = document.createElement('style');
    st.id = 'fig-css';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  window.SASMO_FIG = {
    build: build, image: image, forQuestion: forQuestion, forExplain: forExplain,
    css: CSS, shapes: SHAPES
  };
})();
</script>

<script>
/* eslint-disable */
/* ==========================================================================
   Теория к задачам — кнопка «🤔 Мне непонятно — объясни».

   Подсказка говорит, с чего начать именно эту задачу. Теория объясняет
   сам приём: главная идея, шаги, разобранный пример на других числах
   (ответ текущей задачи не выдаётся) и частая ошибка.

   Задача находит свою теорию по полю `topic`. Если тема задачи шире приёма
   (например, в «Уравнивании» есть задачи на суммы пар), в задаче можно
   указать приём явно: `theory: 'pairsums'`.

   build/check.js проверяет, что у каждой задачи теория находится.

   API:
     SASMO_THEORY.keyFor(q)        — ключ приёма или null
     SASMO_THEORY.html(key, lang)  — готовая разметка блока
     SASMO_THEORY.forQuestion(q, lang)
     SASMO_THEORY.label(lang)      — надпись на кнопке
   ========================================================================== */

(function () {
  'use strict';

  var LIB = {};
  var TOPIC = {};

  /* Приём: ключ, темы задач, которые он объясняет, и текст на двух языках.
     Поля текста: t — название, idea — главная идея, steps — как действовать,
     ex — пример { q — условие, s — шаги решения, a — ответ }, trap — частая ошибка. */
  function T(key, topics, ru, en) {
    LIB[key] = { ru: ru, en: en };
    topics.forEach(function (tp) { TOPIC[tp] = key; });
  }

  /* ---------------- числа и действия ---------------- */

  T('place', ['Разряды', 'Сравнение чисел', 'Соседние числа'], {
    t: 'Разряды: что значит место цифры',
    idea: 'Одна и та же цифра значит разное — смотря где стоит. В числе 4 728 семёрка — это не 7, а 7 сотен, то есть 700. Разряды считают справа налево: единицы, десятки, сотни, тысячи.',
    steps: [
      'Подпиши над цифрами буквы разрядов справа налево: Е, Д, С, Т.',
      '«Сколько всего десятков в числе» — закрой пальцем последнюю цифру: в 480 всего 48 десятков.',
      'Сравнивая числа, сначала посмотри, у кого больше цифр. Если поровну — сравнивай слева направо, пока не найдёшь разные цифры.',
      'Самое большое число из данных цифр — цифры по убыванию, самое маленькое — по возрастанию. Но ноль первым стоять не может.'
    ],
    ex: { q: 'Какое число больше: 5 381 или 5 318?',
          s: ['Тысячи: 5 и 5 — поровну.', 'Сотни: 3 и 3 — поровну.', 'Десятки: 8 и 1 — у первого больше. Дальше можно не смотреть.'],
          a: '5 381' },
    trap: 'Путать «цифру десятков» и «сколько всего десятков». В числе 250 цифра десятков — 5, а всего десятков — 25.'
  }, {
    t: 'Place value: what a digit’s position means',
    idea: 'The same digit means different things depending on where it stands. In 4,728 the 7 is not seven — it is 7 hundreds, that is 700. Places are counted from the right: ones, tens, hundreds, thousands.',
    steps: [
      'Write the place letters above the digits from the right: O, T, H, Th.',
      '“How many tens are in the number” — cover the last digit with a finger: 480 has 48 tens in total.',
      'To compare numbers, first see which has more digits. If the same — compare from the left until the digits differ.',
      'Biggest number from given digits — digits in decreasing order; smallest — increasing order. But 0 can’t go first.'
    ],
    ex: { q: 'Which is bigger: 5,381 or 5,318?',
          s: ['Thousands: 5 and 5 — equal.', 'Hundreds: 3 and 3 — equal.', 'Tens: 8 and 1 — the first is bigger. No need to look further.'],
          a: '5,381' },
    trap: 'Mixing up “the tens digit” and “how many tens in all”. In 250 the tens digit is 5, but there are 25 tens in all.'
  });

  T('add', ['Сложение', 'Вычитание'], {
    t: 'Сложение и вычитание по частям',
    idea: 'Большие числа удобно складывать по частям: десятки с десятками, единицы с единицами. Вычитать тоже можно по частям.',
    steps: [
      'Разбей числа на десятки и единицы: 57 = 50 + 7.',
      'Сложи десятки, потом единицы, потом сложи результаты.',
      'Если единицы дали больше 9 — появился лишний десяток, не потеряй его.',
      'Вычитай по частям: 70 − 34 = 70 − 30 − 4.',
      'Проверь вычитание сложением: 36 + 34 = 70.'
    ],
    ex: { q: '57 + 36 = ?',
          s: ['Десятки: 50 + 30 = 80.', 'Единицы: 7 + 6 = 13.', 'Вместе: 80 + 13 = 93.'],
          a: '93' },
    trap: 'Потерять десяток при переходе: 7 + 6 — это 13, а не 3.'
  }, {
    t: 'Adding and subtracting in parts',
    idea: 'Big numbers are easy to add in parts: tens with tens, ones with ones. Subtracting works in parts too.',
    steps: [
      'Split the numbers into tens and ones: 57 = 50 + 7.',
      'Add the tens, then the ones, then add the results.',
      'If the ones make more than 9, you get an extra ten — don’t lose it.',
      'Subtract in parts: 70 − 34 = 70 − 30 − 4.',
      'Check a subtraction by adding: 36 + 34 = 70.'
    ],
    ex: { q: '57 + 36 = ?',
          s: ['Tens: 50 + 30 = 80.', 'Ones: 7 + 6 = 13.', 'Together: 80 + 13 = 93.'],
          a: '93' },
    trap: 'Losing the ten when you carry: 7 + 6 is 13, not 3.'
  });

  T('mul', ['Умножение', 'Таблица умножения', 'Умножение на 2', 'Умножение на 3', 'Умножение на 4',
            'Умножение на 5', 'Умножение на 10', 'Степени', 'Сравнение'], {
    t: 'Умножение',
    idea: 'Умножение — это сложение одинаковых чисел: 4 × 3 = 4 + 4 + 4. Множители можно менять местами: 3 × 7 = 7 × 3.',
    steps: [
      '«По 5 взяли 7 раз» — это 5 × 7.',
      'Не помнишь ответ — считай шагами: 7, 14, 21, …',
      'Помогают соседние примеры: 7 × 9 = 7 × 10 − 7.',
      '× 2 — удвой; × 4 — удвой два раза; × 10 — припиши ноль; × 5 — половина от × 10.',
      'Степень 3⁴ — это 3 × 3 × 3 × 3. Умножай по одному множителю.'
    ],
    ex: { q: '6 × 8 = ?',
          s: ['6 × 4 = 24.', '× 8 — это × 4 и ещё раз × 2: 24 × 2 = 48.'],
          a: '48' },
    trap: 'Путать степень с умножением: 3⁴ = 81, а 3 × 4 = 12.'
  }, {
    t: 'Multiplication',
    idea: 'Multiplication is adding equal numbers: 4 × 3 = 4 + 4 + 4. You can swap the factors: 3 × 7 = 7 × 3.',
    steps: [
      '“5 taken 7 times” is 5 × 7.',
      'Don’t remember the answer — count in steps: 7, 14, 21, …',
      'Use a neighbour fact: 7 × 9 = 7 × 10 − 7.',
      '× 2 — double; × 4 — double twice; × 10 — add a zero; × 5 — half of × 10.',
      'The power 3⁴ means 3 × 3 × 3 × 3. Multiply one factor at a time.'
    ],
    ex: { q: '6 × 8 = ?',
          s: ['6 × 4 = 24.', '× 8 is × 4 and then × 2 again: 24 × 2 = 48.'],
          a: '48' },
    trap: 'Mixing up a power and a product: 3⁴ = 81, but 3 × 4 = 12.'
  });

  T('div', ['Деление', 'Поровну', 'Сколько монет', 'Сколько штук'], {
    t: 'Деление',
    idea: 'Деление отвечает на два вопроса: «разделили поровну — сколько в каждой части?» и «сколько раз одно число помещается в другом?». Деление — обратное умножению.',
    steps: [
      'Ищи ответ в таблице умножения: 36 ÷ 4 — какое число, умноженное на 4, даёт 36?',
      '«Сколько карандашей по 9 рублей купишь на 45 рублей» — сколько раз 9 помещается в 45.',
      'Сначала учти всё, что меняет количество (потеряли, добавили), и только потом дели.',
      '«Поровну на двоих» — пополам, то есть деление на 2.'
    ],
    ex: { q: 'Было 72 шарика, 12 потерялись, остальные разложили поровну в 12 коробок. Сколько в каждой?',
          s: ['Осталось: 72 − 12 = 60.', 'Делим: 60 ÷ 12 = 5.'],
          a: 'по 5 шариков' },
    trap: 'Делить сразу, пока не учтены все изменения.'
  }, {
    t: 'Division',
    idea: 'Division answers two questions: “shared equally — how many in each part?” and “how many times does one number fit into another?”. Division undoes multiplication.',
    steps: [
      'Look for the answer in the times table: 36 ÷ 4 — which number times 4 makes 36?',
      '“How many $9 pencils can you buy with $45” — how many times 9 fits into 45.',
      'First take every change into account (lost, added), only then divide.',
      '“Shared equally by two” — halve it, that is divide by 2.'
    ],
    ex: { q: 'There were 72 marbles, 12 got lost, the rest were shared equally among 12 boxes. How many in each?',
          s: ['Left: 72 − 12 = 60.', 'Divide: 60 ÷ 12 = 5.'],
          a: '5 marbles each' },
    trap: 'Dividing straight away, before all the changes are counted.'
  });

  T('order', ['Порядок действий', 'Пропущенный знак'], {
    t: 'Порядок действий',
    idea: 'Сначала — скобки. Потом умножение и деление. В самом конце — сложение и вычитание, слева направо.',
    steps: [
      'Есть скобки — посчитай их первыми.',
      'Подчеркни все × и ÷ и выполни их.',
      'Остались только + и − — считай слева направо.',
      'Если пропущен знак — попробуй по очереди +, −, ×, ÷ и проверь, какой подходит.'
    ],
    ex: { q: '20 − 3 × 4 + 6 = ?',
          s: ['Сначала умножение: 3 × 4 = 12.', '20 − 12 = 8.', '8 + 6 = 14.'],
          a: '14' },
    trap: 'Считать просто слева направо: (20 − 3) × 4 — это другой пример.'
  }, {
    t: 'Order of operations',
    idea: 'Brackets first. Then multiplication and division. Last of all — addition and subtraction, from left to right.',
    steps: [
      'If there are brackets, work them out first.',
      'Underline every × and ÷ and do them.',
      'Only + and − are left — go from left to right.',
      'If a sign is missing, try +, −, ×, ÷ one by one and check which fits.'
    ],
    ex: { q: '20 − 3 × 4 + 6 = ?',
          s: ['Multiplication first: 3 × 4 = 12.', '20 − 12 = 8.', '8 + 6 = 14.'],
          a: '14' },
    trap: 'Simply going left to right: (20 − 3) × 4 is a different problem.'
  });

  T('steps', ['Два действия', 'Текстовые задачи', 'Деньги', 'Сколько денег', 'Сдача', 'Покупка',
              'Покупка нескольких', 'Сравнение покупок', 'Обмен', 'Уроки и перемены'], {
    t: 'Задачи в несколько действий',
    idea: 'Сложная задача — это цепочка простых. Найди, что можно узнать прямо сейчас, и иди шаг за шагом к вопросу.',
    steps: [
      'Прочитай вопрос: что именно нужно найти?',
      'Выпиши, что известно.',
      'Спроси себя: что можно узнать сразу из двух известных чисел?',
      'Записывай каждый шаг с пояснением: «тетради стоят…», «всего потратила…».',
      'В конце проверь: последнее число отвечает на вопрос задачи?'
    ],
    ex: { q: 'У Тани 100 рублей. Она купила 3 тетради по 18 рублей и ручку за 25. Сколько осталось?',
          s: ['Тетради: 3 × 18 = 54.', 'Вся покупка: 54 + 25 = 79.', 'Осталось: 100 − 79 = 21.'],
          a: '21 рубль' },
    trap: 'Ответить промежуточным числом: 79 — это стоимость покупки, а спрашивали, сколько осталось.'
  }, {
    t: 'Problems with several steps',
    idea: 'A hard problem is a chain of easy ones. Find what you can work out right now, and walk step by step towards the question.',
    steps: [
      'Read the question: what exactly do we need to find?',
      'Write down what is known.',
      'Ask yourself: what can I find straight away from two known numbers?',
      'Write each step with a label: “the notebooks cost…”, “she spent in all…”.',
      'At the end check: does the last number answer the question?'
    ],
    ex: { q: 'Tanya has $100. She buys 3 notebooks at $18 each and a pen for $25. How much is left?',
          s: ['Notebooks: 3 × 18 = 54.', 'Whole purchase: 54 + 25 = 79.', 'Left: 100 − 79 = 21.'],
          a: '$21' },
    trap: 'Answering with an in-between number: 79 is the cost, but the question asks what is left.'
  });

  T('missing', ['Пропущенное число', 'Пропущенная цифра', 'Числовые ребусы', 'Буквы вместо цифр', 'Обратная задача'], {
    t: 'Неизвестное число: отменяем действия',
    idea: 'Каждое действие можно отменить обратным: сложение — вычитанием, умножение — делением. Так и находят неизвестное.',
    steps: [
      'Замени квадратик или букву словами «какое-то число».',
      'Посмотри, что с этим числом сделали.',
      'Отменяй действия с конца: сначала последнее, потом предыдущее.',
      'Если пропущена цифра — сначала найди всё число, потом посмотри на нужную цифру.',
      'Подставь ответ и проверь.'
    ],
    ex: { q: '7 × □ − 14 = 35. Какое число в квадратике?',
          s: ['Последним вычли 14 — вернём их: 35 + 14 = 49.', 'Значит 7 × □ = 49.', 'Отменяем умножение: 49 ÷ 7 = 7.', 'Проверка: 7 × 7 − 14 = 35 ✓'],
          a: '7' },
    trap: 'Отменять действия с начала, а не с конца.'

  var PIC = {};

  function C(x, y, r, c) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" class="' + (c || 'ln') + '"/>'; }
  function X(x, y, s, c) { return '<text x="' + x + '" y="' + y + '" class="' + (c || '') + '">' + s + '</text>'; }
  function P(pts, c) { return '<polygon points="' + pts + '" class="' + (c || 'ln') + '"/>'; }
  function arrow(x1, y, x2, c) {
    var d = x2 > x1 ? -7 : 7;

  }
  function grid(x, y, cols, rows, s, c) {
    var h = '';

    return h;
