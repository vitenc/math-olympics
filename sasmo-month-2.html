<title>Olympiad Sprint — месяц до олимпиады</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Unbounded:wght@700;800&display=swap">

<style>
/* ==========================================================================
   Месяц до SASMO — тренажёр подготовки к олимпиаде, Grade 3
   Материал страницы — клетчатый тетрадный лист.
   ========================================================================== */

:root {
  /* бумага и сетка */
  --paper:      #f5f7fa;
  --grid:       #dfe6f0;
  --card:       #ffffff;
  --card-sunk:  #f2f5f9;
  --line:       #dce4ef;

  /* чернила */
  --ink:        #14243f;
  --ink-soft:   #4d5d78;
  --muted:      #7a889d;

  /* акцент — синие чернила школьной ручки */
  --accent:     #2f5fa8;
  --accent-ink: #24497f;
  --accent-bg:  #e9eff9;

  /* семантика: отдельно от акцента */
  --ok:         #1c8552;
  --ok-bg:      #e7f4ed;
  --ok-line:    #a9dcc1;
  --no:         #c33f2d;
  --no-bg:      #fbeae7;
  --no-line:    #f0bdb3;
  --hint:       #a06a12;
  --hint-bg:    #fbf2df;
  --hint-line:  #ecd5a3;
  --exam:       #6b4ea8;
  --exam-bg:    #f0ecf9;

  --shadow-sm:  0 1px 2px rgba(20,36,63,.05);
  --shadow-md:  0 1px 2px rgba(20,36,63,.05), 0 6px 18px rgba(20,36,63,.06);
  --radius:     14px;

  --step--1: .82rem;
  --step-0:  .95rem;
  --step-1:  1.06rem;
  --step-2:  1.3rem;
  --step-3:  1.7rem;
  --step-4:  2.4rem;

  --ui:   'Golos Text', 'Segoe UI', system-ui, sans-serif;
  --read: 'Literata', Georgia, 'Times New Roman', serif;
  --disp: 'Unbounded', 'Golos Text', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0f151e;
    --grid:       #1a2331;
    --card:       #18202c;
    --card-sunk:  #141b25;
    --line:       #2a3441;

    --ink:        #e7edf6;
    --ink-soft:   #b0bccd;
    --muted:      #8494a9;

    --accent:     #7ba6e8;
    --accent-ink: #a3c2f2;
    --accent-bg:  #1a2637;

    --ok:         #56c78c;
    --ok-bg:      #14291f;
    --ok-line:    #2c5a41;
    --no:         #f0715c;
    --no-bg:      #2b1714;
    --no-line:    #63332b;
    --hint:       #e0ad5a;
    --hint-bg:    #2a2114;
    --hint-line:  #5a4626;
    --exam:       #a98fdf;
    --exam-bg:    #221c33;

    --shadow-sm:  0 1px 2px rgba(0,0,0,.3);
    --shadow-md:  0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
  }
}

:root[data-theme="dark"] {
  --paper:      #0f151e;
  --grid:       #1a2331;
  --card:       #18202c;
  --card-sunk:  #141b25;
  --line:       #2a3441;

  --ink:        #e7edf6;
  --ink-soft:   #b0bccd;
  --muted:      #8494a9;

  --accent:     #7ba6e8;
  --accent-ink: #a3c2f2;
  --accent-bg:  #1a2637;

  --ok:         #56c78c;
  --ok-bg:      #14291f;
  --ok-line:    #2c5a41;
  --no:         #f0715c;
  --no-bg:      #2b1714;
  --no-line:    #63332b;
  --hint:       #e0ad5a;
  --hint-bg:    #2a2114;
  --hint-line:  #5a4626;
  --exam:       #a98fdf;
  --exam-bg:    #221c33;

  --shadow-sm:  0 1px 2px rgba(0,0,0,.3);
  --shadow-md:  0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--ui);
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-text-size-adjust: 100%;
}

/* экзамен — бланк, а не тетрадь: сетка уходит */
body.plain { background-image: none; }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0 0 .6em; }
ul, ol { margin: .4em 0 .6em; padding-left: 1.15em; }
li { margin-bottom: .2em; }
a { color: var(--accent); }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ===== ШАПКА ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1040px; margin: 0 auto;
  padding: .7rem 1.1rem;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mark {
  font-family: var(--disp); font-weight: 800; font-size: 1.15rem;
  letter-spacing: -.02em; color: var(--ink);
  text-decoration: none; display: flex; align-items: baseline; gap: .5rem;
}
.mark .lvl {
  font-family: var(--ui); font-weight: 600; font-size: .68rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.topbar .spacer { flex: 1; }

.crumb {
  font-size: var(--step--1); font-weight: 600;
  color: var(--accent); text-decoration: none;
  display: inline-flex; align-items: center; gap: .35rem;
}
.crumb:hover { text-decoration: underline; }

.railbar {
  height: 4px; background: var(--line);
  position: relative; overflow: hidden;
}
.railbar i {
  display: block; height: 100%; width: 0;
  background: var(--accent); transition: width .45s ease;
}

/* ===== ОБОЛОЧКА ===== */
.wrap { max-width: 1040px; margin: 0 auto; padding: 1.4rem 1.1rem 4rem; }
.reading { max-width: 720px; }

.eyebrow {
  font-size: .68rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.h-page {
  font-family: var(--ui); font-size: var(--step-3);
  letter-spacing: -.02em; margin: .1rem 0 .25rem;
}
.lede { color: var(--ink-soft); font-size: var(--step-0); margin-bottom: 1.4rem; }

/* ===== СВОДКА ===== */
.summary {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 1.5rem;
}
.summary div { background: var(--card); padding: .85rem 1rem; }
.summary .n {
  font-family: var(--disp); font-weight: 700; font-size: var(--step-2);
  font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1.15;
}
.summary .k { font-size: .7rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin-top: .1rem; }
@media (max-width: 560px) { .summary { grid-template-columns: 1fr; } }

/* ===== ПРАВИЛА СЧЁТА ===== */
.rules {
  border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); background: var(--card);
  padding: 1.1rem 1.2rem; margin-bottom: 1.6rem; box-shadow: var(--shadow-sm);
}
.rules h2 { font-size: var(--step-1); margin-bottom: .5rem; }
.rules p { color: var(--ink-soft); font-size: var(--step--1); }

.scoretable { width: 100%; border-collapse: collapse; margin: .7rem 0 .9rem; font-size: var(--step--1); }
.scoretable th, .scoretable td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); }
.scoretable th { font-weight: 600; color: var(--muted); font-size: .7rem;
  letter-spacing: .08em; text-transform: uppercase; }
.scoretable td.num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.scoretable tr:last-child td { border-bottom: 0; }
.pos { color: var(--ok); }
.neg { color: var(--no); }

.tactic { display: flex; gap: .6rem; align-items: flex-start; margin-top: .55rem; }
.tactic b { display: block; font-size: var(--step--1); }
.tactic span { font-size: var(--step--1); color: var(--ink-soft); }
.tag {
  flex: none; font-size: .64rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; padding: .18rem .45rem; border-radius: 5px;
  background: var(--accent-bg); color: var(--accent-ink); margin-top: .15rem;
}

/* ===== НЕДЕЛИ И ДНИ ===== */
.week { margin-bottom: 1.7rem; }
.week-head {
  display: flex; align-items: baseline; gap: .6rem;
  padding-bottom: .5rem; margin-bottom: .8rem;
  border-bottom: 2px solid var(--line);
}
.week-head .wn {
  font-family: var(--disp); font-weight: 700; font-size: var(--step--1);
  color: var(--accent); letter-spacing: -.01em;
}
.week-head h2 { font-size: var(--step-1); }
.week-head .ws { font-size: var(--step--1); color: var(--muted); margin-left: auto; text-align: right; }
@media (max-width: 640px) { .week-head { flex-wrap: wrap; } .week-head .ws { margin-left: 0; width: 100%; text-align: left; } }

.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: .7rem; }

.day {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: .8rem .9rem .85rem;
  box-shadow: var(--shadow-sm);
  transition: border-color .18s, transform .18s, box-shadow .18s;
  position: relative;
}
.day:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.day .num {
  font-size: .68rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.day h3 { font-size: var(--step-0); margin: .15rem 0 .15rem; letter-spacing: -.01em; }
.day .skill { font-size: var(--step--1); color: var(--muted); }
.day .score {
  margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--line);
  font-size: var(--step--1); font-weight: 600; color: var(--ok);
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: .35rem;
}
.day .score .when { color: var(--muted); font-weight: 500; margin-left: auto; }

/* экзаменационные дни выделены заливкой, а не ещё одной рамкой */
.day.is-exam { background: var(--exam-bg); border-color: color-mix(in srgb, var(--exam) 35%, var(--line)); }
.day.is-exam .num { color: var(--exam); }
.day.is-exam:hover { border-color: var(--exam); }
.day.is-done { border-color: var(--ok-line); }
.day.is-done .num { color: var(--ok); }

/* начатый, но не доведённый до конца день — своим цветом, не зелёным */
.day.is-part { border-color: var(--hint-line); }
.day.is-part .num { color: var(--hint); }
.day .score.part { color: var(--hint); }

/* сброс одного дня: кружок в углу карточки, заметный только при наведении */
.day-reset {
  position: absolute; top: .45rem; right: .45rem; z-index: 1;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  border-radius: 999px; min-width: 1.7rem; height: 1.7rem; padding: 0 .45rem;
  font: 600 .78rem/1 var(--ui); cursor: pointer; opacity: .45;
  transition: opacity .15s, color .15s, border-color .15s;
}
.day:hover .day-reset, .day-reset:focus-visible { opacity: 1; }
.day-reset:hover { color: var(--no); border-color: var(--no-line); background: var(--no-bg); }
.day-reset.armed { opacity: 1; color: var(--no); border-color: var(--no); background: var(--no-bg); }

/* полоска «продолжаем с того места» над задачами дня */
.resume {
  display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
  background: var(--hint-bg); border: 1px solid var(--hint-line);
  border-radius: var(--radius); padding: .7rem .9rem;
  font-size: var(--step--1); color: var(--ink-soft); margin: 1rem 0 0;
}
.resume > div { flex: 1 1 16rem; }
.resume .btn { flex: 0 0 auto; }
.btn.armed { border-color: var(--no); color: var(--no); background: var(--no-bg); }

/* ===== РАСПОРЯДОК ЗАНЯТИЯ ===== */
.routine { margin-top: 2.2rem; border-top: 2px solid var(--line); padding-top: 1.1rem; }
.routine h2 { font-size: var(--step-1); margin-bottom: .1rem; }
.routine > p { color: var(--muted); font-size: var(--step--1); margin-bottom: .9rem; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.steps div { background: var(--card); padding: .8rem .9rem; }
.steps .t { font-family: var(--disp); font-weight: 700; font-size: var(--step-1);
  color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.steps .s { font-weight: 600; font-size: var(--step-0); margin: .1rem 0 .1rem; }
.steps .d { font-size: var(--step--1); color: var(--ink-soft); }

/* ===== ПАНЕЛИ ===== */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.1rem 1.2rem;
  margin-bottom: 1.4rem; box-shadow: var(--shadow-sm);
}
.panel h2 { font-size: var(--step-1); margin-bottom: .45rem; }
.panel.technique { border-left: 4px solid var(--hint); }
.panel.technique h2 { color: var(--hint); }
.panel.brief { border-left: 4px solid var(--exam); }
.panel.brief h2 { color: var(--exam); }
.panel .body { font-size: var(--step-0); color: var(--ink-soft); }
.panel .body b, .panel .body strong { color: var(--ink); }

/* моноширинные схемы внутри объяснений */
.mono {
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: .88rem; font-weight: 600; line-height: 1.45;
  background: var(--card-sunk); border: 1px solid var(--line);
  border-radius: 8px; padding: .6rem .8rem; margin: .6rem 0;
  white-space: pre; overflow-x: auto; color: var(--ink);
}

/* дроби из старого набора задач */
.fr, .fo { display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; line-height: 1.1; font-size: .85em; margin: 0 2px; }
.fr .n, .fo .n { border-bottom: 1.5px solid currentColor; padding: 0 4px 1px; }
.fr .d, .fo .d { padding: 1px 4px 0; }

/* ===== СЕКЦИИ ЭКЗАМЕНА ===== */
.section-rule {
  display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
  margin: 2rem 0 .9rem; padding-bottom: .45rem;
  border-bottom: 2px solid var(--exam);
}
.section-rule .letter {
  font-family: var(--disp); font-weight: 800; font-size: var(--step-2);
  color: var(--exam); line-height: 1; letter-spacing: -.03em;
}
.section-rule .what { font-weight: 700; font-size: var(--step-0); }
.section-rule .how { font-size: var(--step--1); color: var(--muted); margin-left: auto; }
@media (max-width: 640px) { .section-rule .how { margin-left: 0; width: 100%; } }

/* ===== ЗАДАЧА ===== */
.q {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.05rem 1.15rem;
  margin-bottom: .8rem; box-shadow: var(--shadow-sm);
  transition: border-color .25s, background .25s;
}
.q.ok { border-color: var(--ok-line); background: var(--ok-bg); }
.q.no { border-color: var(--no-line); background: var(--no-bg); }

.q-head { display: flex; gap: .7rem; align-items: baseline; margin-bottom: .7rem; }
.q-num {
  font-family: var(--disp); font-weight: 700; font-size: var(--step-0);
  color: var(--muted); font-variant-numeric: tabular-nums; flex: none;
  min-width: 1.5rem;
}
.q.ok .q-num { color: var(--ok); }
.q.no .q-num { color: var(--no); }
.q-text { font-family: var(--read); font-size: var(--step-1); line-height: 1.5; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
@media (max-width: 620px) { .opts { grid-template-columns: 1fr; } }

.opt {
  display: flex; align-items: center; gap: .6rem;
  padding: .6rem .8rem; border: 1.5px solid var(--line);
  border-radius: 10px; background: var(--card); cursor: pointer;
  font-family: var(--read); font-size: var(--step-0);
  color: var(--ink); text-align: left; width: 100%;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent); }
.opt .letter {
  font-family: var(--ui); font-weight: 700; font-size: var(--step--1);
  color: var(--muted); flex: none; min-width: 1.1rem;
}
.opt.chosen { border-color: var(--accent); background: var(--accent-bg); }
.opt.chosen .letter { color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .letter { color: var(--ok); }
.opt.wrong { border-color: var(--no); background: var(--no-bg); text-decoration: line-through; opacity: .7; }
.opt.wrong .letter { color: var(--no); }
.q.done .opt { cursor: default; }
.q.done .opt:hover { border-color: var(--line); }
.q.done .opt.right:hover { border-color: var(--ok); }
.q.done .opt.wrong:hover { border-color: var(--no); }

/* открытый ответ */
.answer { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; }
.answer input {
  font-family: var(--ui); font-size: var(--step-1); font-weight: 600;
  font-variant-numeric: tabular-nums; text-align: center;
  width: 8rem; padding: .5rem .6rem;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink);
}
.answer input:focus { outline: none; border-color: var(--accent); }
.answer input.right { border-color: var(--ok); background: var(--ok-bg); }
.answer input.wrong { border-color: var(--no); background: var(--no-bg); }
.answer .aside { font-size: var(--step--1); color: var(--muted); }

/* кнопки */
.btn {
  font-family: var(--ui); font-weight: 600; font-size: var(--step-0);
  padding: .6rem 1.2rem; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--accent); color: #fff;
  text-decoration: none; display: inline-flex; align-items: center; gap: .4rem;
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-bg); filter: none; }
.btn.quiet { border-color: var(--line); background: transparent; color: var(--ink-soft); }
.btn.quiet:hover { border-color: var(--muted); background: transparent; }
.btn.small { font-size: var(--step--1); padding: .42rem .85rem; }

.q-actions { margin-top: .6rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.q:not(.done) .th-after { display: none; }
.theory { --theory-bg: var(--card-sunk); --theory-line: var(--line); --theory-ink: var(--accent, #2f5fa8);
  font-family: var(--read); }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; }

/* подсказка и разбор */
.hint, .expl {
  margin-top: .7rem; padding: .6rem .85rem;
  border-radius: 10px; font-family: var(--read); font-size: var(--step-0);
  line-height: 1.5;
}
.hint { background: var(--hint-bg); border: 1px solid var(--hint-line); color: var(--ink); }
.hint::before { content: "Приём: "; font-family: var(--ui); font-weight: 700; font-size: .72rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--hint); }
.expl { background: var(--card-sunk); border: 1px solid var(--line); color: var(--ink-soft); }
.expl b { color: var(--ink); }
.expl .mono { background: var(--card); }


/* ===== РЕЖИМ «ОДНА ЗАДАЧА НА ЭКРАН» =====
   Задачи размечены все сразу — режим только прячет лишние и добавляет
   навигацию, поэтому ответы, подсказки, таймер и счёт в нём те же. */

.viewtoggle { display: flex; gap: .3rem; justify-content: center; margin: 0 0 .9rem; }
.vbtn {
  font-family: var(--ui); font-size: var(--step--1); font-weight: 700; color: var(--muted);
  border: 1.5px solid var(--line); border-radius: 999px; padding: .28rem .9rem;
  background: transparent; cursor: pointer; transition: all .18s;
}
.vbtn:hover { border-color: var(--accent); color: var(--accent); }

,"skill":"Финальная репетиция","n":25},{"d":28,"kind":"test","id":"day28","title":"Лёгкий день перед стартом","skill":"Уверенность и ранний сон","n":10}],"sets":{"day01":{"intro":{"title":"Сегодня просто смотрим, что уже умеем","body":"<p>Здесь 25 задач по всем темам месяца. Часть будет лёгкой, часть — незнакомой, и это нормально: незнакомое мы разберём в ближайшие недели.<\/p><ul><li>Решай по порядку, черновик — обычный лист бумаги.<\/li><li>Застряла больше чем на 3 минуты — жми «Подсказка».<\/li><li>Ошибки сегодня полезнее верных ответов: по ним построим расписание.<\/li><\/ul>"},"questions":[{"type":"mcq","topic":"Разряды","q":"Какая цифра стоит в разряде десятков числа 476?","opts":["4","7","6","0"],"ans":1,"hint":"Считай справа налево: единицы, десятки, сотни.","ex":"4<b>7<\/b>6: 6 — единицы, <b>7 — десятки<\/b>, 4 — сотни."},{"type":"mcq","topic":"Сравнение чисел","q":"Какое из чисел 398, 389, 407 и 370 самое большое?","opts":["398","389","407","370"],"ans":2,"hint":"Сначала сравни сотни, и только если они равны — десятки.","ex":"У 407 четыре сотни, у остальных по три. Значит наибольшее — <b>407<\/b>."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 26 + 48?","opts":["64","74","72","84"],"ans":1,"hint":"Сложи десятки, потом единицы: 6 + 8 даёт переход через десяток.","ex":"20 + 40 = 60, 6 + 8 = 14. Вместе 60 + 14 = <b>74<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 70 − 34?","opts":["36","44","46","34"],"ans":0,"hint":"Вычитай по частям: сначала 30, потом 4.","ex":"70 &minus; 30 = 40, затем 40 &minus; 4 = <b>36<\/b>."},{"type":"mcq","topic":"Умножение","q":"Сколько будет 5 × 7?","opts":["30","35","40","45"],"ans":1,"hint":"Считай пятёрками: 5, 10, 15, 20, 25, 30, 35.","ex":"Семь раз по пять: 5 × 7 = <b>35<\/b>."},{"type":"mcq","topic":"Деление","q":"У Маши 18 конфет, и она разделила их поровну между тремя подругами. Сколько конфет получила каждая?","opts":["3","5","6","9"],"ans":2,"hint":"Какое число надо умножить на 3, чтобы получить 18?","ex":"18 ÷ 3 = <b>6<\/b> конфет. Проверка: 6 × 3 = 18. ✓"},{"type":"mcq","topic":"Доли","q":"Чему равна половина числа 16?","opts":["4","6","8","12"],"ans":2,"hint":"Половина — это деление на 2.","ex":"16 ÷ 2 = <b>8<\/b>."},{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 2, 4, 6, 8, ?","opts":["9","10","12","16"],"ans":1,"hint":"На сколько каждое следующее число больше предыдущего?","ex":"Каждый раз прибавляем 2: 8 + 2 = <b>10<\/b>."},{"type":"mcq","topic":"Чётность","q":"Сколько чётных чисел среди 7, 12, 15, 20, 21, 8?","opts":["2","3","4","5"],"ans":1,"hint":"Чётное число делится на 2 без остатка и оканчивается на 0, 2, 4, 6 или 8.","ex":"Чётные здесь — 12, 20 и 8. Всего <b>3<\/b> числа."},{"type":"mcq","topic":"Деньги","q":"У Пети было 50 рублей, он купил сок за 32 рубля. Сколько рублей сдачи он получил?","opts":["12","18","22","28"],"ans":1,"hint":"Сдача — это то, что осталось от денег после покупки.","ex":"50 &minus; 32 = <b>18<\/b> рублей."},{"type":"mcq","topic":"Время","q":"Урок начался в 9:00 и длился 40 минут. Во сколько он закончился?","opts":["9:30","9:40","10:00","10:40"],"ans":1,"hint":"К девяти часам прибавь 40 минут — до целого часа ещё далеко.","ex":"9:00 + 40 мин = <b>9:40<\/b>."},{"type":"mcq","topic":"Длина","q":"Сколько сантиметров в 2 метрах?","opts":["20","120","200","2000"],"ans":2,"hint":"В одном метре 100 сантиметров.","ex":"2 × 100 = <b>200 см<\/b>."},{"type":"mcq","topic":"Фигуры","q":"У какой фигуры ровно 5 сторон?","opts":["Четырёхугольник","Пятиугольник","Шестиугольник","Треугольник"],"ans":1,"hint":"Название фигуры подсказывает число её углов, а углов столько же, сколько сторон.","ex":"У <b>пятиугольника<\/b> 5 сторон и 5 углов."},{"type":"mcq","topic":"Счёт фигур","fig":"grid:2,2","q":"Посмотри на рисунок: сколько всего квадратов на нём можно найти?","opts":["4","5","6","8"],"ans":1,"hint":"Не забудь про самый большой квадрат — он тоже квадрат.","ex":"Четыре маленькие клетки и один большой квадрат: 4 + 1 = <b>5<\/b>."},{"type":"mcq","topic":"Интервалы","q":"Вдоль дорожки поставили 5 столбов на равных расстояниях, от начала до конца. Сколько получилось промежутков между столбами?","opts":["3","4","5","6"],"ans":1,"exfig":"posts:40,10","hint":"Нарисуй пять точек на линии и посчитай промежутки между ними.","ex":"Промежутков всегда на один меньше, чем столбов: 5 &minus; 1 = <b>4<\/b>."},{"type":"open","topic":"Сложение","q":"Сколько будет 34 + 27?","ans":61,"hint":"Сначала десятки, потом единицы.","ex":"30 + 20 = 50, 4 + 7 = 11. Вместе 50 + 11 = <b>61<\/b>."},{"type":"open","topic":"Вычитание","q":"В коробке было 40 конфет, съели 15. Сколько конфет осталось?","ans":25,"hint":"Осталось — значит вычитаем.","ex":"40 &minus; 15 = <b>25<\/b> конфет."},{"type":"open","topic":"Умножение","q":"Сколько будет 7 × 3?","ans":21,"hint":"Три раза по семь: 7, 14, 21.","ex":"7 × 3 = <b>21<\/b>."},{"type":"open","topic":"Разряды","q":"Сколько всего десятков в числе 250?","ans":25,"hint":"Речь не о цифре десятков, а о том, сколько десятков помещается в числе целиком.","ex":"250 — это 25 десятков: 25 × 10 = 250. Ответ <b>25<\/b>."},{"type":"open","topic":"Кратное сравнение","q":"У Ани 12 наклеек, а у Бори в 2 раза больше. Сколько наклеек у Бори?","ans":24,"hint":"«В 2 раза больше» — значит умножаем на 2.","ex":"12 × 2 = <b>24<\/b> наклейки."},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 2, 4, 8, 16, ?","ans":32,"hint":"Здесь не прибавляют одно и то же — посмотри, во сколько раз растут числа.","ex":"Каждое число вдвое больше предыдущего: 16 × 2 = <b>32<\/b>."},{"type":"open","topic":"Интервалы","q":"Ленту разрезали на 3 части. Сколько сделали разрезов?","ans":2,"exfig":"log:3","hint":"Первый разрез даёт две части, второй — три.","ex":"Разрезов всегда на один меньше, чем частей: 3 &minus; 1 = <b>2<\/b>."},{"type":"open","topic":"Перебор","q":"Из цифр 1, 2 и 3 составляют двузначные числа так, чтобы цифры в числе не повторялись. Сколько таких чисел получится?","ans":6,"hint":"Выпиши их подряд, начиная с чисел на 1.","ex":"12, 13, 21, 23, 31, 32 — всего <b>6<\/b> чисел."},{"type":"open","topic":"Обратный ход","q":"Задумали число, прибавили к нему 7 и получили 15. Какое число задумали?","ans":8,"hint":"Иди обратно: если прибавляли, то теперь вычитай.","ex":"15 &minus; 7 = <b>8<\/b>. Проверка: 8 + 7 = 15. ✓"},{"type":"open","topic":"Текстовые задачи","q":"В классе 8 мальчиков и 9 девочек. Пятеро детей уехали на соревнования. Сколько детей осталось в классе?","ans":12,"hint":"Сначала узнай, сколько детей было всего.","ex":"Всего 8 + 9 = 17 детей. Осталось 17 &minus; 5 = <b>12<\/b>."}]},"day02":{"intro":{"title":"Приём дня: читаем число по разрядам","body":"<p>Любое трёхзначное число — это <b>сотни, десятки и единицы<\/b>. Считать разряды всегда начинают справа:<\/p><div class=\"mono\">4 7 6\n│ │ └── единицы: 6\n│ └──── десятки: 7\n└────── сотни: 4<\/div><p><b>Сравниваем слева направо.<\/b> Сначала сотни; если они одинаковые — десятки; и только потом единицы. Число с бо́льшим количеством цифр всегда больше.<\/p><p><b>Осторожно с ловушкой.<\/b> «Цифра десятков» и «сколько всего десятков в числе» — разные вопросы. В числе 480 цифра десятков 8, а десятков в нём <b>48<\/b>.<\/p>"},"questions":[{"type":"mcq","topic":"Разряды","q":"Какая цифра стоит в разряде сотен числа 738?","opts":["3","7","8","73"],"ans":1,"hint":"Разряды считают справа налево: единицы, десятки, сотни.","ex":"<b>7<\/b>38: 8 — единицы, 3 — десятки, <b>7 — сотни<\/b>."},{"type":"mcq","topic":"Соседние числа","q":"Какое число стоит между 499 и 501?","opts":["409","500","510","599"],"ans":1,"hint":"Прибавь к 499 единицу.","ex":"499 + 1 = <b>500<\/b>, а 500 + 1 = 501. ✓"},{"type":"mcq","topic":"Разряды","q":"В числе 4 сотни, 0 десятков и 6 единиц. Что это за число?","opts":["46","406","460","4006"],"ans":1,"hint":"Пустой разряд не пропускают — на его месте пишут ноль.","ex":"4 сотни, 0 десятков, 6 единиц — это <b>406<\/b>."},{"type":"mcq","topic":"Сравнение чисел","q":"Какое из чисел ближе всего к 500?","opts":["489","512","470","530"],"ans":0,"hint":"Посчитай для каждого числа, на сколько оно отличается от 500.","ex":"500 &minus; 489 = 11, 512 &minus; 500 = 12, 500 &minus; 470 = 30, 530 &minus; 500 = 30. Меньше всех отличается <b>489<\/b>."},{"type":"mcq","topic":"Сравнение чисел","q":"Числа 208, 280, 82 и 802 расставили по возрастанию. Какое число оказалось третьим?","opts":["82","208","280","802"],"ans":2,"hint":"Двузначное число всегда меньше трёхзначного.","ex":"По возрастанию: 82, 208, <b>280<\/b>, 802. Третье — <b>280<\/b>."},{"type":"open","topic":"Разряды","q":"Составь самое большое трёхзначное число из цифр 3, 7 и 5, используя каждую цифру один раз.","ans":753,"hint":"Самую большую цифру ставь в самый старший разряд — в сотни.","ex":"Сотни — 7, десятки — 5, единицы — 3: <b>753<\/b>."},{"type":"open","topic":"Сравнение чисел","q":"На сколько 640 больше, чем 604?","ans":36,"hint":"Вычитание: из большего вычитаем меньшее.","ex":"640 &minus; 604 = <b>36<\/b>."},{"type":"open","topic":"Разряды","q":"Сколько всего десятков в числе 480?","ans":48,"hint":"Вопрос не о цифре десятков, а о том, сколько десятков помещается во всём числе.","ex":"48 десятков — это 48 × 10 = 480. Ответ <b>48<\/b>."},{"type":"open","topic":"Разряды","q":"В трёхзначном числе 5 сотен, десятков нет, а единиц столько же, сколько сотен. Что это за число?","ans":505,"hint":"Единиц столько же, сколько сотен, — значит 5. А на месте десятков ставим ноль.","ex":"5 сотен, 0 десятков, 5 единиц — это <b>505<\/b>."},{"type":"open","topic":"Сравнение чисел","q":"Какое самое маленькое трёхзначное число?","ans":100,"hint":"Ноль в разряде сотен стоять не может — число стало бы двузначным.","ex":"Самое маленькое трёхзначное — <b>100<\/b>: у 99 всего две цифры."}]},"day03":{"intro":{"title":"Приём дня: считаем по частям","body":"<p><b>Сложение по частям.<\/b> Складывай сначала десятки, потом единицы:<\/p><div class=\"mono\">26 + 48\n20 + 40 = 60\n 6 +  8 = 14\n60 + 14 = 74<\/div><p><b>Удобные пары.<\/b> Слагаемые можно переставлять. Ищи пары, дающие круглое число: в примере 27 + 39 + 13 удобно сложить 27 и 13 — получится ровно 40.<\/p><p><b>Вычитание по частям.<\/b> 70 &minus; 34 — сначала убираем 30, потом 4: 70 &minus; 30 = 40, 40 &minus; 4 = 36.<\/p><p><b>Проверка.<\/b> Сложение проверяют вычитанием, вычитание — сложением. На олимпиаде это стоит десяти секунд и спасает балл.<\/p>"},"questions":[{"type":"mcq","topic":"Сложение","q":"Сколько будет 47 + 38?","opts":["75","85","715","86"],"ans":1,"hint":"Десятки к десяткам, единицы к единицам: 7 + 8 даёт переход через десяток.","ex":"40 + 30 = 70, 7 + 8 = 15. Вместе 70 + 15 = <b>85<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 100 − 47?","opts":["53","63","57","43"],"ans":0,"hint":"До сотни от 47 не хватает столько же, сколько от 7 до 10, плюс целые десятки.","ex":"100 &minus; 40 = 60, 60 &minus; 7 = <b>53<\/b>. Проверка: 53 + 47 = 100. ✓"},{"type":"mcq","topic":"Сложение","q":"Какое число надо прибавить к 67, чтобы получилось 100?","opts":["23","33","43","37"],"ans":1,"hint":"От 67 до 70 — три шага, а от 70 до 100 — тридцать.","ex":"3 + 30 = <b>33<\/b>. Проверка: 67 + 33 = 100. ✓"},{"type":"mcq","topic":"Удобные пары","q":"Сколько будет 27 + 39 + 13?","opts":["69","79","89","78"],"ans":1,"hint":"Переставь слагаемые так, чтобы сначала получилось круглое число.","ex":"27 + 13 = 40 — круглое число. Теперь 40 + 39 = <b>79<\/b>."},{"type":"mcq","topic":"Текстовые задачи","q":"В автобусе ехали 32 человека. На остановке вышли 9 человек, а вошли 15. Сколько человек стало в автобусе?","opts":["26","38","47","56"],"ans":1,"hint":"Действуй по порядку: сначала вышли, потом вошли.","ex":"32 &minus; 9 = 23, затем 23 + 15 = <b>38<\/b> человек."},{"type":"open","topic":"Сложение","q":"Сколько будет 256 + 130?","ans":386,"hint":"Складывай по разрядам: сотни с сотнями, десятки с десятками.","ex":"200 + 100 = 300, 50 + 30 = 80, 6 + 0 = 6. Вместе <b>386<\/b>."},{"type":"open","topic":"Текстовые задачи","q":"У Кати было 85 рублей. Она потратила 26 рублей, а потом бабушка дала ей ещё 40. Сколько рублей у Кати стало?","ans":99,"hint":"Два действия по порядку: сначала потратила, потом получила.","ex":"85 &minus; 26 = 59, затем 59 + 40 = <b>99<\/b> рублей."},{"type":"open","topic":"Вычитание","q":"Сколько будет 63 − 28?","ans":35,"hint":"Убери сначала 20, потом 8.","ex":"63 &minus; 20 = 43, 43 &minus; 8 = <b>35<\/b>. Проверка: 35 + 28 = 63. ✓"},{"type":"open","topic":"Вычитание","q":"Сумма двух чисел равна 90, а одно из них 47. Чему равно второе число?","ans":43,"hint":"Из суммы вычти известное слагаемое.","ex":"90 &minus; 47 = <b>43<\/b>. Проверка: 47 + 43 = 90. ✓"},{"type":"open","topic":"Текстовые задачи","q":"В двух коробках вместе 74 карандаша, в первой коробке 38. Сколько карандашей во второй?","ans":36,"exfig":"parts:74,38,?","hint":"Целое известно, одна часть тоже — значит нужно вычитание.","ex":"74 &minus; 38 = <b>36<\/b> карандашей."}]},"day04":{"intro":{"title":"Приём дня: умножение — это сложение одинаковых","body":"<p>Запись 5 × 7 читается как «по 5 взяли 7 раз»:<\/p><div class=\"mono\">5 + 5 + 5 + 5 + 5 + 5 + 5 = 35\n5 × 7 = 35<\/div><p><b>Умножение на 2<\/b> — это удвоение: число прибавляем само к себе.<\/p><p><b>Умножение на 5<\/b> — считай пятёрками: 5, 10, 15, 20, 25… Все ответы оканчиваются на 0 или 5.<\/p><p><b>Умножение на 10<\/b> — к числу приписывается ноль: 8 × 10 = 80.<\/p><p><b>От перестановки ответ не меняется:<\/b> 5 × 7 и 7 × 5 — это одно и то же. Считай так, как тебе удобнее.<\/p>"},"questions":[{"type":"mcq","topic":"Умножение на 5","q":"Сколько будет 6 × 5?","opts":["11","25","30","35"],"ans":2,"hint":"Считай пятёрками: 5, 10, 15, 20, 25, 30.","ex":"Шесть раз по пять: 6 × 5 = <b>30<\/b>."},{"type":"mcq","topic":"Умножение на 10","q":"Сколько будет 8 × 10?","opts":["18","80","108","800"],"ans":1,"hint":"При умножении на 10 к числу приписывают ноль.","ex":"8 × 10 = <b>80<\/b>."},{"type":"mcq","topic":"Умножение на 5","q":"В одном пакете 5 яблок. Сколько яблок в семи таких пакетах?","opts":["12","30","35","40"],"ans":2,"hint":"По 5 взяли 7 раз.","ex":"5 × 7 = <b>35<\/b> яблок."},{"type":"mcq","topic":"Сравнение","q":"Что больше: 4 × 5 или 3 × 10?","opts":["4 × 5","3 × 10","Они равны","Сравнить нельзя"],"ans":1,"hint":"Посчитай оба произведения и сравни числа.","ex":"4 × 5 = 20, а <b>3 × 10<\/b> = 30. Тридцать больше двадцати."},{"type":"mcq","topic":"Умножение на 2","q":"У паука 8 ног. Сколько ног у двух пауков?","opts":["10","14","16","18"],"ans":2,"hint":"Удвоить — значит прибавить число само к себе.","ex":"8 × 2 = 8 + 8 = <b>16<\/b> ног."},{"type":"open","topic":"Умножение на 2","q":"Сколько будет 9 × 2?","ans":18,"hint":"9 + 9.","ex":"9 × 2 = <b>18<\/b>."},{"type":"open","topic":"Умножение на 5","q":"Сколько будет 5 × 9?","ans":45,"hint":"Пять раз по девять — то же самое, что девять раз по пять.","ex":"5 × 9 = <b>45<\/b>."},{"type":"open","topic":"Умножение на 10","q":"Тетрадь стоит 10 рублей. Сколько рублей стоят 6 таких тетрадей?","ans":60,"hint":"По 10 рублей взяли 6 раз.","ex":"10 × 6 = <b>60<\/b> рублей."},{"type":"open","topic":"Умножение на 5","q":"У Вани 4 коробки, и в каждой по 5 машинок. Сколько всего у него машинок?","ans":20,"hint":"По 5 машинок в каждой из 4 коробок.","ex":"5 × 4 = <b>20<\/b> машинок."},{"type":"open","topic":"Умножение на 10","q":"Сколько всего пальцев на руках у пятерых детей?","ans":50,"hint":"У одного ребёнка на двух руках 10 пальцев.","ex":"10 × 5 = <b>50<\/b> пальцев."}]},"day05":{"intro":{"title":"Приём дня: деление — обратное умножению","body":"<p>Каждый пример на умножение даёт сразу два примера на деление:<\/p><div class=\"mono\">4 × 6 = 24\n24 ÷ 4 = 6\n24 ÷ 6 = 4<\/div><p>Поэтому вопрос «сколько будет 24 ÷ 3?» — это на самом деле вопрос «какое число надо умножить на 3, чтобы получить 24?».<\/p><p><b>Деление поровну.<\/b> «Разложили поровну на 4 тарелки» — значит делим на 4.<\/p><p><b>Проверяй умножением.<\/b> Получил 24 ÷ 4 = 6 — убедись: 6 × 4 = 24. ✓ Это самая быстрая проверка на свете.<\/p>"},"questions":[{"type":"mcq","topic":"Умножение на 4","q":"Сколько будет 7 × 4?","opts":["21","24","28","32"],"ans":2,"hint":"Умножить на 4 — значит удвоить дважды: 7 → 14 → 28.","ex":"7 × 4 = <b>28<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 24 ÷ 3?","opts":["6","7","8","9"],"ans":2,"hint":"Какое число надо умножить на 3, чтобы получилось 24?","ex":"8 × 3 = 24, значит 24 ÷ 3 = <b>8<\/b>."},{"type":"mcq","topic":"Деление","q":"На 4 тарелки разложили поровну 20 печений. Сколько печений оказалось на одной тарелке?","opts":["4","5","6","8"],"ans":1,"hint":"Поровну на 4 — значит делим на 4.","ex":"20 ÷ 4 = <b>5<\/b> печений. Проверка: 5 × 4 = 20. ✓"},{"type":"mcq","topic":"Умножение на 3","q":"Какое число надо умножить на 3, чтобы получилось 27?","opts":["6","7","8","9"],"ans":3,"hint":"Перебирай тройками: 3, 6, 9… или сразу раздели 27 на 3.","ex":"27 ÷ 3 = <b>9<\/b>. Проверка: 9 × 3 = 27. ✓"},{"type":"mcq","topic":"Умножение на 3","q":"В одном букете 3 розы. Сколько роз в шести таких букетах?","opts":["9","12","18","24"],"ans":2,"hint":"По 3 розы взяли 6 раз.","ex":"3 × 6 = <b>18<\/b> роз."},{"type":"open","topic":"Умножение на 3","q":"Сколько будет 8 × 3?","ans":24,"hint":"Три раза по восемь: 8, 16, 24.","ex":"8 × 3 = <b>24<\/b>."},{"type":"open","topic":"Деление","q":"Сколько будет 36 ÷ 4?","ans":9,"hint":"Какое число, умноженное на 4, даёт 36?","ex":"9 × 4 = 36, значит 36 ÷ 4 = <b>9<\/b>."},{"type":"open","topic":"Деление","q":"12 конфет разделили поровну между четырьмя детьми. Сколько конфет получил каждый?","ans":3,"exfig":"parts:12,3,3,3,3","hint":"Делим на 4 — по числу детей.","ex":"12 ÷ 4 = <b>3<\/b> конфеты каждому."},{"type":"open","topic":"Два действия","q":"У Пети 3 коробки по 4 карандаша и ещё 5 карандашей отдельно. Сколько у него карандашей?","ans":17,"hint":"Сначала посчитай карандаши в коробках, потом добавь остальные.","ex":"В коробках 4 × 3 = 12 карандашей, всего 12 + 5 = <b>17<\/b>."},{"type":"open","topic":"Умножение на 4","q":"Сколько ног у четырёх кошек?","ans":16,"hint":"У одной кошки 4 ноги.","ex":"4 × 4 = <b>16<\/b> ног."}]},"day06":{"intro":{"title":"Приём дня: половина и четверть","body":"<p><b>Половина<\/b> — это одна из двух равных частей, то есть деление на 2. <b>Четверть<\/b> — одна из четырёх равных частей, деление на 4.<\/p><p>Четверть можно получить в два шага: разделить пополам, а потом ещё раз пополам.<\/p><div class=\"mono\">20 → пополам → 10 → пополам → 5\nчетверть числа 20 — это 5<\/div><p><b>Обратный вопрос.<\/b> Если известна половина, само число вдвое больше: половина равна 9 → число 18. Если известна четверть — умножай на 4.<\/p><p><b>Главное слово — «равные».<\/b> Половина торта — это не любой из двух кусков, а только один из двух <b>одинаковых<\/b>.<\/p>"},"questions":[{"type":"mcq","topic":"Половина","q":"Чему равна половина числа 24?","opts":["6","8","12","14"],"ans":2,"hint":"Половина — деление на 2.","ex":"24 ÷ 2 = <b>12<\/b>."},{"type":"mcq","topic":"Четверть","q":"Чему равна четверть числа 20?","opts":["4","5","8","10"],"ans":1,"hint":"Раздели пополам, а потом ещё раз пополам.","ex":"20 ÷ 2 = 10, 10 ÷ 2 = <b>5<\/b>. Или сразу: 20 ÷ 4 = 5."},{"type":"mcq","topic":"Доли","fig":"grid:4,2","q":"Торт разрезали на 8 равных кусков. Сколько кусков составят половину торта?","opts":["2","3","4","6"],"ans":2,"hint":"Половина — это столько же кусков, сколько во второй половине.","ex":"8 ÷ 2 = <b>4<\/b> куска."},{"type":"mcq","topic":"Обратная задача","q":"Половина числа равна 9. Чему равно само число?","opts":["4","12","18","19"],"ans":2,"hint":"Если половина известна, всё число вдвое больше.","ex":"9 × 2 = <b>18<\/b>. Проверка: 18 ÷ 2 = 9. ✓"},{"type":"mcq","topic":"Доли","q":"Ленту длиной 12 см разрезали пополам, а потом одну из половин ещё раз пополам. Какой длины получились самые короткие куски?","opts":["2 см","3 см","4 см","6 см"],"ans":1,"hint":"Сначала найди длину половины, потом раздели её ещё раз.","ex":"12 ÷ 2 = 6 см — половина. 6 ÷ 2 = <b>3 см<\/b> — самый короткий кусок."},{"type":"open","topic":"Четверть","q":"Чему равна четверть числа 32?","ans":8,"hint":"Дели на 4 или дважды пополам.","ex":"32 ÷ 4 = <b>8<\/b>."},{"type":"open","topic":"Обратная задача","q":"Половина яблок в корзине — это 7 яблок. Сколько яблок в корзине всего?","ans":14,"exfig":"parts:?,7,7","hint":"Вторая половина такая же, как первая.","ex":"7 + 7 = <b>14<\/b> яблок."},{"type":"open","topic":"Половина","q":"У Маши было 20 наклеек, и она отдала половину подруге. Сколько наклеек у неё осталось?","ans":10,"hint":"Отдала половину — ровно столько же и осталось.","ex":"20 ÷ 2 = <b>10<\/b> наклеек."},{"type":"open","topic":"Четверть","q":"В классе 24 ученика, и четверть из них — отличники. Сколько в классе отличников?","ans":6,"hint":"Четверть — деление на 4.","ex":"24 ÷ 4 = <b>6<\/b> отличников."},{"type":"open","topic":"Доли","q":"Число 20 разделили пополам, а полученное число ещё раз пополам. Какое число получилось?","ans":5,"hint":"Два шага подряд.","ex":"20 ÷ 2 = 10, 10 ÷ 2 = <b>5<\/b>."}]},"day07":{"intro":{"title":"Проверяем, что осело за неделю","body":"<p>15 задач по всему, что разбирали на этой неделе. Новых приёмов сегодня нет — только знакомые.<\/p><p>После набора обязательно загляни в <a href=\"#/errors\">журнал ошибок<\/a> и прорешай то, что там накопилось: задача, решённая повторно через день-два, запоминается заметно лучше.<\/p>"},"questions":[{"type":"mcq","topic":"Разряды","q":"Какая цифра стоит в разряде единиц числа 507?","opts":["5","0","7","57"],"ans":2,"hint":"Единицы — самая правая цифра.","ex":"50<b>7<\/b>: единицы — <b>7<\/b>, десятков нет, сотен 5."},{"type":"mcq","topic":"Сравнение чисел","q":"Какое число наименьшее?","opts":["320","302","230","203"],"ans":3,"hint":"Сравнивай сначала сотни.","ex":"Меньше всех сотен у 230 и 203 — по две. У 203 меньше десятков, значит наименьшее <b>203<\/b>."},{"type":"mcq","topic":"Сложение","q":"Сколько будет 58 + 27?","opts":["75","85","86","95"],"ans":1,"hint":"Десятки отдельно, единицы отдельно.","ex":"50 + 20 = 70, 8 + 7 = 15. Вместе 70 + 15 = <b>85<\/b>."},{"type":"mcq","topic":"Вычитание","q":"Сколько будет 91 − 46?","opts":["35","45","55","44"],"ans":1,"hint":"Убери сначала 40, потом 6.","ex":"91 &minus; 40 = 51, 51 &minus; 6 = <b>45<\/b>. Проверка: 45 + 46 = 91. ✓"},{"type":"mcq","topic":"Умножение","q":"Сколько будет 4 × 9?","opts":["32","34","36","40"],"ans":2,"hint":"Девять раз по четыре — или, что то же самое, четыре раза по девять.","ex":"4 × 9 = <b>36<\/b>."},{"type":"mcq","topic":"Деление","q":"Сколько будет 30 ÷ 5?","opts":["5","6","7","15"],"ans":1,"hint":"Какое число надо умножить на 5, чтобы вышло 30?","ex":"6 × 5 = 30, значит 30 ÷ 5 = <b>6<\/b>."},{"type":"mcq","topic":"Доли","q":"Чему равна четверть числа 16?","opts":["2","4","6","8"],"ans":1,"hint":"Пополам, а потом ещё раз пополам.","ex":"16 ÷ 4 = <b>4<\/b>."},{"type":"mcq","topic":"Умножение","q":"У Лены 5 пакетов, и в каждом по 4 конфеты. Сколько у неё конфет?","opts":["9","16","20","24"],"ans":2,"hint":"По 4 конфеты взяли 5 раз.","ex":"4 × 5 = <b>20<\/b> конфет."},{"type":"open","topic":"Сложение","q":"Сколько будет 145 + 230?","ans":375,"hint":"Складывай по разрядам.","ex":"100 + 200 = 300, 40 + 30 = 70, 5 + 0 = 5. Вместе <b>375<\/b>."},{"type":"open","topic":"Вычитание","q":"На сколько 82 больше, чем 47?","ans":35,"hint":"«На сколько больше» — это вычитание.","ex":"82 &minus; 47 = <b>35<\/b>."},{"type":"open","topic":"Умножение","q":"Сколько будет 5 × 8?","ans":40,"hint":"Считай пятёрками восемь шагов.","ex":"5 × 8 = <b>40<\/b>."},{"type":"open","topic":"Деление","q":"Сколько будет 28 ÷ 4?","ans":7,"hint":"Какое число, умноженное на 4, даёт 28?","ex":"7 × 4 = 28, значит 28 ÷ 4 = <b>7<\/b>."},{"type":"open","topic":"Доли","q":"Половина числа равна 12. Чему равно само число?","ans":24,"hint":"Всё число вдвое больше половины.","ex":"12 × 2 = <b>24<\/b>."},{"type":"open","topic":"Часть и целое","q":"В двух коробках вместе 60 конфет, в первой коробке 25. Сколько конфет во второй?","ans":35,"exfig":"parts:60,25,?","hint":"Из целого вычти известную часть.","ex":"60 &minus; 25 = <b>35<\/b> конфет."},{"type":"open","topic":"Разряды","q":"Составь самое маленькое трёхзначное число из цифр 4, 0 и 7, используя каждую цифру один раз.","ans":407,"hint":"Ноль не может стоять первым — иначе число перестанет быть трёхзначным.","ex":"Первой ставим самую маленькую из оставшихся цифр — 4, потом 0, потом 7: <b>407<\/b>."}]},"day08":{"intro":{"title":"Приём дня: смотри на разности","body":"<p>Первое, что делают с незнакомым рядом, — выписывают, <b>на сколько<\/b> каждое следующее число отличается от предыдущего:<\/p><div class=\"mono\">3   7   11   15   ?\n  +4  +4   +4   +4  → 19<\/div><p>Если разности одинаковые — прибавляй ту же величину.<\/p><p><b>Если разности растут<\/b>, посмотри на них ещё раз: 1, 2, 4, 7, 11 — разности 1, 2, 3, 4, значит дальше +5.<\/p><p><b>Если число растёт слишком быстро<\/b>, проверь умножение: 2, 6, 18 — каждое втрое больше предыдущего.<\/p><p><b>Хитрый случай.<\/b> В ряду 1, 1, 2, 3, 5, 8 каждое число — сумма двух предыдущих.<\/p>"},"questions":[{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 5, 10, 15, 20, ?","opts":["21","24","25","30"],"ans":2,"hint":"На сколько растёт ряд каждый раз?","ex":"Каждый раз прибавляем 5: 20 + 5 = <b>25<\/b>."},{"type":"mcq","topic":"Растущие разности","q":"Продолжи ряд: 1, 2, 4, 7, 11, ?","opts":["14","15","16","18"],"ans":2,"hint":"Выпиши разности: 1, 2, 3, 4… Какая следующая?","ex":"Разности растут на единицу: 1, 2, 3, 4, значит дальше +5. 11 + 5 = <b>16<\/b>."},{"type":"mcq","topic":"Убывающие ряды","q":"Продолжи ряд: 100, 90, 80, ?","opts":["60","70","75","85"],"ans":1,"hint":"Ряд убывает — значит вычитаем одно и то же.","ex":"Каждый раз вычитаем 10: 80 &minus; 10 = <b>70<\/b>."},{"type":"mcq","topic":"Пропущенное число","q":"Какое число пропущено: 7, 14, ?, 28","opts":["15","20","21","24"],"ans":2,"hint":"Между 7 и 14 шаг 7. Значит и дальше шаг тот же.","ex":"14 + 7 = <b>21<\/b>, и 21 + 7 = 28. ✓"},{"type":"mcq","topic":"Умножение в ряду","q":"Продолжи ряд: 2, 6, 18, ?","opts":["24","36","54","72"],"ans":2,"hint":"Разности тут не помогают — посмотри, во сколько раз растут числа.","ex":"Каждое число втрое больше предыдущего: 18 × 3 = <b>54<\/b>."},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 3, 7, 11, 15, ?","ans":19,"hint":"Разности одинаковые.","ex":"Каждый раз прибавляем 4: 15 + 4 = <b>19<\/b>."},{"type":"open","topic":"Убывающие ряды","q":"Продолжи ряд: 64, 32, 16, ?","ans":8,"hint":"Числа не уменьшаются на одно и то же — а во сколько раз они меняются?","ex":"Каждое число вдвое меньше предыдущего: 16 ÷ 2 = <b>8<\/b>."},{"type":"open","topic":"Далёкий член ряда","q":"Какое число будет десятым в ряду 2, 4, 6, 8, …?","ans":20,"hint":"Это чётные числа по порядку: первое 2, второе 4…","ex":"Десятое число — это 2 × 10 = <b>20<\/b>."},{"type":"open","topic":"Далёкий член ряда","q":"В ряду 1, 4, 7, 10, … какое число стоит на шестом месте?","ans":16,"hint":"От первого числа до шестого прибавление произошло 5 раз, а не 6.","ex":"Шаг 3, прибавляем его 5 раз: 1 + 3 × 5 = 1 + 15 = <b>16<\/b>. Проверка по ряду: 1, 4, 7, 10, 13, 16. ✓"},{"type":"open","topic":"Хитрые ряды","q":"Продолжи ряд: 1, 1, 2, 3, 5, 8, ?","ans":13,"hint":"Сложи два последних числа.","ex":"Каждое число — сумма двух предыдущих: 5 + 8 = <b>13<\/b>."}]},"day09":{"intro":{"title":"Приём дня: превращаем рисунок в числа","body":"<p>Задача показывает три-четыре первые фигуры и спрашивает про дальнюю. Рисовать её целиком не нужно — нужно найти правило.<\/p><p><b>Что делать по шагам:<\/b><\/p><ul><li>Посчитай, из скольких палочек (точек, кубиков) состоит каждая фигура.<\/li><li>Выпиши эти числа в ряд.<\/li><li>Найди, на сколько растёт ряд, — дальше это обычная числовая закономерность.<\/li><\/ul><p><b>Главная ловушка.<\/b> Первая фигура — особенная: у неё нет соседа слева. Поэтому в ряду квадратов из спичек первый стоит 4 спички, а каждый следующий добавляет только 3 — общая сторона уже есть.<\/p>"},"questions":[{"type":"mcq","topic":"Фигурные ряды","fig":"grid:3,1","q":"Из спичек выкладывают в ряд квадраты с общими сторонами: на 1 квадрат уходит 4 спички, на 2 — уже 7, на 3 — 10. Сколько спичек уйдёт на 5 квадратов?","opts":["15","16","19","20"],"ans":1,"hint":"Первый квадрат — 4 спички, каждый следующий добавляет по 3. Сколько «следующих»?","ex":"После первого добавляется ещё 4 квадрата по 3 спички: 4 + 3 × 4 = <b>16<\/b>."},{"type":"mcq","topic":"Точечные фигуры","fig":"dots:1,4,9,?","q":"Фигуры складывают из точек: в первой 1 точка, во второй 4, в третьей 9. Сколько точек будет в четвёртой фигуре?","opts":["12","14","16","20"],"ans":2,"hint":"Квадрат из точек — это одинаковое число рядов и столбцов.","ex":"4-я фигура — квадрат 4 на 4: 4 × 4 = <b>16<\/b> точек."},{"type":"mcq","topic":"Треугольные числа","q":"Продолжи ряд: 1, 3, 6, ?","opts":["8","9","10","12"],"ans":2,"exfig":"triangles:1,3,6,?","hint":"Разности: 2, 3… Какая следующая?","ex":"Разности растут на единицу, значит дальше +4: 6 + 4 = <b>10<\/b>."},{"type":"mcq","topic":"Лесенки","fig":"stairs:1,2,3,4","q":"Лесенку складывают из кубиков: в первом столбике 1 кубик, во втором 2, в третьем 3, в четвёртом 4. Сколько всего кубиков в лесенке?","opts":["8","9","10","12"],"ans":2,"hint":"Сложи 1 + 2 + 3 + 4.","ex":"1 + 2 + 3 + 4 = <b>10<\/b> кубиков."},{"type":"mcq","topic":"Повторяющийся узор","q":"Бусины нанизывают узором: красная, синяя, синяя, красная, синяя, синяя, и так далее. Какого цвета девятая бусина?","opts":["Красная","Синяя","Зелёная","Определить нельзя"],"ans":1,"hint":"Узор повторяется каждые три бусины. На каком месте внутри тройки стоит девятая?","ex":"Девятая бусина замыкает третью тройку, а третья в тройке всегда <b>синяя<\/b>."},{"type":"open","topic":"Фигурные ряды","q":"Сколько спичек нужно, чтобы выложить в ряд 8 квадратов с общими сторонами (на первый квадрат — 4 спички, на каждый следующий — ещё 3)?","ans":25,"hint":"Не умножай 3 на 8 — первый квадрат уже посчитан отдельно.","ex":"4 + 3 × 7 = 4 + 21 = <b>25<\/b> спичек."},{"type":"open","topic":"Точечные фигуры","q":"Сколько точек будет в 6-й фигуре ряда 1, 4, 9, 16, …?","ans":36,"hint":"Это квадраты: 1×1, 2×2, 3×3…","ex":"6-я фигура — квадрат 6 на 6: 6 × 6 = <b>36<\/b> точек."},{"type":"open","topic":"Лесенки","q":"Лесенка сложена из столбиков по 1, 2, 3, 4, 5 и 6 кубиков. Сколько всего кубиков в лесенке?","ans":21,"exfig":"stairs:1,2,3,4,5,6","hint":"Складывай парами с краёв: 1 + 6, 2 + 5, 3 + 4.","ex":"Три пары по 7: 7 × 3 = <b>21<\/b> кубик."},{"type":"open","topic":"Фигурные ряды","fig":"tristrip:3","q":"Из палочек выкладывают треугольники в ряд, соседние имеют общую сторону: на 1 треугольник — 3 палочки, на каждый следующий — ещё 2. Сколько палочек нужно на 7 треугольников?","ans":15,"hint":"Первый треугольник особенный, остальных шесть.","ex":"3 + 2 × 6 = 3 + 12 = <b>15<\/b> палочек."},{"type":"open","topic":"Повторяющийся узор","q":"Бусины нанизывают по кругу узором: красная, синяя, жёлтая, красная, синяя, жёлтая… Какой по счёту будет третья жёлтая бусина?","ans":9,"hint":"Жёлтая — каждая третья: 3-я, 6-я…","ex":"Жёлтые стоят на местах 3, 6, <b>9<\/b>. Третья жёлтая — девятая по счёту."}]},"day10":{"intro":{"title":"Приём дня: рисуем полоски","body":"<p>В текстовой задаче каждую величину рисуют полоской. Одинаковые доли — одинаковой длины. Тогда ответ становится видно.<\/p><p><b>Модель «в несколько раз больше».<\/b> «У Оли втрое больше, чем у Кати»:<\/p><div class=\"mono\">Катя  [__]                 ← 1 доля\nОля   [__][__][__]         ← 3 доли\nВсего 4 доли<\/div><p>Находим одну долю — делим всё на число долей. Дальше считается сразу.<\/p><p><b>Модель «на столько-то больше».<\/b> Убери разницу — останутся две одинаковые доли: (сумма &minus; разница) ÷ 2 = меньшая величина.<\/p><p>Рисуй полоски даже в лёгкой задаче: привычка рисовать спасает в трудной.<\/p>"},"questions":[{"type":"mcq","topic":"Поровну","q":"У Вани и Пети вместе 20 марок, причём поровну. Сколько марок у Вани?","opts":["5","10","15","20"],"ans":1,"exfig":"parts:20,10,10","hint":"Поровну — значит пополам.","ex":"20 ÷ 2 = <b>10<\/b> марок."},{"type":"mcq","topic":"Во сколько раз больше","q":"У Оли в 3 раза больше наклеек, чем у Кати. Вместе у них 24 наклейки. Сколько наклеек у Кати?","opts":["4","6","8","12"],"ans":1,"exfig":"bars:Катя=1;Оля=3;@total=24","hint":"Катя — 1 доля, Оля — 3 доли. Сколько долей всего?","ex":"Всего 1 + 3 = 4 доли: 24 ÷ 4 = <b>6<\/b> наклеек у Кати. У Оли 18. Проверка: 6 + 18 = 24. ✓"},{"type":"mcq","topic":"Во сколько раз больше","q":"Ленту длиной 15 см разрезали на две части так, что одна вдвое длиннее другой. Какова длина короткой части?","opts":["3 см","5 см","7 см","10 см"],"ans":1,"exfig":"bars:короткая=1;длинная=2;@total=15 см","hint":"Короткая — 1 доля, длинная — 2 доли.","ex":"Всего 3 доли: 15 ÷ 3 = <b>5 см<\/b>. Длинная часть 10 см."},{"type":"mcq","topic":"На сколько больше","q":"У Миши на 6 конфет больше, чем у Даши. Вместе у них 20 конфет. Сколько конфет у Даши?","opts":["6","7","8","13"],"ans":1,"exfig":"bars:Даша=1;Миша=1+6;@total=20","hint":"Убери разницу из суммы — останутся две одинаковые доли.","ex":"(20 &minus; 6) ÷ 2 = <b>7<\/b> конфет у Даши. У Миши 13. Проверка: 7 + 13 = 20. ✓"},{"type":"mcq","topic":"Во сколько раз больше","q":"В двух коробках 25 карандашей, причём во второй в 4 раза больше, чем в первой. Сколько карандашей в первой коробке?","opts":["4","5","6","20"],"ans":1,"exfig":"bars:первая=1;вторая=4;@total=25","hint":"Первая — 1 доля, вторая — 4 доли.","ex":"Всего 5 долей: 25 ÷ 5 = <b>5<\/b> карандашей в первой, 20 во второй."},{"type":"open","topic":"Поровну","q":"Брат и сестра собрали вместе 30 грибов и разделили их поровну. Сколько грибов у брата?","ans":15,"hint":"Поровну на двоих.","ex":"30 ÷ 2 = <b>15<\/b> грибов."},{"type":"open","topic":"Во сколько раз больше","q":"У Ани в 2 раза больше конфет, чем у Веры. Всего у них 18 конфет. Сколько конфет у Ани?","ans":12,"exfig":"bars:Вера=1;Аня=2;@total=18","hint":"Вера — 1 доля, Аня — 2 доли, всего 3 доли.","ex":"18 ÷ 3 = 6 конфет у Веры, у Ани две доли: 6 × 2 = <b>12<\/b>. Проверка: 6 + 12 = 18. ✓"},{"type":"open","topic":"На сколько больше","q":"У Пети на 4 машинки больше, чем у Саши, а вместе у них 16 машинок. Сколько машинок у Пети?","ans":10,"exfig":"bars:Саша=1;Петя=1+4;@total=16","hint":"Сначала найди, сколько у Саши: убери разницу и раздели пополам.","ex":"(16 &minus; 4) ÷ 2 = 6 машинок у Саши. У Пети 6 + 4 = <b>10<\/b>. Проверка: 6 + 10 = 16. ✓"},{"type":"open","topic":"Доли отрезка","fig":"segment:4,2,10 см","q":"Отрезок разделили на 4 равные части. Две такие части вместе составляют 10 см. Чему равна длина всего отрезка в сантиметрах?","ans":20,"hint":"Сначала узнай длину одной части.","ex":"Одна часть: 10 ÷ 2 = 5 см. Весь отрезок: 5 × 4 = <b>20 см<\/b>."},{"type":"open","topic":"Поровну","q":"Три друга разделили 21 наклейку поровну. Сколько наклеек получил каждый?","ans":7,"hint":"Делим на троих.","ex":"21 ÷ 3 = <b>7<\/b> наклеек."}]},"day11":{"intro":{"title":"Приём дня: два разных «больше»","body":"<p>В задачах встречаются два непохожих вопроса, и путать их нельзя:<\/p><ul><li><b>«На сколько больше»<\/b> — это <b>вычитание<\/b>. 15 больше 9 на 6.<\/li><li><b>«Во сколько раз больше»<\/b> — это <b>деление<\/b>. 20 больше 5 в 4 раза.<\/li><\/ul><p>Обратные действия работают так же:<\/p><ul><li>«на 5 больше» → прибавить 5, «на 5 меньше» → вычесть 5;<\/li><li>«в 5 раз больше» → умножить на 5, «в 5 раз меньше» → разделить на 5.<\/li><\/ul><p><b>Проверяй словами.<\/b> Получил ответ — перескажи задачу с числами и убедись, что всё сходится.<\/p>"},"questions":[{"type":"mcq","topic":"Разностное сравнение","q":"На сколько 15 больше, чем 9?","opts":["4","5","6","24"],"ans":2,"hint":"«На сколько» — вычитание.","ex":"15 &minus; 9 = <b>6<\/b>."},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 20 больше, чем 5?","opts":["В 2 раза","В 3 раза","В 4 раза","В 15 раз"],"ans":2,"hint":"«Во сколько раз» — деление.","ex":"20 ÷ 5 = 4, значит <b>в 4 раза<\/b>."},{"type":"mcq","topic":"Кратное сравнение","q":"У Пети 24 марки, а у Вани 6. Во сколько раз у Пети больше марок, чем у Вани?","opts":["В 3 раза","В 4 раза","В 6 раз","На 18 марок"],"ans":1,"hint":"Раздели большее на меньшее.","ex":"24 ÷ 6 = 4, значит у Пети <b>в 4 раза<\/b> больше."},{"type":"mcq","topic":"Разностное сравнение","q":"У Маши 7 конфет, а у Даши на 5 конфет больше. Сколько конфет у Даши?","opts":["2","10","12","35"],"ans":2,"hint":"«На 5 больше» — прибавляем.","ex":"7 + 5 = <b>12<\/b> конфет."},{"type":"mcq","topic":"Обратная задача","q":"Число 30 в 3 раза больше задуманного числа. Какое число задумали?","opts":["9","10","27","90"],"ans":1,"hint":"Если известное число больше в 3 раза, то задуманное меньше в 3 раза.","ex":"30 ÷ 3 = <b>10<\/b>. Проверка: 10 × 3 = 30. ✓"},{"type":"open","topic":"Разностное сравнение","q":"На сколько 62 больше, чем 48?","ans":14,"hint":"Вычитание.","ex":"62 &minus; 48 = <b>14<\/b>."},{"type":"open","topic":"Кратное сравнение","q":"Какое число в 5 раз больше, чем 8?","ans":40,"hint":"«В 5 раз больше» — умножаем на 5.","ex":"8 × 5 = <b>40<\/b>."},{"type":"open","topic":"Кратное сравнение","q":"У Кати 36 наклеек, а у Оли в 4 раза меньше. Сколько наклеек у Оли?","ans":9,"hint":"«В 4 раза меньше» — делим на 4.","ex":"36 ÷ 4 = <b>9<\/b> наклеек."},{"type":"open","topic":"Кратное сравнение","q":"Папе 40 лет, а сыну 8. Во сколько раз папа старше сына?","ans":5,"hint":"Раздели большее на меньшее.","ex":"40 ÷ 8 = <b>5<\/b> раз."},{"type":"open","topic":"Два действия","q":"У Вани 18 машинок, а у Пети на 6 машинок меньше. Сколько машинок у них вместе?","ans":30,"exfig":"bars:Петя=1;Ваня=1+6;@total=30","hint":"Сначала узнай, сколько машинок у Пети, и только потом складывай.","ex":"У Пети 18 &minus; 6 = 12 машинок. Вместе 18 + 12 = <b>30<\/b>."}]},"day12":{"intro":{"title":"Приём дня: иди от ответа назад","body":"<p>Если в задаче известно, <b>что получилось в конце<\/b>, а спрашивают про начало, — иди от конца к началу и меняй каждое действие на обратное:<\/p><div class=\"mono\">прибавили  →  вычитаем\nвычли      →  прибавляем\nумножили   →  делим\nразделили  →  умножаем<\/div><p><b>Порядок важен.<\/b> Раскручивай действия в обратном порядке: последнее, что сделали, отменяй первым.<\/p><div class=\"mono\">задумали → ×2 → +3 → получили 17\n17 − 3 = 14 → 14 ÷ 2 = 7<\/div><p><b>Всегда проверяй вперёд.<\/b> 7 × 2 = 14, 14 + 3 = 17. ✓ Проверка занимает секунды и ловит почти любую ошибку.<\/p>"},"questions":[{"type":"mcq","topic":"Обратный ход","q":"Задумали число, прибавили к нему 8 и получили 20. Какое число задумали?","opts":["10","12","18","28"],"ans":1,"hint":"Прибавляли — значит теперь вычитай.","ex":"20 &minus; 8 = <b>12<\/b>. Проверка: 12 + 8 = 20. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Число умножили на 3 и получили 21. Какое это число?","opts":["6","7","18","63"],"ans":1,"hint":"Умножали — значит теперь дели.","ex":"21 ÷ 3 = <b>7<\/b>. Проверка: 7 × 3 = 21. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Из числа вычли 15 и получили 25. Какое это число?","opts":["10","30","40","45"],"ans":2,"hint":"Вычитали — значит теперь прибавляй.","ex":"25 + 15 = <b>40<\/b>. Проверка: 40 &minus; 15 = 25. ✓"},{"type":"mcq","topic":"Обратный ход","q":"У Кати было несколько конфет. Она съела 4, и у неё осталось 9. Сколько конфет было у Кати?","opts":["5","12","13","14"],"ans":2,"hint":"Верни съеденные конфеты обратно.","ex":"9 + 4 = <b>13<\/b> конфет. Проверка: 13 &minus; 4 = 9. ✓"},{"type":"mcq","topic":"Обратный ход","q":"Число разделили на 5 и получили 6. Какое это число?","opts":["11","20","30","35"],"ans":2,"hint":"Делили — значит теперь умножай.","ex":"6 × 5 = <b>30<\/b>. Проверка: 30 ÷ 5 = 6. ✓"},{"type":"open","topic":"Два действия","q":"К задуманному числу прибавили 9, потом вычли 4 и получили 15. Какое число задумали?","ans":10,"hint":"Отменяй действия с конца: сначала верни 4, потом убери 9.","ex":"15 + 4 = 19, затем 19 &minus; 9 = <b>10<\/b>. Проверка: 10 + 9 = 19, 19 &minus; 4 = 15. ✓"},{"type":"open","topic":"Два действия","q":"Задуманное число удвоили и прибавили 3 — получилось 17. Какое число задумали?","ans":7,"hint":"Последним прибавляли — значит первым вычитай.","ex":"17 &minus; 3 = 14, затем 14 ÷ 2 = <b>7<\/b>. Проверка: 7 × 2 = 14, 14 + 3 = 17. ✓"},{"type":"open","topic":"Обратный ход","q":"У Пети было 20 рублей. Он купил ручку, и у него осталось 12 рублей. Сколько рублей стоила ручка?","ans":8,"hint":"Цена — это то, что исчезло из кошелька.","ex":"20 &minus; 12 = <b>8<\/b> рублей."},{"type":"open","topic":"Два действия","q":"Задуманное число разделили на 4 и прибавили 2 — получилось 7. Какое число задумали?","ans":20,"hint":"Сначала убери прибавленную двойку, потом отмени деление.","ex":"7 &minus; 2 = 5, затем 5 × 4 = <b>20<\/b>. Проверка: 20 ÷ 4 = 5, 5 + 2 = 7. ✓"},{"type":"open","topic":"Доли и обратный ход","q":"В корзине лежали яблоки. Половину яблок съели, и осталось 8. Сколько яблок было в корзине?","ans":16,"exfig":"parts:?,8,8","hint":"Осталась ровно половина.","ex":"8 × 2 = <b>16<\/b> яблок. Проверка: половина от 16 — это 8. ✓"}]},"day13":{"intro":{"title":"Приём дня: подбирай не наугад, а по разряду","body":"<p><b>Пропущенная цифра.<\/b> Смотри на тот разряд, где всё известно, и вычисляй по нему:<\/p><div class=\"mono\">3☐ + 24 = 59\nединицы: ☐ + 4 = 9  →  ☐ = 5\nпроверка: 35 + 24 = 59 ✓<\/div><p><b>Одинаковые буквы — одинаковые цифры.<\/b> Если А + А = 14, то А = 7. Если К + К + К = 27, то К = 9.<\/p><p><b>Пропущенный знак.<\/b> Прикинь, что произошло с числом: стало намного больше — скорее всего умножение; стало меньше — вычитание или деление.<\/p><p><b>Подставляй ответ обратно.<\/b> Ребус без проверки не считается решённым.<\/p>"},"questions":[{"type":"mcq","topic":"Пропущенная цифра","q":"В примере 3☐ + 24 = 59 пропущена цифра. Какая?","opts":["3","4","5","6"],"ans":2,"hint":"Посмотри на единицы: какая цифра с четвёркой даёт 9?","ex":"В единицах ☐ + 4 = 9, значит ☐ = <b>5<\/b>. Проверка: 35 + 24 = 59. ✓"},{"type":"mcq","topic":"Пропущенный знак","q":"Какой знак надо поставить вместо звёздочки: 12 * 3 = 36?","opts":["+","−","×","÷"],"ans":2,"hint":"Число выросло втрое — это подсказка.","ex":"12 <b>×<\/b> 3 = 36. Сложение дало бы 15, вычитание 9, деление 4."},{"type":"mcq","topic":"Буквы вместо цифр","q":"Известно, что А + А = 14. Чему равно А?","opts":["5","6","7","8"],"ans":2,"hint":"Одинаковые буквы — одинаковые числа, значит это удвоение.","ex":"14 ÷ 2 = <b>7<\/b>. Проверка: 7 + 7 = 14. ✓"},{"type":"mcq","topic":"Пропущенная цифра","q":"В примере 5☐ − 18 = 35 пропущена цифра. Какая?","opts":["2","3","4","5"],"ans":1,"hint":"Найди уменьшаемое: прибавь к 35 число 18.","ex":"35 + 18 = 53, значит пропущена цифра <b>3<\/b>. Проверка: 53 &minus; 18 = 35. ✓"},{"type":"mcq","topic":"Буквы вместо цифр","q":"Известно, что Б × 4 = 20. Чему равно Б?","opts":["4","5","6","16"],"ans":1,"hint":"Умножение отменяется делением.","ex":"20 ÷ 4 = <b>5<\/b>. Проверка: 5 × 4 = 20. ✓"},{"type":"open","topic":"Пропущенная цифра","q":"В примере 4☐ + 17 = 62 пропущена цифра. Какая?","ans":5,"hint":"Найди первое слагаемое: 62 &minus; 17.","ex":"62 &minus; 17 = 45, значит пропущена <b>5<\/b>. Проверка: 45 + 17 = 62. ✓"},{"type":"open","topic":"Буквы вместо цифр","q":"Известно, что А + Б = 10 и А − Б = 4. Чему равно А?","ans":7,"exfig":"bars:Б=1;А=1+4;@total=10","hint":"Убери разницу из суммы — останутся две одинаковые части.","ex":"(10 &minus; 4) ÷ 2 = 3 — это Б. Тогда А = 3 + 4 = <b>7<\/b>. Проверка: 7 + 3 = 10 и 7 &minus; 3 = 4. ✓"},{"type":"open","topic":"Пропущенная цифра","q":"В примере ☐7 − 29 = 38 пропущена цифра. Какая?","ans":6,"hint":"Сложи 38 и 29 — получишь уменьшаемое.","ex":"38 + 29 = 67, значит пропущена <b>6<\/b>. Проверка: 67 &minus; 29 = 38. ✓"},{"type":"open","topic":"Буквы вместо цифр","q":"Известно, что К + К + К = 27. Чему равно К?","ans":9,"hint":"Три одинаковых числа дают 27.","ex":"27 ÷ 3 = <b>9<\/b>. Проверка: 9 + 9 + 9 = 27. ✓"},{"type":"open","topic":"Пропущенная цифра","q":"В примере 6 × ☐ = 48 пропущена цифра. Какая?","ans":8,"hint":"Сколько шестёрок помещается в 48?","ex":"48 ÷ 6 = <b>8<\/b>. Проверка: 6 × 8 = 48. ✓"}]},"day14":{"intro":{"title":"Проверяем приёмы второй недели","body":"<p>15 задач на всё, что разбирали: закономерности, полоски, сравнение, обратный ход и ребусы.<\/p><p>Если задача не идёт — вспомни, какой приём к ней подходит. Почти всегда помогает одно из двух: нарисовать полоски или пойти от конца.<\/p><p>После набора обязательно загляни в <a href=\"#/errors\">журнал ошибок<\/a>.<\/p>"},"questions":[{"type":"mcq","topic":"Закономерности","q":"Продолжи ряд: 4, 8, 12, 16, ?","opts":["18","20","24","32"],"ans":1,"hint":"Одинаковый шаг.","ex":"Каждый раз прибавляем 4: 16 + 4 = <b>20<\/b>."},{"type":"mcq","topic":"Растущие разности","q":"Продолжи ряд: 2, 3, 5, 8, 12, ?","opts":["15","16","17","18"],"ans":2,"hint":"Разности: 1, 2, 3, 4… Какая следующая?","ex":"Разности растут на единицу, дальше +5: 12 + 5 = <b>17<\/b>."},{"type":"mcq","topic":"Точечные фигуры","fig":"dots:1,4,9,?","q":"В ряду фигур из точек первая состоит из 1 точки, вторая из 4, третья из 9. Сколько точек в пятой фигуре?","opts":["16","20","25","30"],"ans":2,"hint":"Каждая фигура — квадрат из точек.","ex":"Пятая фигура — квадрат 5 на 5: 5 × 5 = <b>25<\/b> точек."},{"type":"mcq","topic":"Модельный метод","q":"У Кати в 2 раза больше марок, чем у Веры. Вместе у них 21 марка. Сколько марок у Веры?","opts":["5","6","7","14"],"ans":2,"exfig":"bars:Вера=1;Катя=2;@total=21","hint":"Вера — 1 доля, Катя — 2 доли.","ex":"Всего 3 доли: 21 ÷ 3 = <b>7<\/b> марок у Веры, у Кати 14. Проверка: 7 + 14 = 21. ✓"},{"type":"mcq","topic":"Кратное сравнение","q":"Во сколько раз 35 больше, чем 7?","opts":["В 4 раза","В 5 раз","В 7 раз","На 28"],"ans":1,"hint":"«Во сколько раз» — деление.","ex":"35 ÷ 7 = 5, значит <b>в 5 раз<\/b>."},{"type":"mcq","topic":"Обратный ход","q":"Из задуманного числа вычли 6 и получили 14. Какое число задумали?","opts":["8","18","20","22"],"ans":2,"hint":"Вычитали — теперь прибавляй.","ex":"14 + 6 = <b>20<\/b>. Проверка: 20 &minus; 6 = 14. ✓"},{"type":"mcq","topic":"Числовые ребусы","q":"В примере 2☐ + 35 = 61 пропущена цифра. Какая?","opts":["4","5","6","7"],"ans":2,"hint":"Найди первое слагаемое: 61 &minus; 35.","ex":"61 &minus; 35 = 26, значит пропущена <b>6<\/b>. Проверка: 26 + 35 = 61. ✓"},{"type":"mcq","topic":"Разностное сравнение","q":"У Вани 23 марки, а у Пети на 8 марок меньше. Сколько марок у Пети?","opts":["13","15","17","31"],"ans":1,"hint":"«На 8 меньше» — вычитаем.","ex":"23 &minus; 8 = <b>15<\/b> марок."},{"type":"open","topic":"Закономерности","q":"Продолжи ряд: 1, 3, 9, ?","ans":27,"hint":"Разности не одинаковые — посмотри, во сколько раз растут числа.","ex":"Каждое число втрое больше предыдущего: 9 × 3 = <b>27<\/b>."},{"type":"open","topic":"Лесенки","q":"Лесенка сложена из столбиков по 1, 2, 3, 4 и 5 кубиков. Сколько всего кубиков в лесенке?","ans":15,"exfig":"stairs:1,2,3,4,5","hint":"Складывай парами с краёв: 1 + 5, 2 + 4, а тройка останется одна.","ex":"(1 + 5) + (2 + 4) + 3 = 6 + 6 + 3 = <b>15<\/b> кубиков."},{"type":"open","topic":"Разностное сравнение","q":"На сколько 75 больше, чем 39?","ans":36,"hint":"Вычитание.","ex":"75 &minus; 39 = <b>36<\/b>."},{"type":"open","topic":"Кратное сравнение","q":"У Оли 28 наклеек, а у Кати в 4 раза меньше. Сколько наклеек у Кати?","ans":7,"hint":"«В 4 раза меньше» — деление.","ex":"28 ÷ 4 = <b>7<\/b> наклеек."},{"type":"open","topic":"Обратный ход","q":"Задуманное число умножили на 5, потом вычли 4 — получилось 26. Какое число задумали?","ans":6,"hint":"Отменяй с конца: сначала верни 4, потом раздели.","ex":"26 + 4 = 30, затем 30 ÷ 5 = <b>6<\/b>. Проверка: 6 × 5 = 30, 30 &minus; 4 = 26. ✓"},{"type":"open","topic":"Часть и целое","q":"В двух вазах вместе 45 цветов, в первой вазе 18. Сколько цветов во второй?","ans":27,"exfig":"parts:45,18,?","hint":"Из целого вычти известную часть.","ex":"45 &minus; 18 = <b>27<\/b> цветов."},{"type":"open","topic":"Фигурные ряды","q":"Сколько спичек нужно, чтобы выложить в ряд 6 квадратов с общими сторонами (первый квадрат — 4 спички, каждый следующий — ещё 3)?","ans":19,"hint":"После первого квадрата остаётся пять.","ex":"4 + 3 × 5 = 4 + 15 = <b>19<\/b> спичек."}]},"day15":{"intro":{"title":"Приём дня: деньги — это тот же счёт","body":"<p><b>Сколько всего денег.<\/b> Считай по видам монет и складывай:<\/p><div class=\"mono\">3 монеты по 10 р  →  30 р\n4 монеты по  5 р  →  20 р\nвсего            →  50 р<\/div><p><b>Сдача<\/b> — это то, что осталось: из денег вычитаем цену.<\/p><p><b>Несколько одинаковых покупок<\/b> — умножение: 4 мороженых по 25 рублей стоят 25 × 4 = 100 рублей.<\/p><p><b>Сколько штук можно купить<\/b> — деление: на 45 рублей карандашей по 9 рублей выйдет 45 ÷ 9 = 5 штук.<\/p><p><b>Осторожно с вопросом.<\/b> Иногда спрашивают не цену покупки, а сдачу — подчеркни вопрос карандашом, прежде чем считать.<\/p>"},"questions":[{"type":"mcq","topic":"Сколько денег","q":"У Кати 3 монеты по 10 рублей и 4 монеты по 5 рублей. Сколько у неё денег?","opts":["35 рублей","45 рублей","50 рублей","70 рублей"],"ans":2,"hint":"Посчитай отдельно десятки и пятёрки, потом сложи.","ex":"10 × 3 = 30 р, 5 × 4 = 20 р. Вместе 30 + 20 = <b>50 рублей<\/b>."},{"type":"mcq","topic":"Сдача","q":"Игрушка стоит 78 рублей. Сколько рублей сдачи получит покупатель со 100 рублей?","opts":["12","22","28","32"],"ans":1,"hint":"Сдача — это разность между деньгами и ценой.","ex":"100 &minus; 78 = <b>22<\/b> рубля."},{"type":"mcq","topic":"Сколько денег","q":"Сколько рублей в семи монетах по 5 рублей?","opts":["12","25","35","40"],"ans":2,"hint":"По 5 рублей взяли 7 раз.","ex":"5 × 7 = <b>35<\/b> рублей."},{"type":"mcq","topic":"Сравнение покупок","q":"Что дороже: три ручки по 12 рублей или две тетради по 19 рублей?","opts":["Ручки","Тетради","Одинаково","Сравнить нельзя"],"ans":1,"hint":"Посчитай обе покупки полностью и сравни.","ex":"Ручки: 12 × 3 = 36 р. Тетради: 19 × 2 = 38 р. Дороже <b>тетради<\/b>."},{"type":"mcq","topic":"Покупка нескольких","q":"Сколько рублей стоят четыре мороженых по 25 рублей?","opts":["75","90","100","125"],"ans":2,"hint":"Четыре раза по 25 — это две полусотни.","ex":"25 × 4 = <b>100<\/b> рублей."},{"type":"open","topic":"Покупка","q":"Блокнот стоит 35 рублей, а ручка 18 рублей. Сколько рублей стоят блокнот и ручка вместе?","ans":53,"hint":"Обычное сложение.","ex":"35 + 18 = <b>53<\/b> рубля."},{"type":"open","topic":"Сдача","q":"У Пети было 100 рублей. Он купил два сока по 32 рубля. Сколько рублей у него осталось?","ans":36,"hint":"Сначала посчитай, сколько стоили оба сока.","ex":"Соки: 32 × 2 = 64 р. Осталось 100 &minus; 64 = <b>36<\/b> рублей."},{"type":"open","topic":"Сколько монет","q":"Сколько монет по 2 рубля нужно, чтобы набрать 18 рублей?","ans":9,"hint":"Сколько двоек помещается в 18?","ex":"18 ÷ 2 = <b>9<\/b> монет."},{"type":"open","topic":"Сколько штук","q":"Карандаш стоит 9 рублей. Сколько таких карандашей можно купить на 45 рублей?","ans":5,"hint":"Деление: сколько раз цена помещается в деньгах.","ex":"45 ÷ 9 = <b>5<\/b> карандашей."},{"type":"open","topic":"Сколько денег","q":"У Маши пять монет: три по 10 рублей и две по 2 рубля. Сколько у неё всего денег?","ans":34,"hint":"Считай по видам монет.","ex":"10 × 3 = 30 р, 2 × 2 = 4 р. Вместе 30 + 4 = <b>34<\/b> рубля."}]},"day16":{"intro":{"title":"Приём дня: время считаем шагами","body":"<div class=\"mono\">1 час  = 60 минут\n1 сутки = 24 часа\n1 неделя = 7 дней<\/div><p><b>Сколько времени прошло.<\/b> Шагай до круглого часа, а потом дальше:<\/p><div class=\"mono\">от 10:45 до 11:30\n10:45 → 11:00 — это 15 мин\n11:00 → 11:30 — это 30 мин\nвсего 45 минут<\/div><p><b>Дни недели.<\/b> Через 7 дней всегда тот же день недели. Поэтому «через 10 дней» — это то же, что «через 3 дня»: семь дней отбрасываем.<\/p><p><b>Уроки и перемены.<\/b> Складывай всё подряд: урок, перемена, урок — ничего не пропуская.<\/p>"},"questions":[{"type":"mcq","topic":"Часы и минуты","q":"Сколько минут в двух часах?","opts":["100","110","120","200"],"ans":2,"hint":"В одном часе 60 минут.","ex":"60 × 2 = <b>120<\/b> минут."},{"type":"mcq","topic":"Сколько времени прошло","q":"Фильм начался в 15:20 и шёл 30 минут. Во сколько он закончился?","opts":["15:40","15:50","16:00","16:20"],"ans":1,"hint":"Прибавь 30 минут к 20 минутам — до нового часа ещё далеко.","ex":"15:20 + 30 мин = <b>15:50<\/b>."},{"type":"mcq","topic":"Дни недели","q":"Сегодня вторник. Какой день недели будет через 3 дня?","opts":["Четверг","Пятница","Суббота","Воскресенье"],"ans":1,"hint":"Считай по дням: среда, четверг…","ex":"Среда, четверг, <b>пятница<\/b>."},{"type":"mcq","topic":"Сколько времени прошло","q":"Сколько часов проходит от 9 часов утра до 3 часов дня?","opts":["4","5","6","7"],"ans":2,"hint":"Три часа дня — это 15 часов.","ex":"15 &minus; 9 = <b>6<\/b> часов."},{"type":"mcq","topic":"Уроки и перемены","q":"Урок длится 40 минут, перемена — 10 минут. Сколько минут пройдёт от начала первого урока до конца второго?","opts":["80","90","100","110"],"ans":1,"hint":"Урок, перемена, урок — сложи всё.","ex":"40 + 10 + 40 = <b>90<\/b> минут."},{"type":"open","topic":"Часы и минуты","q":"Сколько минут в половине часа?","ans":30,"hint":"Половина от 60 минут.","ex":"60 ÷ 2 = <b>30<\/b> минут."},{"type":"open","topic":"Сколько времени прошло","q":"Сколько минут проходит от 10:45 до 11:30?","ans":45,"hint":"Сначала дойди до 11:00, потом считай дальше.","ex":"От 10:45 до 11:00 — 15 минут, от 11:00 до 11:30 — 30 минут. Всего <b>45<\/b> минут."},{"type":"open","topic":"Календарь","q":"Сегодня 12 марта. Какое число будет через 10 дней?","ans":22,"hint":"В марте 31 день, так что месяц не сменится.","ex":"12 + 10 = <b>22<\/b> марта."},{"type":"open","topic":"Календарь","q":"В марте 31 день, и первое марта — понедельник. Сколько понедельников в этом марте?","ans":5,"hint":"Понедельники идут через каждые 7 дней: 1, 8, 15…","ex":"Понедельники — 1, 8, 15, 22 и 29 марта. Всего <b>5<\/b>."},{"type":"open","topic":"Часы и минуты","q":"Мультфильм идёт 15 минут. Сколько таких мультфильмов можно посмотреть за 1 час?","ans":4,"hint":"Сколько раз 15 минут помещается в 60?","ex":"60 ÷ 15 = <b>4<\/b> мультфильма."}]},"day17":{"intro":{"title":"Приём дня: сначала приведи к одним единицам","body":"<div class=\"mono\">1 м  = 100 см      1 кг = 1000 г\n1 дм =  10 см      1 л  = 1000 мл<\/div><p><b>Сравнивать можно только одинаковое.<\/b> Что тяжелее, 3 кг или 2500 г? Переводим: 3 кг = 3000 г, и теперь видно, что 3000 больше 2500.<\/p><p><b>Из больших единиц в маленькие — умножаем<\/b> (метры в сантиметры ×100), <b>из маленьких в большие — делим<\/b> (граммы в килограммы ÷1000).<\/p><p><b>Весы в равновесии<\/b> означают, что слева и справа одинаковый вес. Если 2 арбуза уравновешивают 8 дынь, то один арбуз — это 4 дыни.<\/p>"},"questions":[{"type":"mcq","topic":"Длина","q":"Сколько сантиметров в 3 метрах?","opts":["30","130","300","3000"],"ans":2,"hint":"В одном метре 100 сантиметров.","ex":"100 × 3 = <b>300 см<\/b>."},{"type":"mcq","topic":"Масса","q":"Что тяжелее: 3 кг или 2500 г?","opts":["3 кг","2500 г","Одинаково","Сравнить нельзя"],"ans":0,"hint":"Переведи килограммы в граммы.","ex":"<b>3 кг<\/b> = 3000 г, а 3000 г больше 2500 г."},{"type":"mcq","topic":"Объём","q":"В банке 2 литра сока. Сколько это миллилитров?","opts":["200","1200","2000","20000"],"ans":2,"hint":"В одном литре 1000 миллилитров.","ex":"1000 × 2 = <b>2000 мл<\/b>."},{"type":"mcq","topic":"Длина","q":"Длина карандаша 12 см, а ручки 15 см. На сколько сантиметров ручка длиннее карандаша?","opts":["2","3","4","27"],"ans":1,"hint":"«На сколько длиннее» — вычитание.","ex":"15 &minus; 12 = <b>3 см<\/b>."},{"type":"mcq","topic":"Масса","q":"Сколько килограммов в 4000 граммах?","opts":["4","40","400","4000"],"ans":0,"hint":"Из граммов в килограммы — делим на 1000.","ex":"4000 ÷ 1000 = <b>4 кг<\/b>."},{"type":"open","topic":"Длина","q":"Сколько сантиметров в 5 метрах?","ans":500,"hint":"По 100 см пять раз.","ex":"100 × 5 = <b>500 см<\/b>."},{"type":"open","topic":"Масса","q":"В одном пакете 2 кг муки. Сколько килограммов муки в шести таких пакетах?","ans":12,"hint":"По 2 кг взяли 6 раз.","ex":"2 × 6 = <b>12 кг<\/b>."},{"type":"open","topic":"Длина","q":"Верёвку длиной 90 см разрезали на 3 равные части. Какой длины каждая часть в сантиметрах?","ans":30,"exfig":"parts:90 см,30,30,30","hint":"Поровну на три части — деление.","ex":"90 ÷ 3 = <b>30 см<\/b>."},{"type":"open","topic":"Весы","fig":"balance:2 арбуза,8 дынь","q":"На одной чаше весов лежат 2 арбуза, на другой — 8 дынь, весы в равновесии. Один арбуз весит 4 кг. Сколько килограммов весит одна дыня?","ans":1,"hint":"Сначала узнай, сколько весят все дыни вместе.","ex":"Два арбуза весят 4 × 2 = 8 кг, столько же весят 8 дынь. Значит одна дыня — 8 ÷ 8 = <b>1 кг<\/b>."},{"type":"open","topic":"Объём","q":"В бутылке 500 мл воды. Сколько таких бутылок нужно, чтобы набрать 3 литра?","ans":6,"hint":"Переведи литры в миллилитры: 3 л = 3000 мл.","ex":"3000 ÷ 500 = <b>6<\/b> бутылок."}]},"day18":{"intro":{"title":"Приём дня: периметр — это забор вокруг фигуры","body":"<p><b>Периметр<\/b> — сумма длин всех сторон. У квадрата все стороны равны, поэтому периметр = сторона × 4. У прямоугольника периметр = (длина + ширина) × 2.<\/p><div class=\"mono\">квадрат со стороной 5 см\n5 + 5 + 5 + 5 = 20 см\nили 5 × 4 = 20 см<\/div><p><b>Обратный вопрос.<\/b> Периметр квадрата 24 см → сторона 24 ÷ 4 = 6 см.<\/p><p><b>Сколько сторон — столько и углов.<\/b> У треугольника 3 и 3, у четырёхугольника 4 и 4, у шестиугольника 6 и 6.<\/p><p><b>Ось симметрии<\/b> — линия, по которой фигуру можно сложить пополам так, чтобы половинки совпали. У квадрата таких линий 4, у равностороннего треугольника 3, у круга их бесконечно много.<\/p>"},"questions":[{"type":"mcq","topic":"Периметр","fig":"rect:5 см,5 см","q":"Чему равен периметр квадрата со стороной 5 см?","opts":["10 см","15 см","20 см","25 см"],"ans":2,"hint":"У квадрата четыре одинаковые стороны.","ex":"5 × 4 = <b>20 см<\/b>."},{"type":"mcq","topic":"Периметр","fig":"rect:6 см,3 см","q":"Чему равен периметр прямоугольника со сторонами 6 см и 3 см?","opts":["9 см","12 см","18 см","24 см"],"ans":2,"hint":"У прямоугольника противоположные стороны равны — каждая сторона считается дважды.","ex":"(6 + 3) × 2 = 9 × 2 = <b>18 см<\/b>."},{"type":"mcq","topic":"Симметрия","q":"У какой из фигур ровно 4 оси симметрии?","opts":["Прямоугольник","Квадрат","Равносторонний треугольник","Круг"],"ans":1,"exfig":"sym:square","hint":"Складывай фигуру мысленно пополам: сколько линий подойдёт?","ex":"У <b>квадрата<\/b> четыре оси: две через середины сторон и две диагонали. У прямоугольника их только две, у треугольника три, у круга бесконечно много."},{"type":"mcq","topic":"Стороны и углы","q":"Сколько всего сторон у треугольника и четырёхугольника вместе?","opts":["6","7","8","9"],"ans":1,"hint":"Название фигуры подсказывает число сторон.","ex":"3 + 4 = <b>7<\/b> сторон."},{"type":"mcq","topic":"Симметрия","q":"Сколько осей симметрии у круга?","opts":["1","2","4","Бесконечно много"],"ans":3,"exfig":"sym:circle","hint":"Подумай, по скольким линиям можно сложить круг пополам.","ex":"Круг складывается пополам по любой прямой, проходящей через центр, — таких линий <b>бесконечно много<\/b>."},{"type":"open","topic":"Периметр","q":"Периметр квадрата равен 24 см. Чему равна его сторона в сантиметрах?","ans":6,"hint":"Периметр состоит из четырёх одинаковых сторон.","ex":"24 ÷ 4 = <b>6 см<\/b>."},{"type":"open","topic":"Периметр","fig":"rect:7 см,2 см","q":"Стороны прямоугольника равны 7 см и 2 см. Чему равен его периметр в сантиметрах?","ans":18,"hint":"Сложи длину и ширину, а потом удвой.","ex":"(7 + 2) × 2 = <b>18 см<\/b>."},{"type":"open","topic":"Стороны и углы","q":"У фигуры 6 сторон. Сколько у неё углов?","ans":6,"hint":"Сторон и углов у многоугольника поровну.","ex":"Сколько сторон — столько и углов: <b>6<\/b>."},{"type":"open","topic":"Периметр","q":"Че
