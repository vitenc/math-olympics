  }
  function wedge(cx, cy, r, i, n, c) {
    var a0 = (-90 + 360 * i / n) * Math.PI / 180, a1 = (-90 + 360 * (i + 1) / n) * Math.PI / 180;
    var x0 = (cx + r * Math.cos(a0)).toFixed(1), y0 = (cy + r * Math.sin(a0)).toFixed(1);
    var x1 = (cx + r * Math.cos(a1)).toFixed(1), y1 = (cy + r * Math.sin(a1)).toFixed(1);
    return '<path d="M' + cx + ' ' + cy + ' L' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' + (360 / n > 180 ? 1 : 0) +
           ' 1 ' + x1 + ' ' + y1 + ' Z" class="' + c + '"/>';

  function pizza(n, k) {

    h += X(4, 26, 'A', 'b') + R(x, 12, 2 * u, 20, 'f1') + X(x + 2 * u + 8, 27, '2', 'sm');
    h += X(4, 54, 'B', 'b') + R(x, 40, 3 * u, 20, 'f1') + X(x + 3 * u + 8, 55, en ? '3 (smallest above 2)' : '3 (меньше нельзя)', 'sm');

    return [[svg(250, 94, h), en ? 'Make the others as small as the rules allow — the rest goes to C' : 'Остальные — как можно меньше по условиям, всё остальное достаётся C']];
  };

  PIC.order = function (en) {
    // над знаками — номера шагов: сначала умножение, потом слева направо
    var h = X(130, 44, '20  −  3 × 4  +  6', 'b mid');
    h += C(128, 16, 10, 'f2') + X(128, 20, '1', 'sm mid');
    h += C(84, 16, 10, 'f1') + X(84, 20, '2', 'sm mid');
    h += C(175, 16, 10, 'f1') + X(175, 20, '3', 'sm mid');
    h += L(104, 52, 152, 52, 'fence');
    h += X(130, 76, '20 − 12 + 6 = 8 + 6 = 14', 'sm mid');
    return [[svg(260, 84, h), en ? 'Step 1 — the multiplication, then left to right' : 'Шаг 1 — умножение, потом слева направо']];
  };

  PIC.steps = function (en) {
    var b = [['3 × 18', '54'], ['54 + 25', '79'], ['100 − 79', '21']], h = '', i;
    for (i = 0; i < 3; i++) {
      var x = 6 + i * 92;
      h += R(x, 8, 76, 40, i === 2 ? 'f2' : 'f1') + X(x + 38, 25, b[i][0], 'sm mid') + X(x + 38, 42, '= ' + b[i][1], 'b mid');
      if (i < 2) h += arrow(x + 78, 28, x + 90);

  PIC.missing = function (en) {
    var h = X(130, 22, '7 × □ − 14 = 35', 'b mid');
    h += R(8, 40, 44, 26, 'f1') + X(30, 58, '35', 'b mid') + arrow(54, 53, 96) + X(75, 46, '+14', 'sm mid accent') +
         R(98, 40, 44, 26, 'f1') + X(120, 58, '49', 'b mid') + arrow(144, 53, 186) + X(165, 46, '÷7', 'sm mid accent') +
         R(188, 40, 44, 26, 'f2') + X(210, 58, '7', 'b mid');
    return [[svg(244, 74, h), en ? 'Undo from the end: −14 becomes +14, ×7 becomes ÷7' : 'Отменяем с конца: −14 → +14, ×7 → ÷7']];
  };

  PIC.crypt = function (en) {
    var h = X(96, 18, '1', 'sm accent') +
      X(110, 34, 'А', 'b mid') + X(110, 54, 'А', 'b mid') + X(110, 74, 'А', 'b mid') + X(76, 54, '+', 'b mid') +
      L(70, 82, 130, 82) + X(92, 102, 'Б', 'b mid') + X(110, 102, 'А', 'b mid');
    h += X(150, 44, en ? '3 × A ends in A' : '3 × А оканчивается на А', 'sm') + X(150, 64, '→ А = 5', 'sm accent') + X(150, 84, '15 → Б = 1', 'sm accent');
    return [[svg(290, 110, h), en ? 'Start with the ones column — and remember the carry' : 'Начинай с единиц — и не забудь перенос']];
  };

  PIC.truth = function (en) {
    var who = en ? ['Anya', 'Borya', 'Vera'] : ['Аня', 'Боря', 'Вера'], m = [['✗', '✓', '✓'], ['✓', '✗', '✓'], ['✓', '✗', '✗']],
        h = X(6, 18, en ? 'if it was…' : 'если взял(а)…', 'sm'), i, j;
    for (j = 0; j < 3; j++) h += X(118 + j * 34, 18, who[j].charAt(0) + ':', 'sm mid');
    h += X(222, 18, en ? 'true' : 'правд', 'sm mid');
    for (i = 0; i < 3; i++) {
      var y = 26 + i * 26, good = i === 2;
      h += R(2, y, 250, 26, good ? 'f3' : 'none') + X(10, y + 18, who[i]);
      for (j = 0; j < 3; j++) h += X(118 + j * 34, y + 18, m[i][j], 'b mid');

  PIC.look = function (en) {
    function house(x, win, door, chim, mark) {

      h += R(x + (door ? 10 : 32), 48, 10, 10, 'none');

    return [[svg(290, 100, house(4, 2, true, true, '') + L(70, 10, 70, 90, 'dash') + house(80, 1, true, true, '✗') +
        house(148, 2, false, true, '✗') + house(216, 2, true, true, '✓')),
      en ? 'Check one detail at a time: windows, then the door, then the chimney' : 'Проверяй по одной детали: окна, потом дверь, потом труба']];
  };

  /* ---------------- разметка ---------------- */

  var UI = {
    ru: { btn: '🤔 Мне непонятно — объясни', idea: 'Главная идея', steps: 'Как действовать',
          ex: 'Разберём пример', ans: 'Ответ', trap: 'Частая ошибка', then: 'Теперь попробуй свою задачу тем же способом.' },
    en: { btn: '🤔 I don’t get it — explain', idea: 'The main idea', steps: 'What to do',
          ex: 'A worked example', ans: 'Answer', trap: 'A common mistake', then: 'Now try your problem the same way.' }
  };

  function langOf(lang) {
    if (lang === 'en' || lang === 'ru') return lang;
    return (window.I18N && window.I18N.lang === 'en') ? 'en' : 'ru';
  }

  function keyFor(q) {
    if (!q) return null;
    if (q.theory && LIB[q.theory]) return q.theory;
    if (q.topic && TOPIC[q.topic]) return TOPIC[q.topic];
    if (q.en && q.en.topic && TOPIC[q.en.topic]) return TOPIC[q.en.topic];
    return null;
  }

  function li(arr) { return arr.map(function (s) { return '<li>' + s + '</li>'; }).join(''); }

  function html(key, lang) {
    var L = langOf(lang);
    var e = LIB[key] && LIB[key][L];
    if (!e) return '';
    var u = UI[L];
    var pics = PIC[key] ? PIC[key](L === 'en') : [];
    return '<div class="th-title">📘 ' + e.t + '</div>' +
      '<p class="th-idea"><b>' + u.idea + '.</b> ' + e.idea + '</p>' +
      (pics.length ? '<div class="th-pics">' + pics.map(function (p) {
        return '<figure class="th-fig">' + p[0] + '<figcaption>' + p[1] + '</figcaption></figure>';
      }).join('') + '</div>' : '') +
      '<div class="th-h">' + u.steps + '</div><ol class="th-steps">' + li(e.steps) + '</ol>' +
      '<div class="th-h">' + u.ex + '</div>' +
      '<div class="th-ex"><p class="th-q">' + e.ex.q + '</p><ol>' + li(e.ex.s) + '</ol>' +
        '<p class="th-a"><b>' + u.ans + ':</b> ' + e.ex.a + '</p></div>' +
      (e.trap ? '<p class="th-trap">⚠️ <b>' + u.trap + ':</b> ' + e.trap + '</p>' : '') +
      '<p class="th-then">' + u.then + '</p>';
  }

  function forQuestion(q, lang) {
    var k = keyFor(q);
    return k ? html(k, lang) : '';
  }

  /* Стили свои: блок живёт и в многостраничной версии (quiz.css), и в
     одностраничной сборке, и в Android-приложении. Цвета берутся из
     переменных страницы, если они есть. */
  var CSS =
    '.theory{display:none;margin-top:.6rem;padding:.75rem .9rem;border-radius:10px;' +
      'background:var(--theory-bg,#eef4fb);border:1px solid var(--theory-line,#cfe0ee);' +
      'border-left:4px solid var(--theory-ink,#2980b9);font-size:.9rem;line-height:1.5;color:var(--ink,inherit)}' +
    '.theory.vis{display:block}' +
    '.theory .th-title{font-weight:800;font-size:1rem;margin-bottom:.35rem;color:var(--theory-ink,#2980b9)}' +
    '.theory .th-h{font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;' +
      'margin:.55rem 0 .2rem;color:var(--theory-ink,#2980b9)}' +
    '.theory ol{padding-left:1.3rem;margin:0}' +
    '.theory li{margin:.15rem 0}' +
    '.theory .th-ex{background:var(--card-sunk,rgba(255,255,255,.6));border-radius:8px;padding:.5rem .7rem}' +
    '.theory .th-q{font-weight:700;margin-bottom:.25rem}' +
    '.theory .th-a{margin-top:.3rem}' +
    '.theory .th-trap{margin-top:.55rem}' +
    '.theory .th-then{margin-top:.5rem;font-weight:700}' +
    '.theory-btn{border-color:var(--theory-ink,#2980b9)!important;color:var(--theory-ink,#2980b9)!important}' +
    '.theory .th-pics{display:flex;flex-wrap:wrap;gap:.6rem 1rem;justify-content:center;margin:.6rem 0 .2rem}' +
    '.theory .th-fig{margin:0;text-align:center;max-width:100%;flex:0 1 auto}' +
    '.theory .th-fig svg{max-width:100%;height:auto;display:block;margin:0 auto;overflow:visible}' +
    '.theory figcaption{font-size:.8rem;font-weight:700;max-width:17rem;margin:.25rem auto 0;opacity:.85}' +
    '.theory svg text{fill:currentColor;font:600 13px system-ui,sans-serif}' +
    '.theory svg .b{font-weight:800;font-size:15px}' +
    '.theory svg .sm{font-size:11.5px}' +
    '.theory svg .mid{text-anchor:middle}' +
    '.theory svg .emo{font-size:18px}' +
    '.theory svg .accent{fill:var(--theory-accent,#d35400)}' +
    '.theory svg .ln{stroke:currentColor;stroke-width:1.6;fill:none}' +
    '.theory svg .thin{stroke-width:1}' +
    '.theory svg .hair{stroke:currentColor;stroke-width:.8;opacity:.35}' +
    '.theory svg .solid{fill:currentColor;stroke:none}' +
    '.theory svg .none{fill:none;stroke:currentColor;stroke-width:1.6}' +
    '.theory svg .round{rx:10px}' +
    '.theory svg .f1{fill:rgba(41,128,185,.28);stroke:currentColor;stroke-width:1.4}' +
    '.theory svg .f2{fill:rgba(230,126,34,.45);stroke:currentColor;stroke-width:1.4}' +
    '.theory svg .f3{fill:rgba(39,174,96,.35);stroke:currentColor;stroke-width:1.4}' +
    '.theory svg .faint{fill:rgba(41,128,185,.10);stroke-opacity:.35}' +
    '.theory svg .see{fill-opacity:.55}' +
    '.theory svg .ghost{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 3}' +
    '.theory svg .fence{fill:none;stroke:var(--theory-accent,#d35400);stroke-width:3.5;stroke-dasharray:7 4}' +
    '.theory svg .dash{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:5 4}' +
    '.theory svg .axis{stroke:var(--theory-accent,#d35400);stroke-width:1.8;stroke-dasharray:6 4}' +
    '.theory svg .accentl{stroke:var(--theory-accent,#d35400)}' +
    '.theory svg .match{stroke:#c0843a;stroke-width:4.5;stroke-linecap:round}' +
    '.theory svg .dough{fill:#f6dca0;stroke:#b07a2a;stroke-width:1.2}' +
    '.theory svg .sauce{fill:#e0664f;stroke:#b07a2a;stroke-width:1.2}' +
    '.theory svg .pep{fill:#a93226;stroke:none}' +
    '.theory svg .crust{fill:none;stroke:#c0843a;stroke-width:4}' +
    '.theory svg .ring{fill:none;stroke:var(--theory-accent,#d35400);stroke-width:2.5;stroke-dasharray:4 3}' +
    '.theory svg .cR{fill:#e74c3c;stroke:currentColor}.theory svg .cB{fill:#3498db;stroke:currentColor}' +
    '.theory svg .cY{fill:#f1c40f;stroke:currentColor}.theory svg .cG{fill:#2ecc71;stroke:currentColor}' +
    '';

  if (typeof document !== 'undefined' && !document.getElementById('theory-css')) {
    var st = document.createElement('style');
    st.id = 'theory-css';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  var api = {
    keyFor: keyFor,
    html: html,
    forQuestion: forQuestion,
    label: function (lang) { return UI[langOf(lang)].btn; },
    keys: function () { return Object.keys(LIB); },
    topics: TOPIC,
    css: CSS

  if (typeof window !== 'undefined') window.SASMO_THEORY = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

<script>
/* eslint-disable */
(function () {
  'use strict';

  var D = window.SASMO_DATA;
  // Теория к приёму задачи (assets/theory.js вклеивается при сборке)
  var THEORY = window.SASMO_THEORY || null;
  var FIG = window.SASMO_FIG || { forQuestion: function () { return ''; },
                                  forExplain: function () { return ''; } };
  var app = document.getElementById('app');
  var rail = document.getElementById('rail');
  var barExtra = document.getElementById('bar-extra');

  /* ---------------------------------------------------------------- состояние */

  var state = { days: {}, errors: [], updatedAt: 0 };
  // Ключ приходит из сборки: у второго и третьего класса он разный,
  // за тренажёром сидят разные дети.
  var LKEY = D.key || 'sasmo.month.v1';
  var dbDoc = null;              // документ базы артефакта, если она доступна
  var saveTimer = null;

  function normalize(raw) {
    if (!raw || typeof raw !== 'object') return { days: {}, errors: [], updatedAt: 0 };
    return {
      days: raw.days && typeof raw.days === 'object' ? raw.days : {},
      errors: Array.isArray(raw.errors) ? raw.errors : [],
      updatedAt: typeof raw.updatedAt === 'number' ? raw.updatedAt : 0
    };
  }

  function readLocal() {
    try { return normalize(JSON.parse(localStorage.getItem(LKEY))); }
    catch (e) { return null; }
  }

  function writeLocal() {
    try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {}
  }

  function save() {
    state.updatedAt = Date.now();
    writeLocal();
    if (!dbDoc) return;
    // База переживает закрытие вкладки и синхронизирует планшет с ноутбуком.
    // Пишем с задержкой, чтобы серия ответов не превратилась в серию записей.
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      dbDoc.set({ days: state.days, errors: state.errors, updatedAt: state.updatedAt })
           .catch(function () {});
    }, 900);
  }

  function saveNow() {
    state.updatedAt = Date.now();
    writeLocal();
    if (!dbDoc) return;
    clearTimeout(saveTimer);
    dbDoc.set({ days: state.days, errors: state.errors, updatedAt: state.updatedAt })
         .catch(function () {});
  }

  // База отвечает не сразу (а иногда не отвечает вовсе), поэтому страница
  // сначала рисуется из localStorage и лишь потом догоняет общий прогресс.
  function connect() {
    if (typeof claude === 'undefined' || !claude || typeof claude.use !== 'function') return;
    claude.use('db').then(function (db) {
      if (!db) return;
      var doc = db.doc(D.grade === 2 ? 'progress/g2' : 'progress/state');
      return doc.get().then(function (snap) {
        var remote = snap && snap.data ? normalize(snap.data) : null;
        dbDoc = doc;
        if (remote && remote.updatedAt > state.updatedAt) {
          state = remote;
          writeLocal();
          render();
        } else if (state.updatedAt > 0) {
          saveNow();
        }
        doc.onSnapshot(function (s) {
          if (!s || !s.data) return;
          var inc = normalize(s.data);
          if (inc.updatedAt <= state.updatedAt) return;
          state = inc;
          writeLocal();
          if (!activeSet) render();     // не выдёргиваем набор из-под ребёнка
        });
        syncNote(true);
      });
    }).catch(function () {});
  }

  function syncNote(connected) {
    var el = document.getElementById('syncline');
    if (el) el.innerHTML = connected
      ? 'Прогресс сохраняется <b>в этой странице</b> — он один и тот же на планшете и на компьютере.'
      : 'Прогресс сохраняется <b>в этом браузере</b>.';
  }

  /* ------------------------------------------------------------- журнал ошибок */

  function rememberError(setId, idx, q) {
    var key = setId + '#' + idx;
    for (var i = 0; i < state.errors.length; i++) if (state.errors[i].key === key) return;
    state.errors.push({
      key: key, setId: setId, idx: idx, ts: Date.now(),
      type: q.type, q: q.q, opts: q.opts, ans: q.ans,
      hint: q.hint, ex: q.ex, topic: q.topic, theory: q.theory,
      fig: q.fig, exfig: q.exfig, img: q.img
    });
  }

  function forgetError(key) {
    state.errors = state.errors.filter(function (e) { return e.key !== key; });
  }

  /* -------------------------------------------------- прогресс внутри набора */

  /* Ответ сохраняется сразу, а не в конце занятия: ребёнок может решить
     пять задач, закрыть страницу и вернуться к остальным вечером. */

  function recFor(setId) {
    var rec = state.days[setId];
    if (!rec || typeof rec !== 'object') rec = state.days[setId] = {};
    if (!rec.answers || typeof rec.answers !== 'object') rec.answers = {};
    return rec;
  }

  function answeredCount(rec) {
    return rec && rec.answers ? Object.keys(rec.answers).length : 0;
  }

  function noteAnswer(setId, i, given, good, total) {
    // журнал ошибок перетасовывается после каждого захода — там номера не значат ничего
    if (setId === 'errors') { save(); return; }

    var rec = recFor(setId);
    rec.answers[i] = { g: given === undefined ? null : given, ok: !!good };
    rec.total = total;
    rec.ok = 0;
    rec.no = 0;
    Object.keys(rec.answers).forEach(function (k) {
      if (rec.answers[k].ok) rec.ok++; else rec.no++;
    });
    rec.date = today();
    save();
  }

  /* Сброс одного дня: и его результат, и его задачи в журнале ошибок. */
  function resetDay(setId) {
    delete state.days[setId];
    state.errors = state.errors.filter(function (e) { return e.setId !== setId; });
    saveNow();
  }

  function saveExam(S) {
    if (!S || S.mode !== 'exam' || S.finished) return;
    var rec = recFor(S.setId);
    rec.exam = {
      given: S.questions.map(function (q, i) {
        if (q.type !== 'open') return S.given[i];
        var inp = document.getElementById('in' + i);
        return inp ? inp.value : null;
      }),
      left: S.left,
      at: Date.now()
    };
    rec.total = S.questions.length;
    save();
  }

  /* Сброс — действие необратимое, поэтому просим нажать дважды. */
  function armReset(btn, done) {
    if (btn.dataset.armed === '1') {
      btn.dataset.armed = '0';
      done();
      return;
    }
    var was = btn.innerHTML;
    btn.dataset.armed = '1';
    btn.innerHTML = btn.getAttribute('data-armed-text') || 'Нажми ещё раз';
    btn.classList.add('armed');
    setTimeout(function () {
      if (!btn.isConnected || btn.dataset.armed !== '1') return;
      btn.dataset.armed = '0';
      btn.innerHTML = was;
      btn.classList.remove('armed');
    }, 4000);
  }

  // Кнопки сброса живут в разных местах, а слушатель — один на всё приложение.
  app.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-reset]');
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    armReset(btn, function () {
      resetDay(btn.getAttribute('data-reset'));
      render();
    });
  });

  /* -------------------------------------------------------------- вспомогалки */

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function today() {
    var d = new Date();
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  }

  function parseNum(raw) {
    if (raw === null || raw === undefined) return null;
    var s = String(raw).trim().replace(/\s+/g, '').replace(',', '.');
    if (s === '' || !/^-?\d+(\.\d+)?$/.test(s)) return null;
    return parseFloat(s);
  }

  function isRight(q, given) {
    if (q.type === 'open') {
      var n = parseNum(given);
      return n !== null && Math.abs(n - q.ans) < 1e-9;
    }
    return given === q.ans;
  }

  function dayById(id) {
    for (var i = 0; i < D.days.length; i++) if (D.days[i].id === id) return D.days[i];
    return null;
  }

  function hrefFor(day) {
    if (day.kind === 'exam') return '#/exam/' + day.id.slice(4);
    if (day.kind === 'review') return '#/errors';
    return '#/day/' + day.d;
  }

  /* ==================================================================== ХАБ === */

  function viewHub() {
    document.body.classList.remove('plain');
    barExtra.innerHTML = '';

    var done = 0, best = null;
    D.days.forEach(function (day) {
      var rec = state.days[day.id];
      if (rec && rec.done) {
        done++;
        if (day.kind === 'exam' && typeof rec.score === 'number') {
          best = best === null ? rec.score : Math.max(best, rec.score);
        }
      }
    });
    rail.style.width = (done / D.days.length * 100) + '%';

    var h = '';
    h += '<div class="reading">'
       +   '<div class="eyebrow">Программа на 28 дней</div>'
       +   '<h1 class="h-page">Месяц до олимпиады</h1>'
       +   '<p class="lede">25 задач за 90 минут, без калькулятора. Ниже — по занятию на каждый '
       +   'день до старта: сначала фундамент, потом нестандартные задачи, в конце три '
       +   'пробных экзамена в боевом режиме.</p>'
       + '</div>';

    h += '<div class="summary">'
       +   '<div><div class="n">' + done + ' / ' + D.days.length + '</div><div class="k">дней пройдено</div></div>'
       +   '<div><div class="n">' + (best === null ? '—' : best + ' / 85') + '</div><div class="k">лучший экзамен</div></div>'
       +   '<div><div class="n">' + state.errors.length + '</div><div class="k">задач в журнале ошибок</div></div>'
       + '</div>';

    /* правила счёта — самое ценное на странице */
    h += '<div class="rules">'
       +   '<h2>Как считаются баллы</h2>'
       +   '<p>Тактика здесь приносит больше, чем ещё одна выученная тема. Секции устроены '
       +   'по-разному, и вести себя в них нужно противоположным образом.</p>'
       +   '<table class="scoretable">'
       +     '<tr><th>Секция</th><th>Верно</th><th>Неверно</th><th>Пропуск</th></tr>'
       +     '<tr><td>A · задачи 1–15, выбор ответа</td>'
       +       '<td class="num pos">+2</td><td class="num neg">−1</td><td class="num">0</td></tr>'
       +     '<tr><td>B · задачи 16–25, ответ числом</td>'
       +       '<td class="num pos">+4</td><td class="num">0</td><td class="num">0</td></tr>'
       +     '<tr><td>Стартовые баллы</td><td class="num pos">+15</td>'
       +       '<td class="num">—</td><td class="num">максимум 85</td></tr>'
       +   '</table>'
       +   '<div class="tactic"><span class="tag">Секция A</span><div>'
       +     '<b>Не смог вычеркнуть хотя бы два варианта — пропускай.</b>'
       +     '<span>Случайный тык из четырёх вариантов в среднем стоит четверть балла. '
       +     'Вычеркнул двоих — тот же выбор приносит уже полбалла.</span></div></div>'
       +   '<div class="tactic"><span class="tag">Секция B</span><div>'
       +     '<b>Пустых ответов быть не должно.</b>'
       +     '<span>За ошибку здесь ничего не снимают, поэтому даже грубая прикидка лучше прочерка.</span></div></div>'
       +   '<div class="tactic"><span class="tag">Время</span><div>'
       +     '<b>Идём в два прохода.</b>'
       +     '<span>Первые 45 минут забираем все задачи, которые решаются сразу, и только потом '
       +     'возвращаемся к трудным. Застрять на шестой задаче и не дойти до лёгкой девятнадцатой — '
       +     'самая обидная потеря на олимпиаде.</span></div></div>'
       + '</div>';

    /* календарь */
    D.weeks.forEach(function (w) {
      h += '<section class="week"><div class="week-head">'
         +   '<span class="wn">Неделя ' + w.n + '</span>'
         +   '<h2>' + esc(w.title) + '</h2>'
         +   '<span class="ws">' + esc(w.sub) + '</span>'
         + '</div><div class="days">';

      for (var d = w.from; d <= w.to; d++) {
        var day = null;
        for (var i = 0; i < D.days.length; i++) if (D.days[i].d === d) day = D.days[i];
        if (!day) continue;              // набор этого дня ещё не готов — карточки нет
        var rec = state.days[day.id];
        var isDone = !!(rec && rec.done);
        var part = isDone ? 0 : startedCount(rec);

        var label = day.kind === 'exam' ? 'Экзамен · день ' + d
                  : day.kind === 'review' ? 'Разбор · день ' + d
                  : 'День ' + d;

        var score = '';
        if (isDone) {
          score = '<div class="score">'
                + (day.kind === 'exam' ? rec.score + ' из 85' : rec.ok + ' из ' + rec.total)
                + '<span class="when">' + esc(rec.date || '') + '</span></div>';
        } else if (part > 0) {
          score = '<div class="score part">начато: ' + part + ' из ' + (day.n || rec.total || '?')
                + '<span class="when">' + esc(rec.date || '') + '</span></div>';
        }

        var wipe = (isDone || part > 0)
          ? '<button class="day-reset" type="button" data-reset="' + day.id + '" '
            + 'data-armed-text="стереть?" title="Сбросить этот день" '
            + 'aria-label="Сбросить прогресс дня ' + d + '">↺</button>'
          : '';

        h += '<a class="day' + (day.kind === 'exam' ? ' is-exam' : '') + (isDone ? ' is-done' : '')
           +      (part > 0 ? ' is-part' : '') + '" href="' + hrefFor(day) + '">'
           +   wipe
           +   '<div class="num">' + label + '</div>'
           +   '<h3>' + esc(day.title) + '</h3>'
           +   '<div class="skill">' + esc(day.skill) + '</div>'
           +   score
           + '</a>';
      }
      h += '</div></section>';
    });

    /* распорядок занятия */
    h += '<section class="routine">'
       +   '<h2>Как проходит одно занятие</h2>'
       +   '<p>Около 50 минут, порядок один и тот же каждый день.</p>'
       +   '<div class="steps">'
       +     '<div><div class="t">5 мин</div><div class="s">Разминка</div>'
       +       '<div class="d">Двадцать примеров устного счёта на время.</div></div>'
       +     '<div><div class="t">10 мин</div><div class="s">Приём дня</div>'
       +       '<div class="d">Разбираем две показательные задачи вместе.</div></div>'
       +     '<div><div class="t">25 мин</div><div class="s">Практика</div>'
       +       '<div class="d">Задачи по нарастающей. Подсказку берём только после честной попытки.</div></div>'
       +     '<div><div class="t">10 мин</div><div class="s">Ошибки</div>'
       +       '<div class="d">Разбираем неверные. В журнал они попадают сами.</div></div>'
       +   '</div>'
       + '</section>';

    h += '<div class="actions">'
       +   '<a class="btn ghost" href="#/errors">Журнал ошибок</a>'
       +   '<button class="btn quiet" id="resetBtn" type="button" '
       +     'data-armed-text="Нажми ещё раз, чтобы стереть всё">Сбросить весь прогресс</button>'
       + '</div>'
       + '<p class="sync">Сбросить один день можно прямо на его карточке — '
       +   'кружок со стрелкой в углу.</p>';

    h += '<p class="sync" id="syncline"></p>';

    app.innerHTML = h;
    syncNote(!!dbDoc);

    var btn = document.getElementById('resetBtn');
    btn.addEventListener('click', function () {
      armReset(btn, function () {
        state = { days: {}, errors: [], updatedAt: Date.now() };
        saveNow();
        render();
      });
    });
  }

  /* Сколько задач в наборе уже тронуто — и в занятии, и в незаконченном экзамене. */
  function startedCount(rec) {
    if (!rec) return 0;
    if (rec.exam && Array.isArray(rec.exam.given)) {
      return rec.exam.given.filter(function (g) {
        return g !== null && g !== undefined && String(g).trim() !== '';
      }).length;
    }
    return answeredCount(rec);
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
  }

  /* ============================================================= НАБОР ЗАДАЧ === */

  var activeSet = null;   // {questions, mode, setId, given, checked, ok, no, finished, timerId}

  function questionHTML(q, i, mode) {
    var body;
    if (q.type === 'open') {
      body = '<div class="answer">'
           +   '<input id="in' + i + '" type="text" inputmode="decimal" autocomplete="off" '
           +          'aria-label="Ответ на задачу ' + (i + 1) + '" placeholder="ответ">'
           +   (mode === 'exam'
                ? '<span class="aside">за ошибку здесь не снимают — пиши число всегда</span>'
                : '<button class="btn small ghost" type="button" data-act="check" data-i="' + i + '">Проверить</button>')
           + '</div>';
    } else {
      body = '<div class="opts">' + q.opts.map(function (o, j) {
        return '<button class="opt" type="button" data-act="pick" data-i="' + i + '" data-j="' + j + '" '
             +        'id="o' + i + '_' + j + '">'
             +   '<span class="letter">' + 'АБВГД'[j] + '</span><span>' + o + '</span>'
             + '</button>';
      }).join('') + '</div>';
    }

    var actions = (mode === 'practice' && q.hint)
      ? '<div class="q-actions"><button class="btn small quiet" type="button" '
        + 'data-act="hint" data-i="' + i + '">Подсказка</button></div>'
      : '';

    // «Мне непонятно — объясни»: на тренировке сразу, на экзамене — после сдачи
    var theory = THEORY ? THEORY.forQuestion(q, 'ru') : '';
    var thRow = theory
      ? '<div class="q-actions' + (mode === 'exam' ? ' th-after' : '') + '">'
        + '<button class="btn small quiet theory-btn" type="button" data-act="theory" data-i="' + i + '">'
        + THEORY.label('ru') + '</button></div>'
      : '';

    return '<article class="q" id="q' + i + '">'
         +   '<div class="q-head"><span class="q-num">' + (i + 1) + '</span>'
         +     '<div class="q-text">' + q.q + FIG.forQuestion(q) + '</div></div>'
         +   body + actions + thRow
         +   '<div class="hint" id="h' + i + '" hidden>' + (q.hint || '') + '</div>'
         +   '<div class="expl" id="e' + i + '" hidden>' + (q.ex || '') + FIG.forExplain(q) + '</div>'
         +   (theory ? '<div class="theory" id="t' + i + '">' + theory + '</div>' : '')
         + '</article>';
  }

  function renderSet(mount, questions, mode, setId) {
    var S = activeSet = {
      questions: questions, mode: mode, setId: setId,
      given: questions.map(function () { return null; }),
      checked: questions.map(function () { return false; }),
      ok: 0, no: 0, answered: 0, finished: false, timerId: null
    };

    var h = '';
    if (mode === 'exam') {
      h += sectionRule('A', 'Задачи 1–15 · выбор ответа', '+2 за верный · −1 за неверный · 0 за пропуск');
    }
    questions.forEach(function (q, i) {
      if (mode === 'exam' && i === 15) {
        h += sectionRule('B', 'Задачи 16–25 · ответ числом', '+4 за верный · 0 за неверный');
      }
      h += questionHTML(q, i, mode);
    });
    h += '<div class="actions"><button class="btn" type="button" id="finish">'
       + (mode === 'exam' ? 'Завершить экзамен' : 'Показать итог') + '</button></div>'
       + '<div id="result"></div>';

    mount.innerHTML = h;
    mount.addEventListener('click', onSetClick);
    mount.addEventListener('keydown', onSetKey);
    if (mode === 'exam') mount.addEventListener('input', function (ev) {
      if (!ev.target.closest('input')) return;
      recount();
      saveExam(S);
    });
    document.getElementById('finish').addEventListener('click', function () { finish(false); });
    updateCounters();
    restoreSet(S);
    setupStep(mount);
  }

  /* Возвращаем набор в том виде, в каком его бросили в прошлый раз. */
  function restoreSet(S) {
    var rec = state.days[S.setId];
    if (!rec || S.setId === 'errors') return;

    if (S.mode === 'exam') {
      var att = rec.exam;                  // при завершении экзамена это поле удаляется,
      if (!att || !Array.isArray(att.given)) return;   // значит здесь всегда живая попытка
      if (typeof att.left === 'number') S.left = att.left;

      att.given.forEach(function (g, i) {
        if (g === null || g === undefined || g === '' || i >= S.questions.length) return;
        S.given[i] = g;
        if (S.questions[i].type === 'open') {
          var inp = document.getElementById('in' + i);
          if (inp) inp.value = g;
        } else {
          var opt = document.getElementById('o' + i + '_' + g);
          if (opt) opt.classList.add('chosen');
        }
      });
      recount();
      return;
    }

    Object.keys(rec.answers || {})
      .map(function (k) { return parseInt(k, 10); })
      .filter(function (i) { return i >= 0 && i < S.questions.length; })
      .sort(function (a, b) { return a - b; })
      .forEach(function (i) {
        var a = rec.answers[i];
        S.given[i] = a.g;
        if (S.questions[i].type === 'open') {
          var inp = document.getElementById('in' + i);
          if (inp) inp.value = a.g === null ? '' : a.g;
        }
        reveal(i, true);
      });

    // день был доведён до конца — сразу показываем итог, как его и оставили
    if (S.answered === S.questions.length && S.answered > 0) finish(false);
  }

  function sectionRule(letter, what, how) {
    return '<div class="section-rule"><span class="letter">' + letter + '</span>'
         + '<span class="what">' + what + '</span><span class="how">' + how + '</span></div>';
  }

  function onSetClick(ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var i = parseInt(el.getAttribute('data-i'), 10);

    if (act === 'pick') pick(i, parseInt(el.getAttribute('data-j'), 10));
    else if (act === 'check') checkOpen(i);
    else if (act === 'hint') {
      document.getElementById('h' + i).hidden = false;
      el.parentNode.remove();
    }
    else if (act === 'theory') {
      var th = document.getElementById('t' + i);
      if (th) th.classList.toggle('vis');
    }
  }

  function onSetKey(ev) {
    if (ev.key !== 'Enter') return;
    var inp = ev.target.closest('input');
    if (!inp) return;
    ev.preventDefault();
    var i = parseInt(inp.id.slice(2), 10);
    if (activeSet.mode === 'practice') checkOpen(i);
    else {
      var next = document.getElementById('in' + (i + 1));
      if (next) next.focus();
    }
  }

  function pick(i, j) {
    var S = activeSet;
    if (S.finished) return;

    if (S.mode === 'exam') {
      var prev = S.given[i];
      if (prev !== null) document.getElementById('o' + i + '_' + prev).classList.remove('chosen');
      if (prev === j) { S.given[i] = null; }
      else {
        S.given[i] = j;
        document.getElementById('o' + i + '_' + j).classList.add('chosen');
      }
      recount();
      saveExam(S);
      return;
    }

    if (S.checked[i]) return;
    S.given[i] = j;
    reveal(i);
  }

  function checkOpen(i) {
    var S = activeSet;
    if (S.finished || S.checked[i]) return;
    var inp = document.getElementById('in' + i);
    if (parseNum(inp.value) === null) { inp.focus(); return; }
    S.given[i] = inp.value;
    reveal(i);
  }

  function reveal(i, restoring) {
    var S = activeSet;
    if (S.checked[i]) return;
    var q = S.questions[i];
    var card = document.getElementById('q' + i);
    var good = isRight(q, S.given[i]);

    S.checked[i] = true;
    card.classList.add('done', good ? 'ok' : 'no');
    document.getElementById('e' + i).hidden = false;

    if (q.type === 'open') {
      var inp = document.getElementById('in' + i);
      inp.classList.add(good ? 'right' : 'wrong');
      inp.readOnly = true;
      var btn = card.querySelector('[data-act="check"]');
      if (btn) btn.remove();
      if (!good) prependAnswer(i, q.ans);
    } else {
      document.getElementById('o' + i + '_' + S.given[i]).classList.add(good ? 'right' : 'wrong');
      if (!good) document.getElementById('o' + i + '_' + q.ans).classList.add('right');
    }

    var ha = card.querySelector('[data-act="hint"]');
    if (ha) ha.parentNode.remove();

    if (good) {
      S.ok++;
      if (S.setId === 'errors' && q.key) forgetError(q.key);
    } else {
      S.no++;
      if (!restoring) rememberError(S.setId, i, q);
    }
    S.answered++;
    if (!restoring) noteAnswer(S.setId, i, S.given[i], good, S.questions.length);
    updateCounters();
    showStep();

    if (!restoring && S.answered === S.questions.length) finish(false);
  }

  function prependAnswer(i, ans) {
    var e = document.getElementById('e' + i);
    e.innerHTML = '<b>Правильный ответ: ' + ans + '.</b> ' + e.innerHTML;
  }

  function recount() {
    var S = activeSet, filled = 0;
    for (var i = 0; i < S.questions.length; i++) {
      if (S.questions[i].type === 'open') {
        var inp = document.getElementById('in' + i);
        if (inp && parseNum(inp.value) !== null) filled++;
      } else if (S.given[i] !== null) filled++;
    }
    S.answered = filled;
    updateCounters();
    showStep();
  }

  function updateCounters() {
    var S = activeSet;
    if (!S) return;
    rail.style.width = (S.answered / S.questions.length * 100) + '%';
    var note = document.getElementById('counters');
    if (!note) return;
    note.textContent = S.mode === 'exam'
      ? 'Отвечено ' + S.answered + ' из ' + S.questions.length
      : 'Верно ' + S.ok + ' · неверно ' + S.no + ' · осталось ' + (S.questions.length - S.answered);
  }


  /* ================================================ ОДНА ЗАДАЧА НА ЭКРАН === */

  /* Как показывать набор. Ключ тот же, что в многостраничной версии:
     это свойство устройства, а не ребёнка. */
  var VIEW_KEY = 'sasmo.view';
  var PHONE = '(max-width: 760px)';
  var step = null;          // {at, on, cards, mount}

  function savedView() {
    try { return localStorage.getItem(VIEW_KEY); } catch (e) { return null; }
  }

  function rememberView(on) {
    try { localStorage.setItem(VIEW_KEY, on ? 'step' : 'list'); } catch (e) { /* пусто */ }
  }

  function prefersStep() {
    var v = savedView();
    if (v === 'step' || v === 'list') return v === 'step';
    return !!(window.matchMedia && window.matchMedia(PHONE).matches);
  }

  /* Уходим со страницы набора — панель и карта не должны её пережить. */
  function teardownStep() {
    ['stepnav', 'stepmap'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    });
    document.body.classList.remove('has-stepnav');
    step = null;
  }

  function setupStep(mount) {
    teardownStep();

    var cards = [].slice.call(mount.querySelectorAll('.q'));
    if (!cards.length) return;

    // Набор уже доведён до конца (день открыли заново) — листать нечего,
    // на экране разбор всех задач. Переключатель здесь был бы мёртвой кнопкой.
    if (activeSet && activeSet.finished) return;

    var finish = document.getElementById('finish');
    step = {
      at: 0, on: false, cards: cards, mount: mount,
      finWrap: finish ? finish.parentNode : null
    };

    var tg = document.createElement('div');
    tg.className = 'viewtoggle';
    tg.innerHTML = '<button class="vbtn" type="button" data-view="step">По одной</button>'
                 + '<button class="vbtn" type="button" data-view="list">Списком</button>';
    mount.insertBefore(tg, mount.firstChild);
    step.toggle = tg;
    tg.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-view]');
      if (!b) return;
      var on = b.getAttribute('data-view') === 'step';
      rememberView(on);
      setStepMode(on);
    });

    var nav = document.createElement('div');
    nav.id = 'stepnav';
    nav.className = 'stepnav';
    nav.innerHTML =
      '<button class="snav" type="button" id="stepPrev" aria-label="Предыдущая задача">&#8592;</button>'
      + '<button class="snum" type="button" id="stepNum" aria-label="Все задачи"></button>'
      + '<button class="snav" type="button" id="stepNext" aria-label="Следующая задача">&#8594;</button>';
    document.body.appendChild(nav);
    step.nav = nav;

    document.getElementById('stepPrev').addEventListener('click', function () { goStep(step.at - 1); });
    document.getElementById('stepNext').addEventListener('click', function () { goStep(step.at + 1); });
    document.getElementById('stepNum').addEventListener('click', openMap);

    var map = document.createElement('div');
    map.id = 'stepmap';
    map.className = 'stepmap';
    map.innerHTML = '<div class="sheet"><h3>Все задачи'
                  + '<button class="mapx" type="button" id="stepMapClose" aria-label="Закрыть">&times;</button>'
                  + '</h3><div class="grid" id="stepGrid"></div>'
                  + '<div class="mapfoot" id="stepMapFoot"></div></div>';
    document.body.appendChild(map);
    step.map = map;

    map.addEventListener('click', function (ev) {
      var cell = ev.target.closest('[data-go]');
      if (cell) { closeMap(); goStep(parseInt(cell.getAttribute('data-go'), 10)); return; }
      if (ev.target.closest('#stepMapFinish')) { closeMap(); finish(false); return; }
      if (ev.target.closest('#stepMapClose') || !ev.target.closest('.sheet')) closeMap();
    });

    /* Свайп — привычный на телефоне способ листать. */
    var x0 = null, y0 = null;
    mount.addEventListener('touchstart', function (ev) {
      if (!step || !step.on || ev.touches.length !== 1) { x0 = null; return; }
      x0 = ev.touches[0].clientX;
      y0 = ev.touches[0].clientY;
    }, { passive: true });

    mount.addEventListener('touchend', function (ev) {
      if (x0 === null || !ev.changedTouches.length) return;
      var dx = ev.changedTouches[0].clientX - x0;
      var dy = ev.changedTouches[0].clientY - y0;
      x0 = null;
      // горизонталь должна явно перевешивать вертикаль, иначе это прокрутка
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      goStep(step.at + (dx < 0 ? 1 : -1));
    }, { passive: true });

    setStepMode(prefersStep());
  }

  function setStepMode(on) {
    if (!step) return;
    var S = activeSet;
    // после итога листать нечего: разбор смотрят целиком
    step.on = !!on && !(S && S.finished);

    step.mount.classList.toggle('stepped', step.on);
    document.body.classList.toggle('has-stepnav', step.on);
    step.nav.classList.toggle('vis', step.on);

    var view = step.on ? 'step' : 'list';
    [].forEach.call(step.toggle.querySelectorAll('[data-view]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-view') === view);
    });

    if (!step.on) {
      step.cards.forEach(function (c) { c.classList.remove('cur'); });
      [].forEach.call(step.mount.querySelectorAll('.section-rule'), function (x) {
        x.classList.remove('cur');
      });
      if (step.finWrap) step.finWrap.classList.remove('hid');
      closeMap();
      return;
    }
    showStep();
  }

  function goStep(i) {
    if (!step || !step.on) return;
    i = Math.max(0, Math.min(step.cards.length - 1, i));
    var moved = i !== step.at;
    step.at = i;
    showStep();
    if (moved) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showStep() {
    if (!step || !step.on) return;
    var at = step.at;

    step.cards.forEach(function (c, i) { c.classList.toggle('cur', i === at); });

    /* Заголовок секции показываем на её первой задаче: правила должны
       попасться ребёнку до того, как он начнёт в секции отвечать. */
    [].forEach.call(step.mount.querySelectorAll('.section-rule'), function (x) {
      x.classList.remove('cur');
    });
    var prev = step.cards[at].previousElementSibling;
    if (prev && prev.classList.contains('section-rule')) prev.classList.add('cur');

    if (step.finWrap) step.finWrap.classList.toggle('hid', at !== step.cards.length - 1);

    var p = document.getElementById('stepPrev');
    var n = document.getElementById('stepNext');
    if (p) p.disabled = at === 0;
    if (n) {
      n.disabled = at === step.cards.length - 1;
      n.classList.toggle('ready',
        !!(activeSet && activeSet.checked[at]) && at < step.cards.length - 1);
    }

    stepSync();
    if (step.map.classList.contains('vis')) fillMap();
  }

  /* Что известно про задачу: решена верно, неверно, тронута или пуста. */
  function stepState(i) {
    var S = activeSet;
    if (!S) return '';
    if (S.checked[i]) return step.cards[i].classList.contains('ok') ? 'ok' : 'no';
    if (S.questions[i].type === 'open') {
      var inp = document.getElementById('in' + i);
      return (inp && String(inp.value).trim() !== '') ? 'seen' : '';
    }
    return (S.given[i] !== null && S.given[i] !== undefined) ? 'seen' : '';
  }

  function stepSync() {
    var num = document.getElementById('stepNum');
    if (!num) return;
    var label = '', el = step.cards[step.at];
    while (el) {
      if (el.classList && el.classList.contains('section-rule')) {
        label = 'Секция ' + (el.querySelector('.letter') || {}).textContent;
        break;
      }
      el = el.previousElementSibling;
    }
    num.innerHTML = (label ? '<b>' + label + '</b> &middot; ' : '')
                  + (step.at + 1) + ' / ' + step.cards.length;
  }

  function fillMap() {
    var S = activeSet;
    document.getElementById('stepGrid').innerHTML = S.questions.map(function (q, i) {
      return '<button class="cell ' + stepState(i) + (i === step.at ? ' at' : '')
           + '" type="button" data-go="' + i + '">' + (i + 1) + '</button>';
    }).join('');

    var left = 0;
    S.questions.forEach(function (q, i) { if (!stepState(i)) left++; });

    document.getElementById('stepMapFoot').innerHTML = S.finished ? '' :
      '<div class="mapleft">'
      + (left ? 'Без ответа: <b>' + left + '</b>' : 'Отвечено всё')
      + '</div><button class="btn" type="button" id="stepMapFinish">'
      + (S.mode === 'exam' ? 'Завершить' : 'Показать итог') + '</button>';
  }

  function openMap() {
    if (!step || !step.on || !activeSet) return;
    fillMap();
    step.map.classList.add('vis');
  }

  function closeMap() {
    if (step && step.map) step.map.classList.remove('vis');
  }

  /* ------------------------------------------------------------------- итоги */

  function finish(byTimer) {
    var S = activeSet;
    if (!S || S.finished) return;
    S.finished = true;
    if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }

    var i, q, good, card;

    if (S.mode === 'exam') {
      var aOk = 0, aNo = 0, bOk = 0, bNo = 0, blank = 0;
      S.ok = 0; S.no = 0;

      for (i = 0; i < S.questions.length; i++) {
        q = S.questions[i];
        card = document.getElementById('q' + i);
        document.getElementById('e' + i).hidden = false;

        var empty;
        if (q.type === 'open') {
          var inp = document.getElementById('in' + i);
          S.given[i] = inp.value;
          inp.readOnly = true;
          empty = parseNum(S.given[i]) === null;
        } else {
          empty = S.given[i] === null;
        }

        good = !empty && isRight(q, S.given[i]);
        card.classList.add('done', good ? 'ok' : 'no');

        if (q.type === 'open') {
          document.getElementById('in' + i).classList.add(good ? 'right' : 'wrong');
          if (!good) prependAnswer(i, q.ans);
        } else {
          if (S.given[i] !== null) {
            var chosen = document.getElementById('o' + i + '_' + S.given[i]);
            chosen.classList.remove('chosen');
            chosen.classList.add(good ? 'right' : 'wrong');
          }
          if (!good) document.getElementById('o' + i + '_' + q.ans).classList.add('right');
        }

        if (empty) blank++;
        else if (good) { S.ok++; if (i < 15) aOk++; else bOk++; }
        else { S.no++; if (i < 15) aNo++; else bNo++; rememberError(S.setId, i, q); }
      }

      var score = 15 + (aOk * 2 - aNo) + bOk * 4;
      var erec = recFor(S.setId);
      erec.done = true;
      erec.ok = S.ok;
      erec.no = S.no;
      erec.total = S.questions.length;
      erec.score = score;
      erec.date = today();
      delete erec.exam;             // попытка доведена до конца, продолжать нечего
      saveNow();
      showExamResult(score, aOk, aNo, bOk, bNo, blank, byTimer);
      return;
    }

    for (i = 0; i < S.questions.length; i++) {
      if (S.checked[i]) continue;
      q = S.questions[i];
      card = document.getElementById('q' + i);
      card.classList.add('done', 'no');
      document.getElementById('e' + i).hidden = false;

      if (q.type === 'open') {
        var oi = document.getElementById('in' + i);
        oi.readOnly = true;
        oi.classList.add('wrong');
        var cb = card.querySelector('[data-act="check"]');
        if (cb) cb.remove();
        prependAnswer(i, q.ans);
      } else {
        document.getElementById('o' + i + '_' + q.ans).classList.add('right');
      }
      var hb = card.querySelector('[data-act="hint"]');
      if (hb) hb.parentNode.remove();
      S.no++;
      rememberError(S.setId, i, q);
    }

    S.answered = S.questions.length;
    if (S.setId !== 'errors') {
      var rec = recFor(S.setId);
      rec.done = true;
      rec.ok = S.ok;
      rec.no = S.no;
      rec.total = S.questions.length;
      rec.date = today();
      // задачи, до которых ребёнок не дошёл, тоже попадают в запись — как неверные
      for (i = 0; i < S.questions.length; i++) {
        if (!rec.answers[i]) {
          rec.answers[i] = { g: S.given[i] === undefined ? null : S.given[i], ok: false };
        }
      }
    }
    saveNow();
    updateCounters();
    if (step && step.on) setStepMode(false);
    if (step && step.nav) step.nav.classList.remove('vis');
    document.body.classList.remove('has-stepnav');
    showPracticeResult();
  }

  function showPracticeResult() {
    var S = activeSet;
    var pct = S.ok / S.questions.length;
    var verdict = pct >= .9 ? 'Отличная работа'
                : pct >= .7 ? 'Хорошо'
                : pct >= .5 ? 'Разбери ошибки — и тема сядет'
                : 'Тема ещё не села, вернись к ней завтра';

    var h = '<div class="result">'
          +   '<div class="big">' + S.ok + ' / ' + S.questions.length + '</div>'
          +   '<div class="verdict">' + verdict + '</div>'
          +   '<div class="sub">Верно ' + S.ok + ' · неверно ' + S.no + '</div>';

    if (S.no > 0) {
      h += '<div class="ledger"><div><span>Ошибки записаны в журнал</span>'
         + '<span class="v">' + S.no + '</span></div>'
         + '<div class="total"><span>Прорешай их через день-два</span>'
         + '<span class="v">так они запоминаются лучше</span></div></div>';
    }

    h += '<div class="actions"><a class="btn" href="#/">К программе</a>'
       + (S.no > 0 ? '<a class="btn ghost" href="#/errors">Журнал ошибок</a>' : '')
       + '</div></div>';

    closeOut(h);
  }

  function showExamResult(score, aOk, aNo, bOk, bNo, blank, byTimer) {
    var S = activeSet;
    var verdict = score >= 70 ? 'Уровень золота'
                : score >= 60 ? 'Уровень серебра'
                : score >= 50 ? 'Уровень бронзы'
                : score >= 40 ? 'Уровень похвального отзыва'
                : 'Есть над чем поработать';
    var bBlank = 10 - bOk - bNo;

    var h = '<div class="result">'
          +   '<div class="big">' + score + ' / 85</div>'
          +   '<div class="verdict">' + verdict + '</div>'
          +   '<div class="sub">Ориентир приблизительный: в SASMO награды раздают по местам '
          +     'участников, и порог меняется от года к году.</div>'
          +   (byTimer ? '<div class="sub"><b>Время вышло.</b></div>' : '')
          +   '<div class="ledger">'
          +     '<div><span>Стартовые баллы</span><span class="v">+15</span></div>'
          +     '<div><span>Секция A · ' + aOk + ' верно, ' + aNo + ' неверно</span>'
          +       '<span class="v">' + (aOk * 2 - aNo >= 0 ? '+' : '') + (aOk * 2 - aNo) + '</span></div>'
          +     '<div><span>Секция B · ' + bOk + ' верно, ' + bNo + ' неверно</span>'
          +       '<span class="v">+' + (bOk * 4) + '</span></div>'
          +     '<div class="total"><span>Итого</span><span class="v">' + score + ' из 85</span></div>'
          +     (blank > 0 ? '<div class="warnrow"><span>Пропущено задач</span>'
          +       '<span class="v">' + blank + '</span></div>' : '')
          +     (bBlank > 0 ? '<div class="warnrow"><span>Из них пусто в секции B — '
          +       'а там за ошибку не снимают</span><span class="v">' + bBlank + '</span></div>' : '')
          +   '</div>'
          +   '<div class="actions"><a class="btn" href="#/">К программе</a>'
          +     '<a class="btn ghost" href="#/errors">Разобрать ошибки</a></div>'
          + '</div>';

    closeOut(h);
  }

  function closeOut(h) {
    document.getElementById('finish').parentNode.remove();
    var box = document.getElementById('result');
    box.innerHTML = h;
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ============================================================== ЗАНЯТИЕ === */

  function viewDay(n) {
    document.body.classList.remove('plain');
    var day = null;
    for (var i = 0; i < D.days.length; i++) if (D.days[i].d === n) day = D.days[i];
    if (!day || !D.sets[day.id]) return viewMissing();

    var set = D.sets[day.id];
    barExtra.innerHTML = '<a class="crumb" href="#/">← к программе</a>'
                       + '<span class="progress-note" id="counters" style="margin-left:1rem"></span>';

    var rec = state.days[day.id];
    var started = answeredCount(rec);
    var total = set.questions.length;

    var h = '<div class="reading">'
          +   '<div class="eyebrow">День ' + day.d + ' из 28 · ' + esc(day.skill) + '</div>'
          +   '<h1 class="h-page">' + esc(day.title) + '</h1>'
          + '</div>';

    if (rec && rec.done) {
      h += resumeBar('День уже пройден: <b>' + rec.ok + ' из ' + rec.total + '</b>'
                     + (rec.date ? ' · ' + esc(rec.date) : '')
                     + '. Ответы ниже — те же, что и в тот раз.',
                     day.id, 'Пройти день заново');
    } else if (started > 0) {
      h += resumeBar('Продолжаем с того места: решено <b>' + started + ' из ' + total + '</b>. '
                     + 'Решай оставшиеся — всё, что уже сделано, сохранено.',
                     day.id, 'Начать день заново');
    }

    if (set.intro) {
      h += '<div class="panel technique reading"><h2>' + set.intro.title + '</h2>'
         + '<div class="body">' + set.intro.body + '</div></div>';
    }
    h += '<div class="reading" id="set"></div>';

    app.innerHTML = h;
    renderSet(document.getElementById('set'), set.questions, 'practice', day.id);
  }

  function resumeBar(text, setId, btnLabel) {
    return '<div class="resume reading"><div>' + text + '</div>'
         + '<button class="btn small quiet" type="button" data-reset="' + setId + '" '
         +   'data-armed-text="Нажми ещё раз — прогресс дня сотрётся">' + btnLabel + '</button></div>';
  }

  /* =============================================================== ЭКЗАМЕН === */

  function viewExam(num) {
    var setId = 'exam' + num;
    var day = dayById(setId);
    if (!day || !D.sets[setId]) return viewMissing();

    var rec = state.days[setId];
    var att = rec && rec.exam && Array.isArray(rec.exam.given) ? rec.exam : null;

    document.body.classList.add('plain');
    barExtra.innerHTML = '<a class="crumb" href="#/">← к программе</a>';
    rail.style.width = '0%';

    app.innerHTML =
        '<div class="reading">'
      +   '<div class="eyebrow">День ' + day.d + ' · пробный экзамен</div>'
      +   '<h1 class="h-page">' + esc(day.title) + '</h1>'
      +   '<p class="lede">Условия как на настоящей олимпиаде: 25 задач, 90 минут, без '
      +     'калькулятора. Ответы не показываются до самого конца.</p>'
      +   '<div class="panel brief"><h2>Прочитайте вместе перед стартом</h2><div class="body">'
      +     '<ul>'
      +       '<li><b>Секция A, задачи 1–15.</b> Выбор из четырёх. За верный +2, за неверный '
      +         '<b>−1</b>, за пропуск 0. Не смог вычеркнуть хотя бы два варианта — пропускай.</li>'
      +       '<li><b>Секция B, задачи 16–25.</b> Ответ — число. За верный +4, за неверный 0. '
      +         '<b>Пустых быть не должно.</b></li>'
      +       '<li><b>Старт с 15 баллов</b>, максимум 85.</li>'
      +       '<li><b>Два прохода.</b> Первые 45 минут — всё, что решается сразу. '
      +         'Оставшееся время — трудные задачи.</li>'
      +       '<li>Черновик — обычный лист бумаги. Подчёркивай вопрос в условии карандашом.</li>'
      +     '</ul>'
      +   '</div></div>'
      +   (rec && rec.done
            ? '<div class="resume"><div>Экзамен уже сдан: <b>' + rec.score + ' из 85</b>'
              + (rec.date ? ' · ' + esc(rec.date) : '') + '. Можно пройти его ещё раз — '
              + 'прошлый результат перезапишется.</div></div>'
            : '')
      +   (att
            ? '<div class="resume"><div>Прошлая попытка не закончена: отвечено <b>'
              + startedCount(rec) + ' из 25</b>, на часах осталось <b>' + mmss(att.left)
              + '</b>.</div><button class="btn small quiet" type="button" data-reset="' + setId
              + '" data-armed-text="Нажми ещё раз — попытка сотрётся">Стереть попытку</button></div>'
            : '')
      +   '<div class="actions"><button class="btn" type="button" id="start">'
      +     (att ? 'Продолжить экзамен · осталось ' + mmss(att.left) : 'Начать экзамен · 90 минут')
      +   '</button></div>'
      + '</div>'
      + '<div class="reading" id="set"></div>';

    document.getElementById('start').addEventListener('click', function () {
      document.querySelector('.panel.brief').remove();
      this.parentNode.remove();
      barExtra.innerHTML = '<a class="crumb" href="#/">← выйти</a>'
                         + '<span class="timer" id="timer" style="margin-left:1rem">90:00</span>'
                         + '<span class="progress-note" id="counters" style="margin-left:.8rem"></span>';
      renderSet(document.getElementById('set'), D.sets[setId].questions, 'exam', setId);
      startTimer(90);
      window.scrollTo({ top: 0 });
    });
  }

  function startTimer(minutes) {
    var el = document.getElementById('timer');
    var S = activeSet;
    if (typeof S.left !== 'number' || S.left <= 0) S.left = minutes * 60;

    function tick() {
      var m = Math.floor(S.left / 60), s = S.left % 60;
      el.textContent = pad(m) + ':' + pad(s);
      el.classList.toggle('warn', S.left <= 900 && S.left > 300);
      el.classList.toggle('crit', S.left <= 300);
      if (S.left <= 0) { clearInterval(S.timerId); finish(true); return; }
      S.left--;
      // раз в четверть минуты кладём остаток в память: вкладку могут закрыть
      if (S.left % 15 === 0) saveExam(S);
    }

    tick();
    S.timerId = setInterval(tick, 1000);
  }

  /* ========================================================= ЖУРНАЛ ОШИБОК === */

  function viewErrors() {
    document.body.classList.remove('plain');
    barExtra.innerHTML = '<a class="crumb" href="#/">← к программе</a>'
                       + '<span class="progress-note" id="counters" style="margin-left:1rem"></span>';
    rail.style.width = '0%';

    var errs = state.errors.slice().sort(function (a, b) { return a.ts - b.ts; });

    var h = '<div class="reading">'
          +   '<div class="eyebrow">Работа над ошибками</div>'
          +   '<h1 class="h-page">Журнал ошибок</h1>';

    if (!errs.length) {
      h += '<div class="empty"><p>Журнал пуст. Он заполнится сам, как только '
         + 'в каком-нибудь занятии попадётся неверный ответ.</p>'
         + '<a class="btn" href="#/">К программе</a></div></div>';
      app.innerHTML = h;
      activeSet = null;
      return;
    }

    var byTopic = {};
    errs.forEach(function (e) {
      var t = e.topic || 'Прочее';
      byTopic[t] = (byTopic[t] || 0) + 1;
    });
    var topics = Object.keys(byTopic).sort(function (a, b) { return byTopic[b] - byTopic[a]; });
    var maxCount = byTopic[topics[0]];

    h += '<p class="lede">Здесь ' + errs.length + ' задач' + plural(errs.length, ['а', 'и', '']) + '. '
       + 'Решённая заново уходит из журнала, оставшаяся — сигнал, что тему надо разобрать ещё раз. '
       + 'Заглядывать сюда стоит раз в два-три дня: задача, решённая повторно через паузу, '
       + 'запоминается заметно лучше.</p>'
       + '<div class="topics">'
       + topics.map(function (t) {
           return '<span class="topic' + (byTopic[t] === maxCount ? ' top' : '') + '">'
                + '<span class="c">' + byTopic[t] + '</span>' + esc(t) + '</span>';
         }).join('')
       + '</div></div><div class="reading" id="set" style="margin-top:1.4rem"></div>';

    app.innerHTML = h;
    renderSet(document.getElementById('set'), errs, 'practice', 'errors');
  }

  function plural(n, forms) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return forms[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return forms[1];
    return forms[2];
  }

  function viewMissing() {
    document.body.classList.remove('plain');
    barExtra.innerHTML = '';
    app.innerHTML = '<div class="reading"><div class="empty">'
                  + '<p>Такой страницы нет.</p><a class="btn" href="#/">К программе</a>'
                  + '</div></div>';
  }

  /* ============================================================= МАРШРУТЫ === */

  function render() {
    if (activeSet && activeSet.timerId) clearInterval(activeSet.timerId);
    activeSet = null;
    teardownStep();
    window.scrollTo({ top: 0 });

    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/');

    if (parts[0] === 'day' && parts[1]) viewDay(parseInt(parts[1], 10));
    else if (parts[0] === 'exam' && parts[1]) viewExam(parts[1].replace(/\D/g, ''));
    else if (parts[0] === 'errors') viewErrors();
    else viewHub();
  }

  window.addEventListener('hashchange', render);

  // Экзамен и незавершённое занятие лучше не терять по случайному свайпу назад.
  window.addEventListener('beforeunload', function (ev) {
    if (!activeSet || activeSet.finished) return;
    saveExam(activeSet);
    if (activeSet.answered > 0) {
      ev.preventDefault();
      ev.returnValue = '';
    }
  });

  // На планшете вкладку чаще не закрывают, а сворачивают — это тоже момент сохранить.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveExam(activeSet);
  });

  if (D.label) {
    document.getElementById('lvl').textContent = D.label;
    document.title = 'Olympiad Sprint · ' + D.label;
  }

  var local = readLocal();
  if (local) state = local;
  render();
  connect();
})();
</script>
