<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Работа над ошибками</title>
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>

<div class="header">
  <div class="logo brand"></div>
  <div class="sub" data-i18n="журнал ошибок">журнал ошибок</div>
  <h2 data-i18n="Работа над ошибками">Работа над ошибками</h2>
  <div class="crumb"><a href="index.html">← весь план</a></div>
  <div class="pbar"><div class="pfill" id="pf"></div></div>
  <div class="scores">
    <span class="s-ok" id="cO">0 верно</span>
    <span class="s-no" id="cN">0 неверно</span>
    <span class="s-pt" id="cP"></span>
  </div>
</div>

<div class="container">
  <div id="intro"></div>
  <div id="box"></div>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/plan2.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/theory.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/paper.js"></script>
<script>
(function () {
  var t = I18N.t;
  var params = SASMO.params();

  /* У отдельных работ журнал свой у каждого решающего: за ними сидят разные
     дети, и ошибки одного не должны попадаться другому. ?who=… и выбирает,
     чей журнал открыть; без него — общий журнал класса. */
  var who = params.get('who');
  var solver = who ? window.SOLVERS[who] : null;
  var hub, back, hubLabel;

  if (solver) {
    SASMO.usePlan({
      keys: SASMO_PAPER.keys(who),
      hubHref: solver.paper,
      errorsHref: 'errors.html?who=' + who
    });
    hub = solver.paper;
    back = t('← к работе');
    hubLabel = t('К работе');
    document.querySelector('.sub').textContent = t('журнал ошибок · {name}', { name: solver.name });
    document.querySelector('h2').textContent = t('Работа над ошибками — {name}', { name: solver.name });
    document.title = t('Работа над ошибками — {name}', { name: solver.name });
  } else {
    var PLAN = window.PLANS[params.get('g') === '2' ? 2 : 3];
    SASMO.usePlan(PLAN);
    hub = 'index.html' + (PLAN.grade === 3 ? '' : '?g=' + PLAN.grade);
    back = t('← весь план');
    hubLabel = t('К плану');
    document.title = t('Работа над ошибками');
  }

  var crumb = document.querySelector('.crumb');
  if (crumb) crumb.innerHTML = '<a href="' + hub + '">' + back + '</a>';

  var errors = SASMO.getErrors();
  document.getElementById('cO').textContent = t('{n} верно', { n: 0 });
  document.getElementById('cN').textContent = t('{n} неверно', { n: 0 });
  var box = document.getElementById('box');
  var intro = document.getElementById('intro');

  if (!errors.length) {
    intro.innerHTML =
      '<div class="empty">' +
      t('Журнал пуст — ошибок пока нет.<br>Он заполнится сам, когда ребёнок ошибётся в задаче.') +
      '<br><br><a class="btn" href="' + hub + '">' + hubLabel + '</a></div>';
    return;
  }

  // Разбитые по темам — видно, какая тема проседает
  var byTopic = {};
  errors.forEach(function (e) {
    var q = I18N.localize(e);
    var tp = q.topic || t('Прочее');
    byTopic[tp] = (byTopic[tp] || 0) + 1;
  });
  var rows = Object.keys(byTopic).sort(function (a, b) {
    return byTopic[b] - byTopic[a];
  }).map(function (tp) {
    return '<li><b>' + byTopic[tp] + '</b> — ' + tp + '</li>';
  }).join('');

  intro.innerHTML =
    '<div class="note warm">' +
      '<h3>' + t('В журнале {n} задач(и)', { n: errors.length }) + '</h3>' +
      '<p style="margin-bottom:.3rem">' +
      t('Решённая заново задача уходит из журнала. Ошибка остаётся — значит, тему надо разобрать ещё раз.') +
      '</p>' +
      '<ul>' + rows + '</ul>' +
      '<p style="margin-top:.4rem">' +
      t('<b>Самая слабая тема сверху.</b> Именно ей стоит отдать ближайшие 10 минут занятия.') +
      '</p>' +
    '</div>';

  // Старые ошибки — вперёд: они успели забыться сильнее.
  var questions = errors.slice().sort(function (a, b) { return a.ts - b.ts; });

  SASMO.run({
    mount: box,
    questions: questions,
    mode: 'practice',
    setId: 'errors'
  });
})();
</script>
</body>
</html>
