<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASMO — занятие дня</title>
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="l1">S</span><span class="l2">A</span><span class="l3">S</span><span class="l4">M</span><span class="l5">O</span>
  </div>
  <div class="sub" id="sub">занятие</div>
  <h2 id="ttl">Загружаем задачи…</h2>
  <div class="crumb"><a href="index.html">← весь план</a></div>
  <div class="pbar"><div class="pfill" id="pf"></div></div>
  <div class="scores">
    <span class="s-ok" id="cO">0 верно</span>
    <span class="s-no" id="cN">0 неверно</span>
    <span class="s-pt" id="cP"></span>
  </div>
</div>

<div class="container">
  <div id="resume"></div>
  <div id="intro"></div>
  <div id="box"><div class="empty">Загружаем задачи…</div></div>
</div>

<script src="assets/plan.js"></script>
<script src="assets/plan2.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/quiz.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var PLAN = window.PLANS[params.get('g') === '2' ? 2 : 3];
  SASMO.usePlan(PLAN);

  var d = parseInt(params.get('d'), 10);
  var box = document.getElementById('box');

  var day = isNaN(d) ? null : PLAN.day(d);
  var hub = 'index.html' + (PLAN.grade === 3 ? '' : '?g=' + PLAN.grade);

  if (!day || day.kind === 'exam' || day.kind === 'review') {
    box.innerHTML = '<div class="empty">Такого занятия нет. ' +
                    '<a href="' + hub + '">Вернуться к плану</a>.</div>';
    return;
  }

  document.querySelector('.crumb').innerHTML = '<a href="' + hub + '">← весь план</a>';
  document.getElementById('sub').textContent = PLAN.label + ' · день ' + day.d + ' из 28';
  document.getElementById('ttl').textContent = day.title;
  document.title = 'День ' + day.d + ' — ' + day.title;

  // Данные лежат в .js, а не .json: на file:// fetch заблокирован,
  // а подключение <script> работает и без локального сервера.
  var s = document.createElement('script');
  s.src = PLAN.dir + day.id + '.js';

  s.onerror = function () {
    box.innerHTML = '<div class="empty">Не удалось загрузить <code>' + PLAN.dir + day.id + '.js</code>.<br>' +
                    'Похоже, задачи для этого дня ещё не готовы. ' +
                    '<a href="' + hub + '">К плану</a>.</div>';
  };

  s.onload = function () {
    var data = window[day.v];
    if (!data || !data.questions || !data.questions.length) {
      s.onerror();
      return;
    }

    if (data.intro) {
      document.getElementById('intro').innerHTML =
        '<div class="note"><h3>' + data.intro.title + '</h3>' + data.intro.body + '</div>';
    }

    // Прогресс сохраняется по каждой задаче, поэтому день можно бросить на
    // середине и вернуться к нему вечером — говорим об этом прямо на странице.
    var rec = SASMO.getRecord(day.id);
    var started = SASMO.answeredCount(rec);
    var total = data.questions.length;

    if (rec && rec.done) {
      showResume('День уже пройден: <b>' + rec.ok + ' из ' + rec.total + '</b>' +
                 (rec.date ? ' · ' + rec.date : '') +
                 '. Ответы ниже — те же, что и в тот раз.', 'Пройти день заново');
    } else if (started > 0) {
      showResume('Продолжаем с того места: решено <b>' + started + ' из ' + total + '</b>. ' +
                 'Решай оставшиеся — всё, что уже сделано, сохранено.', 'Начать день заново');
    }

    box.innerHTML = '';
    SASMO.run({
      mount: box,
      questions: data.questions,
      mode: 'practice',
      setId: day.id
    });
  };

  function showResume(text, btnLabel) {
    var box = document.getElementById('resume');
    box.innerHTML =
      '<div class="resume"><div>' + text + '</div>' +
        '<button class="mini" id="resetDay" ' +
          'data-armed-text="Нажми ещё раз — прогресс дня сотрётся">' + btnLabel + '</button>' +
      '</div>';

    document.getElementById('resetDay').addEventListener('click', function () {
      var btn = this;
      SASMO.armReset(btn, function () {
        SASMO.resetDay(day.id);     // заодно уходят и задачи этого дня из журнала ошибок
        location.reload();
      });
    });
  }

  document.head.appendChild(s);
})();
</script>
</body>
</html>
