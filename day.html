<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Занятие дня</title>
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>

<div class="header">
  <div class="logo brand"></div>
  <div class="sub" id="sub" data-i18n="занятие">занятие</div>
  <h2 id="ttl" data-i18n="Загружаем задачи…">Загружаем задачи…</h2>
  <div class="crumb"><a href="index.html">← весь план</a></div>
  <div class="pbar"><div class="pfill" id="pf"></div></div>
  <div class="scores">
    <span class="s-ok" id="cO">0 верно</span>
    <span class="s-no" id="cN">0 неверно</span>
    <span class="s-pt" id="cP"></span>
  </div>
</div>

<div class="container">
  <div id="resume"></div>
  <div id="intro"></div>
  <div id="box"><div class="empty">Загружаем задачи…</div></div>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/plan2.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/theory.js"></script>
<script src="assets/quiz.js"></script>
<script>
(function () {
  var t = I18N.t;
  var params = new URLSearchParams(location.search);
  var PLAN = window.PLANS[params.get('g') === '2' ? 2 : 3];
  SASMO.usePlan(PLAN);

  var d = parseInt(params.get('d'), 10);
  var box = document.getElementById('box');

  var day = isNaN(d) ? null : PLAN.day(d);
  var hub = 'index.html' + (PLAN.grade === 3 ? '' : '?g=' + PLAN.grade);

  if (!day || day.kind === 'exam' || day.kind === 'review') {
    box.innerHTML = '<div class="empty">' + t('Такого занятия нет.') + ' ' +
                    '<a href="' + hub + '">' + t('Вернуться к плану') + '</a>.</div>';
    return;
  }

  var title = I18N.pick(day, 'title');
  document.querySelector('.crumb').innerHTML = '<a href="' + hub + '">' + t('← весь план') + '</a>';
  document.getElementById('sub').textContent = t('{label} · день {d} из 28', { label: PLAN.label, d: day.d });
  document.getElementById('ttl').textContent = title;
  document.title = t('День {d} — {title}', { d: day.d, title: title });

  // Данные лежат в .js, а не .json: на file:// fetch заблокирован,
  // а подключение <script> работает и без локального сервера.
  var s = document.createElement('script');
  s.src = PLAN.dir + day.id + '.js';

  s.onerror = function () {
    box.innerHTML = '<div class="empty">' +
                    t('Не удалось загрузить <code>{file}</code>.<br>Похоже, задачи для этого дня ещё не готовы.',
                      { file: PLAN.dir + day.id + '.js' }) +
                    ' <a href="' + hub + '">' + t('К плану') + '</a>.</div>';
  };

  s.onload = function () {
    var data = window[day.v];
    if (!data || !data.questions || !data.questions.length) {
      s.onerror();
      return;
    }

    if (data.intro) {
      document.getElementById('intro').innerHTML =
        '<div class="note"><h3>' + I18N.pick(data.intro, 'title') + '</h3>' +
        I18N.pick(data.intro, 'body') + '</div>';
    }

    // Прогресс сохраняется по каждой задаче, поэтому день можно бросить на
    // середине и вернуться к нему вечером — говорим об этом прямо на странице.
    var rec = SASMO.getRecord(day.id);
    var started = SASMO.answeredCount(rec);
    var total = data.questions.length;

    if (rec && rec.done) {
      showResume(t('День уже пройден: <b>{ok} из {n}</b>{date}. Ответы ниже — те же, что и в тот раз.',
                   { ok: rec.ok, n: rec.total, date: rec.date ? ' · ' + rec.date : '' }),
                 t('Пройти день заново'));
    } else if (started > 0) {
      showResume(t('Продолжаем с того места: решено <b>{a} из {n}</b>. Решай оставшиеся — всё, что уже сделано, сохранено.',
                   { a: started, n: total }),
                 t('Начать день заново'));
    }

    box.innerHTML = '';
    SASMO.run({
      mount: box,
      questions: data.questions,
      mode: 'practice',
      setId: day.id
    });
  };

  function showResume(text, btnLabel) {
    var box = document.getElementById('resume');
    box.innerHTML =
      '<div class="resume"><div>' + text + '</div>' +
        '<button class="mini" id="resetDay" ' +
          'data-armed-text="Нажми ещё раз — прогресс дня сотрётся">' + btnLabel + '</button>' +
      '</div>';

    document.getElementById('resetDay').addEventListener('click', function () {
      var btn = this;
      SASMO.armReset(btn, function () {
        SASMO.resetDay(day.id);     // заодно уходят и задачи этого дня из журнала ошибок
        location.reload();
      });
    });
  }

  document.head.appendChild(s);
})();
</script>
</body>
</html>
